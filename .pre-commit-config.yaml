repos:
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
    -   id: gitleaks

# The .enc.yaml suffix is a naming convention, so nothing stops an
# unencrypted Secret from wearing it. This checks the file actually went
# through sops rather than trusting the name.
-   repo: local
    hooks:
    -   id: sops-encrypted
        name: Ensure *.enc.yaml are actually SOPS-encrypted
        entry: scripts/check-sops-encrypted.sh
        language: script
        files: '\.enc\.ya?ml$'

# Anubis reads its policy once at startup, and initPreScript copies the custom
# templates in at pod start — so an Argo CD sync of either ConfigMap changes
# the mount and nothing else. Hashing them into a pod annotation turns the
# edit into a pod roll (op1st-emea-b4mad-aid).
-   repo: local
    hooks:
    -   id: pod-restart-hash
        name: Forgejo start-time ConfigMaps roll the pod
        entry: scripts/update-pod-restart-hash.sh
        language: script
        pass_filenames: false
        files: '^manifests/applications/b4mad-forgejo/(anubis\.yaml|home-template\.configmap\.yaml|values-nostromo\.yaml)$'

# keycloak-config-cli substitutes over raw file text before parsing YAML, so a
# substitution reference written in a comment is resolved like a real one and
# aborts the import. Valid YAML, passes kustomize build, fails only against the
# live server — exactly the class of bug worth catching mechanically.
-   repo: local
    hooks:
    -   id: realm-config-substitution
        name: No substitution variables in realm-config comments
        entry: scripts/check-realm-config-substitution.sh
        language: script
        files: 'realm-config/.*\.ya?ml$'
