apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
    name: code-scans
    annotations:
        pipelinesascode.tekton.dev/on-event: "[push,pull_request]"
        pipelinesascode.tekton.dev/on-target-branch: "[main]"
        pipelinesascode.tekton.dev/max-keep-runs: "2"
        pipelinesascode.tekton.dev/task: "[git-clone, .tekton/tasks/report-failure.yaml]"
spec:
    params:
        - name: repo_url
          value: "{{repo_url}}"
        - name: revision
          value: "{{revision}}"
    pipelineSpec:
        params:
            - name: repo_url
            - name: revision
        tasks:
            - name: clone-source
              params:
                  - name: url
                    value: $(params.repo_url)
                  - name: revision
                    value: $(params.revision)
              taskRef:
                  name: git-clone
              workspaces:
                  - name: output
                    workspace: source

            - name: gitleaks-version
              taskSpec:
                  steps:
                      - name: gitleaks
                        image: ghcr.io/gitleaks/gitleaks:v8.23.3
                        args:
                            - version

            - name: gitleaks
              runAfter:
                  - clone-source
              taskSpec:
                  workspaces:
                      - name: source
                  steps:
                      - name: gitleaks
                        image: ghcr.io/gitleaks/gitleaks:v8.23.3
                        workingDir: $(workspaces.source.path)
                        args:
                            - git
                            - $(workspaces.source.path)
                            - --verbose
                            # The report-failure task posts this step's log to a
                            # PUBLIC issue: --redact keeps matched secrets out of it.
                            - --redact
              workspaces:
                  - name: source
                    workspace: source

        # On failure: open (or comment on) a forge issue. See .tekton/README.md.
        finally:
          - name: report-failure
            when:
              - input: $(tasks.status)
                operator: in
                values: ["Failed"]
            taskRef:
              name: report-failure
            workspaces:
              - name: source
                workspace: source
            params:
              - name: PIPELINERUN_NAME
                value: $(context.pipelineRun.name)
              - name: PIPELINERUN_NAMESPACE
                value: $(context.pipelineRun.namespace)
              - name: REVISION
                value: "{{ revision }}"
              - name: SOURCE_BRANCH
                value: "{{ source_branch }}"
              - name: EVENT_TYPE
                value: "{{ event_type }}"

        workspaces:
            - name: source
    workspaces:
        - name: source
          volumeClaimTemplate:
              spec:
                  accessModes:
                      - ReadWriteOnce
                  resources:
                      requests:
                          storage: 2Gi
