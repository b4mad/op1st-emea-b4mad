apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentsview
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentsview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentsview
        # ⚠️ Not decoration. CNPG copies the Cluster's labels onto its instance
        # pods, so prod-1 also carries app.kubernetes.io/name=agentsview and is
        # matched by any Service selecting on that label alone. The Service
        # selects this component label instead, so the dashboard's endpoints
        # can never pick up the Postgres pod. (spec.selector deliberately does
        # NOT include it — a Deployment's selector is immutable, and the
        # ReplicaSet cannot adopt CNPG's pods anyway: they already have a
        # controller owner reference.)
        app.kubernetes.io/component: dashboard
    spec:
      initContainers:
        # Seed /data/config.toml from the agentsview-config ConfigMap. It has
        # to be a copy into the emptyDir rather than a mount: AgentsView
        # rewrites config.toml and locks it in place, which a read-only
        # projected file does not allow. See agentsview-config.yaml.
        - name: seed-config
          image: agentsview
          command: ["cp", "/config/config.toml", "/data/config.toml"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        # --- the dashboard, loopback-only ------------------------------------
        - name: agentsview
          image: agentsview
          # The image's entrypoint is the agentsview binary itself (since
          # 0.46.0). With AGENTSVIEW_MODE=pg-serve and args that start with a
          # flag, it runs `agentsview replica pg serve` with these args.
          # `pg serve` is read-only: no local sync, no session uploads, no file
          # watching — it only reads what the machines pushed.
          #
          # ⚠️ --host 127.0.0.1 is load-bearing. It is what makes oauth2-proxy
          # the ONLY way in: both containers share the pod network namespace,
          # so the sidecar reaches 127.0.0.1:8080 while nothing outside the pod
          # can. Change this to 0.0.0.0 and the Service would expose the whole
          # session archive — every prompt, every tool result, every secret
          # finding — with no authentication at all.
          # Explicit flags override the image's AGENTSVIEW_HOST=0.0.0.0.
          args:
            - --host
            - 127.0.0.1
            - --port
            - "8080"
            - --public-url
            - https://agentsview.b4mad.industries
          env:
            - name: AGENTSVIEW_MODE
              value: pg-serve
            # ⚠️ The image defaults to AGENTSVIEW_REQUIRE_AUTH=true (since
            # 0.46.0). oauth2-proxy sends no bearer token upstream, so with auth
            # on every page would 401. Off is safe only because of the
            # 127.0.0.1 bind above: oauth2-proxy is the authentication here.
            - name: AGENTSVIEW_REQUIRE_AUTH
              value: "false"
            # Generated and rotated by the CNPG operator for the `agentsview`
            # owner role; nothing about this connection lives in git.
            - name: AGENTSVIEW_PG_URI
              valueFrom:
                secretKeyRef:
                  name: prod-app
                  key: uri
            # ⚠️ The operator's `uri` key carries no query string, and
            # AgentsView refuses a non-local host that permits plaintext:
            #   "pg connection to prod-rw.b4mad-agentsview permits plaintext;
            #    set sslmode=require (or verify-full) for non-local hosts"
            # Appending the parameter through Kubernetes' dependent env-var
            # expansion keeps the password out of this manifest entirely — a
            # CNPG rotation that produced URL-special characters would break a
            # hand-assembled URL, but cannot break this one. `require` rather
            # than `verify-full`: CNPG signs its serving certificate with its
            # own per-cluster CA, which the image's trust store does not carry.
            - name: AGENTSVIEW_PG_URL
              value: $(AGENTSVIEW_PG_URI)?sslmode=require
          volumeMounts:
            # AGENTSVIEW_DATA_DIR=/data is baked into the image and /data is
            # created root-owned, which an OpenShift random UID cannot write.
            # An emptyDir picks up the pod's fsGroup and is writable. Nothing
            # durable lives here in pg serve mode — the archive is PostgreSQL.
            - name: data
              mountPath: /data
          # ⚠️ No probes on this container, and that is not an oversight.
          # kubelet dials the POD IP, while this process deliberately binds
          # 127.0.0.1 (see the args above) — so an httpGet or tcpSocket probe
          # can never reach it and would hold the pod at 1/2 forever. The
          # loopback bind is the security property here, so the probe is what
          # gives way. The image ships no curl or wget for an exec probe
          # either (debian-slim), and oauth2-proxy's /ping answers for itself
          # rather than the upstream, so there is no honest end-to-end check
          # to substitute. AgentsView exits on a fatal error — a bad database
          # URL crashlooped the pod visibly — so process exit is the health
          # signal, and oauth2-proxy's own readiness gates the endpoint.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # --- the authentication gate -----------------------------------------
        - name: oauth2-proxy
          image: oauth2-proxy
          # Zitadel (id.b4mad.industries), app agentsview in org erdgeschoss.
          # ⚠️ The gate is Zitadel's project_role_check on project agentsview:
          # one instance serves every org, including org git where anyone can
          # self-register via GitHub/Codeberg. Only holders of role `viewer`
          # get a token at all (b4mad-zitadel/config/main.tf).
          # Client id comes from the Secret (OAUTH2_PROXY_CLIENT_ID): Zitadel
          # generates it.
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.b4mad.industries
            - --redirect-url=https://agentsview.b4mad.industries/oauth2/callback
            - --upstream=http://127.0.0.1:8080
            - --http-address=0.0.0.0:4180
            - --scope=openid email profile
            - --email-domain=*
            - --skip-provider-button=true
            # Behind the OpenShift router: trust X-Forwarded-* so the proxy
            # builds https:// callbacks rather than http:// ones.
            - --reverse-proxy=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=12h
          env:
            # ⚠️ agentsview-oidc-zitadel is NOT sealed into this namespace.
            # The zitadel-config PostSync Job (OpenTofu) writes it into
            # b4mad-zitadel when it creates the client, and reflector mirrors
            # it here. The pod stays Pending-on-secret until reflector has
            # copied it.
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: agentsview-oidc-zitadel
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentsview-oidc-zitadel
                  key: OAUTH2_PROXY_CLIENT_SECRET
            # Cookie signing only; Zitadel never sees this one.
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentsview-cookie
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - containerPort: 4180
              name: oauth2-proxy
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: agentsview-config
