# OpenShift's ingress-to-route controller renders this as an edge-terminated
# Route, and cert-manager issues the certificate straight off the
# cluster-issuer annotation — no hand-written Certificate, no router RBAC.
# Same pattern as the dolt remotesapi Ingress in b4mad-dolt.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentsview
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
    - host: agentsview.b4mad.industries
      http:
        paths:
          # ⚠️ This rule BYPASSES oauth2-proxy by design — see
          # mcp-deployment.yaml. It reaches the MCP listener directly, which
          # gates itself on its own bearer token because an MCP client cannot
          # complete an OIDC redirect. Anything that weakens or removes that
          # token leaves the whole session archive open on the public internet.
          #
          # A path rather than a second host: one DNS name, one certificate.
          # And no rewrite is needed — `agentsview mcp --http` answers the MCP
          # JSON-RPC on every request path, so the upstream simply ignores the
          # `/mcp` prefix the router forwards verbatim. That matters because
          # OpenShift Routes cannot rewrite a path at all.
          #
          # Longest-prefix wins in HAProxy, so this rule takes precedence over
          # `/` below without depending on their order here.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: agentsview-mcp
                port:
                  number: 8085
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentsview
                port:
                  number: 4180
  tls:
    - hosts:
        - agentsview.b4mad.industries
      secretName: agentsview-tls
