apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: b4mad-agentsview

labels:
  # ⚠️ includeSelectors=false. postgres-ext selects the CNPG operator's own
  # primary pod by its cnpg.io/* labels; injecting app.kubernetes.io/name into
  # that selector would match nothing and the NodePort would go nowhere.
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: agentsview
      app.kubernetes.io/managed-by: op1st-emea-b4mad

resources:
  - namespace.yaml
  - postgresql.yaml
  - postgres-nodeport.yaml
  - agentsview-cookie.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

images:
  - name: agentsview
    newName: ghcr.io/kenn-io/agentsview
    # 0.42.0. newTag and digest are mutually exclusive in kustomize, and the
    # digest is the one that actually pins; Renovate keeps both in step.
    digest: sha256:e5aa05298c584f17cdbe21ab5352c31fb94aaebd92fa7c898c3a466372a46622
  - name: oauth2-proxy
    newName: quay.io/oauth2-proxy/oauth2-proxy
    # v7.15.4
    digest: sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
