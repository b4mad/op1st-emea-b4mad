---
# CloudNativePG cluster backing AgentsView. Single instance: nostromo is a
# single-node cluster, so there is no second node for an HA standby to land on.
#
# ⚠️ Deliberately NO barmanObjectStore backup and no ScheduledBackup, unlike
# b4mad-forgejo and b4mad-keycloak. This database is a *derived* store: every
# row is pushed here by `agentsview pg push` from a machine that keeps the
# authoritative SQLite archive under ~/.agentsview/sessions.db. Losing this
# cluster costs one `agentsview pg push --full` per machine, not data. Paying
# for S3 storage, an aws-creds SealedSecret and a nightly backup slot to
# protect a cache would be ceremony, not durability.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prod
spec:
  instances: 1
  bootstrap:
    initdb:
      database: agentsview
      owner: agentsview
  storage:
    resizeInUseVolumes: true
    size: 10Gi
    storageClass: lvms-vg1
  # Dedicated PVC for pg_wal (prod-1-wal), keeping WAL off the PGDATA volume so
  # a write burst — the first `agentsview pg push` moves a ~670MB archive —
  # cannot fill PGDATA and wedge the instance. Same pattern and size as
  # machdenstaat-oparl-lite-stage/stage-1-wal; vg1 has terabytes free.
  #
  # ⚠️ One-way. Upstream: "Removing walStorage isn't supported. Once added, a
  # separate volume for WALs can't be removed from an existing Postgres
  # cluster." Adding it to a live cluster restarts the single instance, so the
  # dashboard and any in-flight push drop briefly. If the WAL migration goes
  # wrong, the recovery here is cheap and boring: this database is derived, so
  # delete the cluster and re-run `agentsview pg push --full` per machine.
  walStorage:
    resizeInUseVolumes: true
    size: 12Gi
    storageClass: lvms-vg1
  monitoring:
    customQueriesConfigMap:
      - key: queries
        name: cnpg-default-monitoring
    disableDefaultQueries: false
    # enablePodMonitor is deprecated; the PodMonitor is managed manually below.
    enablePodMonitor: false
  postgresql:
    parameters:
      pgaudit.log: "none, -misc"
---
# Manually managed PodMonitor, replacing the deprecated
# spec.monitoring.enablePodMonitor. Selector/port match what the CNPG operator
# generates for a Cluster's instance pods.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: prod
spec:
  namespaceSelector: {}
  selector:
    matchLabels:
      cnpg.io/cluster: prod
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
