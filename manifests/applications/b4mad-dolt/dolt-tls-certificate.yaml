apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dolt-tls
spec:
  secretName: dolt-tls
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048

  usages:
    - server auth

  commonName: dolt.b4mad.industries

  dnsNames:
    - dolt.b4mad.industries

  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
