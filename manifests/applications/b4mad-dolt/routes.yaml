---
# MySQL wire protocol. HAProxy only routes HTTP/HTTPS or passes TLS through
# by SNI, and raw MySQL is neither — so dolt terminates its own cert
# (listener.tls_* in servercfg.yaml, mounted from Certificate/dolt-tls) and
# the router just moves bytes. Clients therefore connect on 443, not 3306:
#   mysql --ssl-mode=REQUIRED -h dolt.b4mad.industries -P 443 -u root -p
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dolt-sql-server
spec:
  host: dolt.b4mad.industries
  to:
    kind: Service
    name: dolt-sql-server
  port:
    targetPort: mysql
  tls:
    termination: passthrough

---
# The remotesapi endpoint (clone/push/pull/fetch) speaks gRPC over plain
# HTTP, so unlike the MySQL Route above this one can terminate TLS at the
# router — no passthrough, no cert mounted in the pod.
#
# ⚠️ The hostname deliberately sits on the *.apps wildcard domain rather than
# b4mad.industries: an edge Route serves the router's default certificate,
# which only covers *.apps.nostromo.…. A custom hostname would need its own
# cert plumbed into the Route (spec.tls.externalCertificate + router RBAC),
# which is not set up on this cluster. Moving it to
# doltremote.b4mad.industries later is a cert problem, not a routing one.
#
# gRPC needs HTTP/2, which is on cluster-wide via the
# ingress.operator.openshift.io/default-enable-http2 annotation on
# ingresses.config/cluster.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dolt-remotesapi
spec:
  host: dolt-remotesapi.apps.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud
  to:
    kind: Service
    name: dolt-sql-server
  port:
    targetPort: remotesapi
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
