apiVersion: v1
kind: ConfigMap
metadata:
  name: dolt-servercfg
data:
  config.yaml: |
    # No TLS on the MySQL port on purpose. It has no external route (see
    # ingress.yaml — HAProxy cannot carry the MySQL protocol), so the only
    # clients are in-cluster workloads and `oc port-forward`. A public CA
    # cert would actively get in the way there: Let's Encrypt will not issue
    # for 127.0.0.1, so every port-forwarded client would fail verification
    # with "cannot validate certificate for 127.0.0.1 ... no IP SANs".
    #
    # ⚠️ Trade-off: MySQL traffic is plaintext on the pod network. Acceptable
    # for a single-tenant cluster; revisit if this server ever gains
    # consumers outside it.
    listener:
      host: 0.0.0.0
      port: 3306
    metrics:
      host: 0.0.0.0
      port: 9102
      labels:
        process: dolt-sql-server
    # Lets clients clone/push/pull/fetch databases from this server, the way
    # they would from DoltHub. Plain HTTP/gRPC — TLS is terminated at the
    # Route, not here (the listener's tls_* keys cover the MySQL port only).
    # Auth reuses the SQL users: `dolt clone --user root http://<host>/<db>`
    # with DOLT_REMOTE_PASSWORD set.
    #
    # Left read-write on purpose. Set `read_only: true` to accept clone/pull/
    # fetch but reject push.
    remotesapi:
      port: 22222
