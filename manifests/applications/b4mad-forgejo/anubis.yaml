---
# Anubis — proof-of-work interstitial in front of the forge web UI.
#
# The container itself is NOT here: it is a sidecar in the Forgejo pod, declared
# as `extraContainers` in values-nostromo.yaml (the chart owns the Deployment,
# so that is the only place it can live). This file holds the two pieces the
# chart cannot express: the policy file and the scrape config.
#
# Topology (see values-nostromo.yaml, section "Anubis"):
#
#   ingress -> svc/forgejo-http :8080 (name: anubis)
#                -> pod: [anubis :8080] --localhost--> [forgejo :3000]
#
# Anubis is the enforcement half of the robots.txt added in cbb0e4e, whose own
# comment concedes that robots.txt "is advisory […] NOT a protection". A
# `Mozilla`-bearing user agent has to burn CPU on a SHA-256 proof of work before
# it sees a page; everything machine-shaped is allowed straight through by the
# policy below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anubis-policy
data:
  # Mounted read-only at /etc/anubis; POLICY_FNAME points at it.
  #
  # ⚠️ Anubis reads this file ONCE, at startup — updating the ConfigMap alone
  # changes nothing in the running forge. The pod is rolled by the
  # gitea.podAnnotations restart-hash in values-nostromo.yaml, which
  # scripts/update-pod-restart-hash.sh recomputes from this file; the
  # pre-commit hook of the same name fails the commit if you skip it. After
  # the sync lands, verify with scripts/anubis-smoke.sh.
  #
  # `(data)/…` imports resolve against the policy snippets baked into the Anubis
  # image (github.com/TecharoHQ/anubis, data/). Using imports rather than inline
  # rules means an image bump picks up upstream's maintained bot lists.
  #
  # ⚠️ Anubis DEFAULT-ALLOWS anything no rule matches, and only challenges user
  # agents containing "Mozilla". git, curl, skopeo and API clients would
  # therefore pass even with an empty policy — the allow-imports below are here
  # so that stays a contract rather than an accident.
  botPolicies.yaml: |
    bots:
      # Deny outright: malformed/abusive request shapes, and the AI scraper
      # fleet by name. "aggressive" is the strictest of upstream's three AI
      # presets and matches the intent of our robots.txt, which lists the same
      # union of Codeberg's and block-ai-robots' agents.
      - import: (data)/bots/_deny-pathological.yaml
      - import: (data)/bots/aggressive-brazilian-scrapers.yaml
      - import: (data)/meta/ai-block-aggressive.yaml

      # ⚠️ The imports above are NOT sufficient, because Anubis only ever
      # CHALLENGES a user agent containing "Mozilla" and default-ALLOWs
      # everything else. A scraper that omits "Mozilla" and is not named by an
      # import walks straight in. CommonCrawl does exactly that — its real
      # agent is `CCBot/2.0 (https://commoncrawl.org/faq/)` — so until this
      # rule existed it scraped the forge unimpeded while robots.txt told it
      # not to (op1st-emea-b4mad-las, found by scripts/anubis-smoke.sh).
      #
      # This rule closes the gap by restating the SAME agent list that
      # robots.txt publishes, as enforcement rather than as a request. The two
      # lists are a pair:
      #
      #   robots.txt  home-template.configmap.yaml, "AI training / scraping
      #               agents: not welcome" — the advisory half
      #   this rule   the enforcement half
      #
      # ⚠️ Change one and you must change the other, or the forge starts
      # promising something it does not do (or blocking something it never
      # announced). Both lists are the union of Codeberg's and
      # block-ai-robots'.
      #
      # Names are collapsed to their shortest unambiguous prefix under (?i)
      # — `Claude(-Web|Bot)` covers both, `omgili` covers omgilibot, etc. The
      # regex must not match a crawler allowed below: Googlebot is safe
      # because only `Google-Extended` and `GoogleOther` are listed.
      - name: robots-txt-ai-agents
        action: DENY
        user_agent_regex: >-
          (?i)(AI2Bot|Amazonbot|anthropic-ai|Applebot-Extended|Brightbot|Bytespider|CCBot|ChatGPT-User|Claude(-Web|Bot)|cohere-|Crawlspace|Diffbot|DuckAssistBot|facebook(bot|externalhit)|FriendlyCrawler|Google(-Extended|Other)|GPTBot|iaskspider|ICC-Crawler|ImagesiftBot|img2dataset|imgproxy|ISSCyberRiskCrawler|Kangaroo Bot|Meta-External(Agent|Fetcher)|NovaAct|OAI-SearchBot|omgili|Operator|PanguBot|Perplexity|PetalBot|Scrapy|SemrushBot-(OCOB|SWA)|Sidetrade indexer bot|Timpibot|VelenPublicWebCrawler|Webzio-Extended|YouBot)

      # A client stuck in a pagination loop. On 2026-08-19 something on the
      # home LAN walked /api/v1/repos/agentic-forges/castra/pulls/29/files at
      # ~22 req/s for hours, reaching page 2,211,449 and burning 0.8 cores in
      # the Forgejo container continuously. The endpoint answers 200 with `[]`
      # well before that, so the server is behaving and the client simply never
      # checks — nothing server-side fixes it except refusing the request.
      #
      # ⚠️ This rule MUST stay above `(data)/apps/allow-api-routes.yaml`: that
      # import ALLOWs everything under /api/, first match wins, and below it
      # this rule would never be reached.
      #
      # Deliberately NOT a rate limit on the Route. Under the hairpin NAT here
      # every LAN client — laptop, `git push`, and the borg pipeline's skopeo
      # copy through the public route — shares one source IP, so a per-IP
      # bucket would let the runaway starve all of them.
      #
      # The threshold is expressed as digit count rather than int(query["page"])
      # because a non-numeric `page` would fail the conversion and take the
      # whole expression down with it. >4 digits means page >= 10000, i.e. more
      # than 500k files into a pull request: unreachable by any real client,
      # and the loop is five orders of magnitude past it.
      - name: runaway-pull-files-pagination
        action: DENY
        expression:
          all:
            - path.matches("^/api/v1/repos/[^/]+/[^/]+/pulls/[0-9]+/files$")
            - '"page" in query'
            - size(query["page"]) > 4

      # Allow the search engines that actually index this forge. Without this
      # they would meet the challenge page, fail it, and drop the forge out of
      # their index — the robots.txt already tells them which paths to skip.
      - import: (data)/crawlers/_allow-good.yaml
      # x.ai runs a scraper known for flattening git forges; challenge it.
      - import: (data)/crawlers/xai.yaml
      - import: (data)/clients/x-firefox-ai.yaml

      # /.well-known (ACME, OIDC discovery), /favicon.*, /robots.txt, sitemap.
      # ⚠️ This is what makes SERVE_ROBOTS_TXT=false meaningful: the rule ALLOWs
      # /robots.txt through to Forgejo, which serves the curated file from
      # home-template.configmap.yaml. Anubis' own built-in robots.txt would
      # shadow it.
      - import: (data)/common/keep-internet-working.yaml

      # Machine clients that must never see an interstitial:
      #   git.yaml           git / libgit2 / JGit / go-git — clone, fetch, push
      #   docker-client.yaml /v2/ registry API — skopeo, buildah, podman, crane,
      #                      containerd, Renovate. Load-bearing: the borg build
      #                      in borg-pipeline.yaml skopeo-copies to
      #                      git.b4mad.industries/b4mad-release-bot/borg through
      #                      the PUBLIC route, so it transits Anubis.
      #   gitea-rss-feeds    *.atom / *.rss, which feed readers fetch with
      #                      browser-ish user agents.
      #   allow-api-routes   write traffic to /api/.
      - import: (data)/clients/git.yaml
      - import: (data)/clients/docker-client.yaml
      - import: (data)/apps/gitea-rss-feeds.yaml
      - import: (data)/apps/allow-api-routes.yaml

      # ⚠️ THIS RULE IS WHAT MAKES ANUBIS DO ANYTHING AT ALL. Delete it and the
      # whole deployment silently degrades to a transparent proxy.
      #
      # Anubis does not challenge on a match; it accumulates WEIGHT and
      # challenges once a request crosses the built-in threshold. Nothing above
      # adds weight — the imports only DENY or ALLOW — so without this catchall
      # every browser is proxied straight through with no proof of work.
      # Verified against v1.26.2 locally before this shipped: with the rule
      # absent a Firefox user agent got the target's response, with it present
      # it gets the interstitial. It is upstream's own last rule in
      # data/botPolicies.yaml, kept last here for the same reason — the ALLOW
      # imports above must win first.
      #
      # (data)/common/acts-like-browser.yaml would subtract weight again to let
      # well-behaved Chrome/Firefox skip the challenge. Deliberately NOT
      # imported: upstream marks it "known to be bypassed by some of the worst
      # automated scrapers", and one ~1s proof of work per 7 days is a fair
      # price for a human.
      - name: generic-browser
        user_agent_regex: Mozilla|Opera
        action: WEIGH
        weight:
          adjust: 10

    # ⚠️ THIS IS A PUBLISHED PRIVACY COMMITMENT, NOT A LOG-VERBOSITY PREFERENCE.
    # privacy.html (home-template.configmap.yaml, §3) states in a highlighted
    # box that no access logs with IP addresses are kept.
    #
    # Anubis attaches BOTH `x-forwarded-for` and `x-real-ip` to every line its
    # request logger emits — internal/log.go, GetRequestLogger() — and its
    # default level (INFO) is described upstream as "fairly verbose", one line
    # per request. At INFO this instance would log the IP address of every
    # visitor and the privacy statement would be false within seconds of the
    # pod starting.
    #
    # ERROR is the technical measure behind that statement. Raising it — here or
    # via SLOG_LEVEL in values-nostromo.yaml, which is set to ERROR for the same
    # reason — requires amending privacy.html §3 in the same commit.
    #
    # Residual, and disclosed in §3: an error-path line goes through the same
    # GetRequestLogger and would still carry the address. It lives only in the
    # pod's stdout ring and is gone on restart; nothing collects it.
    logging:
      sink: stdio
      level: ERROR
---
# Scrape the sidecar's metrics listener (:9090, service port `anubis-metrics`).
#
# Hand-written rather than chart-generated: gitea.metrics.serviceMonitor only
# knows about the chart's own `http` port. This does NOT contradict the
# "scrape config lives with the things being scraped" note in kustomization.yaml
# — the thing being scraped is declared in Helm values, which cannot carry a
# ServiceMonitor. Alerts on these series live in monitoring.yaml with the rest.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: anubis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/instance: forgejo
  endpoints:
    # Yields job/service "forgejo-http" with endpoint="anubis-metrics" — the
    # Service is shared with Forgejo, so the port name is what distinguishes
    # these series from the Forgejo ones.
    - port: anubis-metrics
      path: /metrics
      interval: 30s
