# Scheduled logical backup of the Forgejo test instance.
#
# A daily CronJob runs `forgejo dump` (app-consistent archive: DB + repos +
# LFS + attachments + packages + config) into a DEDICATED backup PVC, keeping
# the last archive only. This is the same forgejo image the app runs, mounting
# the live data PVC read-only.
#
# ⚠️ LOCAL RETENTION IS 1, DELIBERATELY. This PVC is a staging area for the
# off-site borg push (offsite-cronjob.yaml), which is where deep history
# lives: keep-daily 7 + keep-weekly 4 on store-1. Holding 7 archives here
# cost ~21G against a 10Gi PVC and filled the disk on 2026-08-01, breaking
# every run for six days (Systems-agaa). Local = "the copy waiting to ship",
# not an archive.
#
# ⚠️ RETENTION IS 1 RATHER THAN 2 BECAUSE DUMPS ARE GROWING FAST. Measured
# archive sizes: 2.04G (07-29), 3.00G (07-30), 3.02G (07-31), 8.39G (08-06).
# Peak usage is RETENTION+1 dumps, so retention 2 would have needed >25G
# against the 24Gi first proposed here — it would have fitted for two nights
# and then broken again on 08-08. Retention 1 peaks at ~17G. The 2.8x jump in
# six days is itself unexplained and tracked separately; if it turns out to be
# a one-off (a package/registry import, say) retention 2 becomes affordable
# again on a 32Gi volume.
#
# ⚠️ THE PRUNE RUNS BEFORE THE DUMP. Pruning afterwards cannot free space for
# the write it is about to make, which is the other half of the same bug.
#
# ⚠️ SCOPE: dumps land on lvms (same node/disk as the data PVC), so this
# protects against accidental deletion, bad upgrades and app-level corruption
# — NOT against node/disk loss. Off-site shipping is a separate phase (see
# docs/backup-restore.md).
#
# ⚠️ SQLite is dumped live (file copy). SQLite recovers its WAL on open, but a
# restore should always run `forgejo doctor --run all --fix`. For a guaranteed-
# consistent dump, quiesce first (scale deploy/forgejo to 0).
#
# Apply:
#   oc -n b4mad-forgejo apply -f backup-cronjob.yaml
# Run once now:
#   oc -n b4mad-forgejo create job --from=cronjob/forgejo-backup forgejo-backup-manual
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-backup
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: lvms-vg1
  resources:
    requests:
      # Sized for RETENTION+1 = 2 dumps, plus the 1.5x preflight margin the
      # script demands before it will start writing. The binding constraint
      # is therefore 2.5x a single dump, not 2x.
      #
      # The dump did "roughly double again" exactly as the previous 32Gi note
      # predicted, and that broke the 08-19 run: 8.39G (08-06) -> 6.5G (08-17) ->
      # 13.93G (08-18). Preflight wanted 20.9G free, had 17.7G, failed all
      # three attempts. 32Gi could not have held it — peak need was ~34.8G.
      #
      # At 64Gi the ceiling is a single dump of ~25G. Growth is driven by
      # /data/packages (8.3G of 10.6G in the live data PVC, fed by CI package
      # publishes), so expect to revisit; watch the trend rather than waiting
      # for the alert. lvms-vg1 has allowVolumeExpansion: true and node bridge
      # has ~7.8TiB free in vg1, so this can grow in place again.
      storage: 64Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-backup
spec:
  schedule: "0 3 * * *"
  # ⚠️ Must be UTC (or omitted), never a named zone like Europe/Berlin:
  # OpenShift's kube-state-metrics image ships without tzdata, so a named
  # .spec.timeZone makes KSM panic/CrashLoopBackOff cluster-wide (TargetDown).
  # 03:00 UTC == 05:00 Europe/Berlin (CEST) / 04:00 (CET).
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          # ⚠️ Never, NOT OnFailure. With OnFailure the Job controller DELETES
          # the pod once backoffLimit trips, taking the logs with it — which
          # is why six days of failures left nothing to read but
          # "error: timed out waiting for the condition" (that string is
          # `oc logs` complaining the pod is gone, not the dump's error).
          # With Never each attempt is a separate pod that STAYS, so
          # `oc -n b4mad-forgejo logs <pod>` shows what actually happened.
          restartPolicy: Never
          # No securityContext: OpenShift's restricted-v2 SCC injects a UID and
          # fsGroup from the namespace range, matching the app pod so the data
          # PVC (group-owned) is readable and the backup PVC is writable.
          containers:
            - name: dump
              image: code.forgejo.org/forgejo/forgejo:16.0.2-rootless
              command: [sh, -c]
              args:
                - |
                  set -eu
                  RETENTION=1

                  prune() {
                    # Keep the ${RETENTION} newest archives, drop the rest.
                    ls -1t /backup/forgejo-*.tar.zst 2>/dev/null \
                      | tail -n +$((RETENTION + 1)) \
                      | while read -r f; do echo "pruning ${f}"; rm -f "${f}"; done
                  }

                  # 1. PRUNE FIRST. Keeps ${RETENTION} known-good archive(s) —
                  #    we never delete a good dump to make room for one that
                  #    might fail. Peak usage is therefore RETENTION+1 dumps.
                  echo "== prune before dump (keep ${RETENTION}) =="
                  prune

                  # 2. PREFLIGHT. `forgejo dump` reports ENOSPC only after it
                  #    has already burned an hour, and the job controller
                  #    deletes the pod before anyone reads the log. Fail here
                  #    instead, loudly and in one second.
                  echo "== preflight =="
                  df -h /backup
                  AVAIL_K=$(df -Pk /backup | awk 'NR==2 {print $4}')
                  LAST=$(ls -1t /backup/forgejo-*.tar.zst 2>/dev/null | head -n1)
                  if [ -n "${LAST}" ]; then
                    # 1.5x the last dump. Measured 2026-08-06: with 4.2G free
                    # and a 3.0G predecessor, a 1.3x margin passed preflight
                    # and the dump STILL hit ENOSPC — the forge outgrows its
                    # last archive faster than that. This is a sanity floor,
                    # not a prediction; the ENOSPC handler below is the real
                    # safety net, and PVC capacity is the real fix.
                    NEED_K=$(( $(du -k "${LAST}" | awk '{print $1}') * 15 / 10 ))
                  else
                    # Nothing to size against: demand a flat 6G.
                    NEED_K=$(( 6 * 1024 * 1024 ))
                  fi
                  if [ "${AVAIL_K}" -lt "${NEED_K}" ]; then
                    echo "FATAL: /backup has ${AVAIL_K}K free, need ~${NEED_K}K" >&2
                    echo "       (1.3x the last dump, or 4G if there is none)" >&2
                    echo "       Grow PVC forgejo-backup or lower RETENTION." >&2
                    ls -la /backup >&2
                    exit 1
                  fi
                  echo "ok: ${AVAIL_K}K free, need ~${NEED_K}K"

                  # 3. DUMP.
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  OUT="/backup/forgejo-${TS}.tar.zst"
                  echo "== dumping to ${OUT} =="
                  # --skip-index: bleve code index is rebuildable, don't archive it
                  if ! forgejo dump -c /data/gitea/conf/app.ini \
                         --type tar.zst --tempdir /tmp --skip-index -q -f "${OUT}"; then
                    # A partial archive is worse than none: offsite-cronjob.yaml
                    # ships the NEWEST file in /backup, and would happily push
                    # this truncated one and call it a success.
                    echo "FATAL: forgejo dump failed, removing partial ${OUT}" >&2
                    rm -f "${OUT}"
                    df -h /backup >&2
                    exit 1
                  fi
                  echo "wrote: $(ls -la "${OUT}")"

                  # 4. PRUNE AGAIN, now that the new dump is safely on disk.
                  echo "== prune after dump (keep ${RETENTION}) =="
                  prune
                  echo "== current archives =="; ls -1t /backup/forgejo-*.tar.zst
                  df -h /backup
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: gitea-shared-storage
            - name: backup
              persistentVolumeClaim:
                claimName: forgejo-backup
            - name: tmp
              emptyDir: {}
