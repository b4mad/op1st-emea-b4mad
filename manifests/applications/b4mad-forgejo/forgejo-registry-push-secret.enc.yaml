# Forgejo container-registry push credential for the Tekton `borg-build`
# pipeline's ADDITIVE `push-forgejo` task (see forgejo-borg-pipeline.yaml).
#
# WHY: the pipeline mirrors the freshly-built `borg` image to the Forgejo test
# instance's OCI registry at forgejo.b4mad.net/goern/borg:latest so it surfaces
# under https://forgejo.b4mad.net/goern/…/packages. Pushing there needs a
# docker `config.json` credential; this Secret carries exactly that.
#
# IDENTITY (decision — see forgejo-borg-pipeline.yaml header + repo notes):
# the registry namespace `goern` is a Forgejo *user* (not an org). In Forgejo,
# packages under a user namespace can be written ONLY by that user or a site
# admin — a separate non-admin bot cannot. So this credential is a named,
# narrowly-scoped (`write:package`) personal access token belonging to `goern`
# itself (token name: b4mad-ci-registry). This is least-privilege for the push
# target and needs no new site-admin account. Reversible: revoke the named
# token in Forgejo and delete this Secret.
#
# THROWAWAY: forgejo.b4mad.net is a throwaway SQLite test instance (bd
# Systems-07w). This token — and anything pushed to the registry — is
# non-durable; if the volume is lost, recreate the token (owner `goern`,
# scope write:package) and re-encrypt this file.
#
# SOPS-encrypted (PGP recipient in .sops.yaml; encrypted_regex ^(data|stringData|tls)$).
# Apply before running the pipeline:
#   sops -d forgejo-registry-push-secret.enc.yaml | oc apply -f -
