    <main><article>

    <h1>Datenschutzerklärung</h1>

    <p class="meta">
      Git-Forge #B4mad Forge · <code>git.b4mad.industries</code> ·
      <code>forgejo.b4mad.net</code> · Stand: 6. August 2026
    </p>

    <p>
      Diese Erklärung gilt ausschließlich für diesen Dienst. Für die Website
      <a href="https://b4mad.industries/">b4mad.industries</a> gilt die dort
      veröffentlichte Datenschutzerklärung.
    </p>

    <h2>1. Verantwortlicher</h2>
    <p>
      Christoph Görn<br>
      Müldorfer Anger 34<br>
      53229 Bonn
    </p>
    <p>
      Kontakt: siehe <a href="https://b4mad.industries/legal/impressum/">Impressum</a>.
    </p>
    <p>
      Ein Datenschutzbeauftragter ist nicht bestellt; die Voraussetzungen des
      § 38 BDSG liegen nicht vor.
    </p>

    <h2>2. Was dieser Dienst ist</h2>
    <p>
      #B4mad Forge ist eine selbst betriebene Instanz der freien Software
      <a href="https://forgejo.org/">Forgejo</a>. Sie dient dem Hosten von
      Git-Repositories und der Zusammenarbeit daran — Issues, Pull Requests,
      Releases. Der Dienst läuft auf Infrastruktur, die der Verantwortliche selbst
      betreibt; er ist nicht bei einem Cloud-Anbieter gehostet.
    </p>

    <h2>3. Zugriffsdaten (Server-Logs)</h2>
    <p>
      Bei jedem Aufruf werden technisch notwendige Zugriffsdaten verarbeitet:
      IP-Adresse, Zeitpunkt, angeforderte Ressource, HTTP-Statuscode, übertragene
      Datenmenge, User-Agent und Referrer. Gleichartige Verbindungsdaten fallen bei
      Git-Zugriffen über SSH an.
    </p>
    <p>
      Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO; das berechtigte Interesse
      liegt im sicheren und störungsfreien Betrieb sowie in der Abwehr von
      Missbrauch. Eine Zusammenführung dieser Daten mit Benutzerkonten zu
      Auswertungszwecken findet nicht statt.
    </p>

    <h2>4. Benutzerkonto und Anmeldung</h2>
    <p>
      Eine Registrierung mit Benutzername und Passwort ist nicht möglich. Die
      Anmeldung erfolgt ausschließlich über den Single-Sign-on-Dienst (Keycloak)
      unter <code>keycloak.erdgeschoss.b4mad.net</code>, der ebenfalls vom
      Verantwortlichen betrieben wird.
    </p>
    <p>
      Bei der ersten Anmeldung wird automatisch ein Forge-Konto angelegt. Aus dem
      SSO werden dabei übernommen: Benutzername, E-Mail-Adresse, Anzeigename sowie
      die Gruppenzugehörigkeit — letztere zur Vergabe von Administratorrechten. Im
      Konto entstehen weiter: Zeitpunkt der letzten Anmeldung, von Ihnen
      hinterlegte SSH- und GPG-Public-Keys, von Ihnen erzeugte Zugriffstoken sowie
      Ihre Einstellungen.
    </p>
    <p>
      Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO — Bereitstellung des Dienstes
      Ihnen gegenüber — bzw. Art. 6 Abs. 1 lit. f DSGVO.
    </p>

    <h2>5. Von Ihnen eingestellte Inhalte</h2>
    <p>
      Repositories, Commits, Issues, Pull Requests, Kommentare, Anhänge und
      Releases werden gespeichert, um den Dienst zu erbringen.
    </p>
    <div class="note">
      <p>
        <b>Bitte beachten:</b> Git-Commits enthalten den von Ihnen konfigurierten
        Autorennamen und die Autoren-E-Mail-Adresse. Diese Angaben sind
        untrennbarer Bestandteil der Git-Historie. Bei öffentlichen Repositories
        sind sie — wie der gesamte Inhalt — weltweit ohne Anmeldung abrufbar und
        können von Dritten kopiert werden. Auf Kopien, die Dritte durch
        <code>git clone</code> angefertigt haben, hat der Verantwortliche keinen
        Einfluss.
      </p>
    </div>
    <p>
      Wenn Sie dies vermeiden möchten, konfigurieren Sie in Git vor dem ersten
      Commit einen Pseudonym-Namen und eine Weiterleitungs- oder Noreply-Adresse.
    </p>

    <h2>6. Cookies</h2>
    <p>
      Es werden ausschließlich technisch notwendige Cookies gesetzt — kein
      Tracking, keine Reichweitenmessung, keine Werbung, keine Einbindung von
      Analyse-Diensten. Eine Einwilligung ist dafür nach § 25 Abs. 2 TDDDG nicht
      erforderlich.
    </p>
    <div class="wrap">
      <table>
        <tr><th>Cookie</th><th>Zweck</th><th>Dauer</th></tr>
        <tr><td><code>i_like_gitea</code></td><td>Sitzungskennung nach der Anmeldung</td><td>Sitzung</td></tr>
        <tr><td><code>_csrf</code></td><td>Schutz vor Cross-Site-Request-Forgery</td><td>Sitzung / kurzlebig</td></tr>
        <tr><td><code>lang</code></td><td>gewählte Oberflächensprache</td><td>dauerhaft</td></tr>
        <tr><td><code>redirect_to</code></td><td>merkt die vor der Anmeldung aufgerufene Seite</td><td>kurzlebig</td></tr>
      </table>
    </div>

    <h2>7. Empfänger und Auftragsverarbeiter</h2>
    <p>
      Eine Weitergabe zu Werbe- oder Analysezwecken findet nicht statt.
      Datenverarbeitung findet gegenüber folgenden Stellen statt:
    </p>
    <div class="wrap">
      <table>
        <tr><th>Empfänger</th><th>Anlass</th></tr>
        <tr>
          <td>Hetzner Online GmbH, Gunzenhausen (DE)</td>
          <td>Versand der Benachrichtigungs- und System-E-Mails der Forge über den
              dort betriebenen Mailserver</td>
        </tr>
        <tr>
          <td>Amazon Web Services (S3)</td>
          <td>verschlüsselte Sicherungen der Datenbank — Konten, Issues,
              Kommentare — als Auftragsverarbeitung</td>
        </tr>
        <tr>
          <td>Öffentlichkeit</td>
          <td>Inhalte öffentlicher Repositories einschließlich der Commit-Metadaten
              (siehe Abschnitt 5)</td>
        </tr>
      </table>
    </div>
    <p>
      Die Sicherungen der Repository-Daten — Git-Inhalte und Anhänge — verbleiben
      vollständig auf einem eigenen, verschlüsselten Speichersystem des
      Verantwortlichen. Ein Repository-Spiegel zu Dritten besteht derzeit nicht.
    </p>

    <h2>8. Profilbilder (Avatare)</h2>
    <p>
      Externe Avatar-Dienste werden nicht kontaktiert. Gravatar und föderierte
      Avatare sind auf dieser Instanz abgeschaltet: Haben Sie kein eigenes
      Profilbild hochgeladen, erzeugt Forgejo lokal ein Bildmuster. Ihre
      E-Mail-Adresse — auch als Hashwert — verlässt die Instanz dafür nicht.
    </p>

    <h2>9. Verschlüsselung</h2>
    <p>
      Die Verbindung ist per TLS verschlüsselt. Die Zertifikate werden über
      Let&#39;s Encrypt (ISRG) ausgestellt; dabei werden lediglich die Hostnamen des
      Dienstes verarbeitet, keine Nutzerdaten.
    </p>

    <h2>10. Speicherdauer</h2>
    <div class="wrap">
      <table>
        <tr><th>Daten</th><th>Dauer</th></tr>
        <tr><td>Server-Logs</td><td>kurzfristig, nur zur Störungs- und Missbrauchsanalyse</td></tr>
        <tr><td>Konto- und Inhaltsdaten</td><td>bis zur Löschung des Kontos bzw. des Inhalts</td></tr>
        <tr><td>Datenbank-Sicherungen</td><td>bis zu 30 Tage</td></tr>
        <tr><td>Off-site-Sicherungen</td><td>7 tägliche und 4 wöchentliche Stände (max. ca. 5 Wochen)</td></tr>
      </table>
    </div>
    <p>
      Gelöschte Daten können daher bis zum Ablauf der jeweiligen Sicherungsfrist
      noch in Backups vorhanden sein; sie werden dort nicht weiterverarbeitet und
      laufen turnusmäßig aus.
    </p>

    <h2>11. Ihre Rechte</h2>
    <p>
      Sie haben das Recht auf Auskunft (Art. 15 DSGVO), Berichtigung (Art. 16),
      Löschung (Art. 17), Einschränkung der Verarbeitung (Art. 18),
      Datenübertragbarkeit (Art. 20) sowie ein Widerspruchsrecht gegen
      Verarbeitungen auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO (Art. 21).
    </p>
    <div class="note">
      <p>
        <b>Grenzen der Löschung:</b> Ihr Konto und Ihre Profildaten können
        vollständig gelöscht werden. Commit-Metadaten in bereits veröffentlichten
        Repositories lassen sich technisch nur durch ein Umschreiben der
        Git-Historie entfernen — das betrifft alle weiteren Beteiligten und wirkt
        nicht auf Kopien, die Dritte bereits gezogen haben. Sprechen Sie uns an;
        wir setzen um, was technisch möglich ist, und sagen offen, was es nicht
        ist.
      </p>
    </div>
    <p>
      Ihnen steht ferner ein Beschwerderecht bei einer Aufsichtsbehörde zu
      (Art. 77 DSGVO); für den Verantwortlichen zuständig ist die
      Landesbeauftragte für Datenschutz und Informationsfreiheit
      Nordrhein-Westfalen.
    </p>
    <p>
      Eine automatisierte Entscheidungsfindung einschließlich Profiling findet
      nicht statt.
    </p>

    <h2>12. Öffentliche Metriken</h2>
    <p>
      Unter <code>/metrics</code> stellt die Instanz Betriebskennzahlen im
      Prometheus-Format bereit, etwa die Anzahl der Repositories, Issues und
      Konten. Es handelt sich um aggregierte Zählwerte ohne Personen- oder
      Inhaltsbezug.
    </p>

    </article></main>
