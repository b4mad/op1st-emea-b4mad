# Custom Forgejo landing page (templates/home.tmpl override).
# Mounted read-only at /data/gitea/templates/home.tmpl via extraVolumes/
# extraVolumeMounts in values-nostromo.yaml. Forgejo replaces the whole
# home.tmpl, so this file IS the landing page for anonymous (and signed-out)
# visitors. Based on Forgejo v16.0.1's default templates/home.tmpl.
#
# The <style> block gives the hero a #B4mad phosphor-terminal look — echoing
# https://b4mad.industries/ — but ONLY in dark mode (forgejo-dark, or the
# default forgejo-auto theme under prefers-color-scheme: dark). Light mode
# keeps Forgejo's defaults. Only the home hero is styled, not Forgejo's chrome.
#
# ⚠️ The Sign-in buttons link straight to /user/oauth2/b4mad (Forgejo's
# "start OIDC flow" route) instead of /user/login, skipping the interstitial
# login page — internal signin is off, so that page only ever showed this one
# button. `b4mad` MUST stay in sync with gitea.oauth[0].name in
# values-nostromo.yaml; rename the login source and these links 404.
#
# To change the page: edit the home.tmpl content below, re-apply this
# ConfigMap, and bounce the pod (subPath configmap mounts don't hot-reload):
#   oc -n b4mad-forgejo apply -f home-template.configmap.yaml
#   oc -n b4mad-forgejo rollout restart deploy/forgejo
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-custom-templates
data:
  home.tmpl: |
    {{template "base/head" .}}
    <style>
      /* ---- #B4mad phosphor-terminal flavor for the landing hero ---- */
      /* Palette from https://b4mad.industries/ : phosphor green #698b69/#9bcd9b,
         warm-white cursor #f4f1e8, orange accent. Colours/glow are driven by
         CSS vars that are ONLY set under a dark theme, so light mode is
         untouched (undefined var -> declaration ignored -> Forgejo default). */
      .b4mad-hero { position: relative; font-family: "Josefin Sans", ui-sans-serif, "Helvetica Neue", Arial, sans-serif; }
      .b4mad-hero > * { position: relative; z-index: 2; }
      .b4mad-hero::before {
        content: ""; position: absolute; inset: -1rem; z-index: 1; pointer-events: none;
        border-radius: .5rem; opacity: var(--b4-scanline, 0);
        background: repeating-linear-gradient(to bottom,
          transparent 0, transparent 2px, rgba(0,0,0,.22) 3px, rgba(0,0,0,.22) 4px);
      }
      .b4mad-hero .logo { filter: var(--b4-logo-filter); }
      .b4mad-hero .b4mad-title {
        font-weight: 300; letter-spacing: .08em; text-transform: uppercase; line-height: 1.4;
        color: var(--b4-title); text-shadow: var(--b4-glow);
      }
      .b4mad-hero .b4mad-sub {
        font-weight: 300; letter-spacing: .12em;
        color: var(--b4-sub); text-shadow: var(--b4-glow-sm);
      }
      .b4mad-hero .b4mad-cursor {
        display: inline-block; margin-left: .08em;
        color: var(--b4-cursor); text-shadow: var(--b4-cursor-glow);
        animation: b4mad-blink 1s step-end infinite;
      }
      .b4mad-hero .b4mad-btn {
        font-weight: 300; letter-spacing: .06em; transition: all .15s;
        background: var(--b4-btn-bg) !important; color: var(--b4-btn-color) !important;
        border: 1px solid var(--b4-btn-border) !important; box-shadow: var(--b4-btn-shadow) !important;
        text-shadow: var(--b4-btn-tshadow);
      }
      .b4mad-hero .b4mad-btn:hover, .b4mad-hero .b4mad-btn:focus {
        background: var(--b4-btn-bg) !important; color: var(--b4-btnh-color) !important;
        border-color: var(--b4-btnh-border) !important; box-shadow: var(--b4-btnh-shadow) !important;
      }
      @keyframes b4mad-blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .b4mad-hero .b4mad-cursor { animation: none } }

      /* activate the phosphor palette only in dark */
      :root[data-theme="forgejo-dark"] .b4mad-hero {
        --b4-title: #9bcd9b; --b4-sub: #9bcd9b; --b4-cursor: #f4f1e8;
        --b4-glow: 0 0 4px #698b69, 0 0 12px rgba(105,139,105,.6), 0 0 22px rgba(105,139,105,.4);
        --b4-glow-sm: 0 0 4px rgba(105,139,105,.6);
        --b4-cursor-glow: 0 0 6px rgba(244,241,232,.8), 0 0 16px rgba(244,241,232,.5);
        --b4-btn-bg: transparent; --b4-btn-color: #9bcd9b; --b4-btn-border: rgba(155,205,155,.5);
        --b4-btn-shadow: 0 0 8px rgba(105,139,105,.3); --b4-btn-tshadow: 0 0 4px rgba(105,139,105,.6);
        --b4-btnh-color: orange; --b4-btnh-border: rgba(255,165,0,.6); --b4-btnh-shadow: 0 0 14px rgba(255,165,0,.4);
        --b4-logo-filter: drop-shadow(0 0 6px rgba(105,139,105,.5));
        --b4-scanline: 1;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-theme="forgejo-auto"] .b4mad-hero {
          --b4-title: #9bcd9b; --b4-sub: #9bcd9b; --b4-cursor: #f4f1e8;
          --b4-glow: 0 0 4px #698b69, 0 0 12px rgba(105,139,105,.6), 0 0 22px rgba(105,139,105,.4);
          --b4-glow-sm: 0 0 4px rgba(105,139,105,.6);
          --b4-cursor-glow: 0 0 6px rgba(244,241,232,.8), 0 0 16px rgba(244,241,232,.5);
          --b4-btn-bg: transparent; --b4-btn-color: #9bcd9b; --b4-btn-border: rgba(155,205,155,.5);
          --b4-btn-shadow: 0 0 8px rgba(105,139,105,.3); --b4-btn-tshadow: 0 0 4px rgba(105,139,105,.6);
          --b4-btnh-color: orange; --b4-btnh-border: rgba(255,165,0,.6); --b4-btnh-shadow: 0 0 14px rgba(255,165,0,.4);
          --b4-logo-filter: drop-shadow(0 0 6px rgba(105,139,105,.5));
          --b4-scanline: 1;
        }
      }

      /* ---- Source Vault one-pager (logged-out visitors only) ----
         Grounds/neutrals ride Forgejo's own theme vars so light and dark both
         work; phosphor green comes free via --color-primary (recolored
         instance-wide by custom/header.tmpl). Orange marks the disposable
         tier: darkened for contrast on light, signal-orange on dark. The
         vault slab is basalt in BOTH themes — bedrock doesn't change with
         the weather. */
      .sv {
        max-width: 44rem; margin: 0 auto; padding: 2.5rem 2rem 1rem;
        text-align: left; display: flex; flex-direction: column; gap: 2.75rem;
        --sv-ember: #b45309; --sv-slab: #16201d; --sv-slab-ink: #dfe8e1;
        --sv-mono: var(--fonts-monospace, ui-monospace, monospace);
      }
      :root[data-theme="forgejo-dark"] .sv { --sv-ember: #ffa500; --sv-slab: #0e1512; }
      @media (prefers-color-scheme: dark) {
        :root[data-theme="forgejo-auto"] .sv { --sv-ember: #ffa500; --sv-slab: #0e1512; }
      }
      .sv section { display: flex; flex-direction: column; gap: 1.1rem; }
      .sv h2 {
        font-weight: 300; letter-spacing: .08em; text-transform: uppercase;
        font-size: 1.15rem; color: var(--color-text); margin: 0;
      }
      .sv .sv-thesis {
        font-weight: 300; font-size: 1.7rem; line-height: 1.3;
        letter-spacing: .02em; color: var(--color-text);
        text-wrap: balance; max-width: 34rem;
      }
      .sv .sv-thesis b { font-weight: 400; color: var(--color-primary); }
      .sv p { color: var(--color-text-light-1); margin: 0; }
      .sv-punch { border-left: 3px solid var(--color-secondary); padding: .1rem 0 .1rem 1rem; }
      .sv-punch b { display: block; color: var(--color-text); }
      .sv-punch span { color: var(--color-text-light-2); font-size: .95em; }
      .sv-forges { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
      @media (max-width: 560px) { .sv-forges { grid-template-columns: 1fr; } }
      .sv-forge {
        border: 1.5px dashed var(--sv-ember); border-radius: 3px;
        background: var(--color-box-body); padding: .7rem .9rem;
        display: flex; flex-direction: column; gap: .1rem;
      }
      .sv-forge .name { color: var(--color-text); font-weight: 500; }
      .sv-forge .tag {
        font-family: var(--sv-mono); font-size: .72rem; letter-spacing: .1em;
        text-transform: uppercase; color: var(--sv-ember);
      }
      .sv-flow {
        display: flex; justify-content: center; align-items: center; gap: .75rem;
        padding: .8rem 0; font-family: var(--sv-mono); font-size: .75rem;
        letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-light-1);
      }
      .sv-flow .arrows { color: var(--color-primary); letter-spacing: .6em; font-size: .95rem; }
      .sv-slab {
        background: var(--sv-slab); color: var(--sv-slab-ink); border-radius: 3px;
        border-bottom: 4px solid var(--color-primary);
        padding: 1.3rem 1.4rem 1.5rem; display: flex; flex-direction: column; gap: .7rem;
      }
      .sv-slab .tag {
        font-family: var(--sv-mono); font-size: .72rem; letter-spacing: .14em;
        text-transform: uppercase; color: #9bcd9b;
      }
      .sv-slab .name { font-size: 1.25rem; font-weight: 300; letter-spacing: .06em; }
      .sv-slab p { color: var(--sv-slab-ink); opacity: .85; font-size: .95em; }
      .sv-seeds { display: flex; flex-wrap: wrap; gap: 1.25rem; font-family: var(--sv-mono); font-size: .8rem; }
      .sv-seeds span::before { content: "\25CF"; color: #9bcd9b; margin-right: .45rem; font-size: .65rem; }
      .sv-promise {
        border: 1px solid var(--color-secondary); border-radius: 3px;
        background: var(--color-box-body); padding: 1rem 1.2rem;
        display: flex; flex-direction: column; gap: .25rem;
      }
      .sv-promise b { color: var(--color-text); }
      .sv-promise p { color: var(--color-text-light-2); font-size: .95em; }
      .sv-promise .q { font-style: italic; color: var(--color-text); }
      .sv-yes {
        align-self: flex-start; font-family: var(--sv-mono); font-size: .72rem;
        letter-spacing: .1em; text-transform: uppercase;
        color: var(--color-primary); border: 1px solid var(--color-primary);
        border-radius: 3px; padding: .15rem .5rem; margin-top: .25rem;
      }
      .sv-cta {
        border-top: 1px solid var(--color-secondary); padding-top: 2rem;
        align-items: center; text-align: center; gap: .9rem;
      }
    </style>
    <div role="main" aria-label="{{if .IsSigned}}{{ctx.Locale.Tr "dashboard"}}{{else}}{{ctx.Locale.Tr "home"}}{{end}}" class="page-content home">
      <div class="tw-mb-8 tw-px-8">
        <div class="center b4mad-hero">
          <img class="logo" width="220" height="220" src="{{AssetUrlPrefix}}/img/logo.svg" alt="{{ctx.Locale.Tr "logo"}}">
          <div class="hero">
            {{/* ---- EDIT: headline + tagline ---- */}}
            {{/* Short brand line instead of {{AppDisplayName}} — the stock
                 "Forgejo: Beyond coding. We forge." slogan filled two glowing
                 lines and pushed all content below the fold. */}}
            <h1 class="ui icon header title b4mad-title">#B4mad Forge<span class="b4mad-cursor">_</span></h1>
            <h2 class="b4mad-sub">a Tier-2 forge &middot; disposable by design &middot; the vault holds</h2>
          </div>
        </div>
      </div>

      <div class="tw-max-w-2xl tw-mx-auto tw-px-8 tw-text-center">
        {{/* ---- EDIT: body copy shown to everyone ---- */}}
        {{if not .IsSigned}}
          {{/* ---- Shown ONLY to logged-out visitors ---- */}}
          <p>Sign in with your b4mad.net account to continue.</p>
          <a class="ui primary button b4mad-btn" href="{{AppSubUrl}}/user/oauth2/b4mad">Sign in</a>
        {{end}}
      </div>

      {{if not .IsSigned}}
      {{/* ---- Source Vault one-pager, logged-out visitors only ---- */}}
      <div class="sv">

        <section>
          <div class="sv-thesis">Your code should outlive every platform it
          lives on. <b>Including this one.</b></div>
          <p>This forge is Tier&nbsp;2: disposable utility. Agents — human and
          AI — work here; everything they push is designed to land in the
          <b>#B4mad Source Vault</b>, cryptographically replicated and
          operated by no one.</p>
        </section>

        <section>
          <h2>The problem</h2>
          <div class="sv-punch">
            <b>Platforms are weather.</b>
            <span>Pricing changes, acquisitions, self-host fatigue. Every
            forge you depend on today is a migration project tomorrow.</span>
          </div>
          <div class="sv-punch">
            <b>Your issues are hostages.</b>
            <span>Code is portable; the collaboration state around it —
            issues, reviews, project history — lives in a vendor database
            and dies there.</span>
          </div>
          <div class="sv-punch">
            <b>Backups you must remember aren&#39;t backups.</b>
            <span>Any safety net that depends on a human running
            <code>git push</code> will eventually fail.</span>
          </div>
        </section>

        <section>
          <h2>Bedrock and weather</h2>
          <div>
            <div class="sv-forges">
              <div class="sv-forge"><span class="name">Forgejo</span><span class="tag">disposable &middot; this one</span></div>
              <div class="sv-forge"><span class="name">GitHub</span><span class="tag">disposable</span></div>
              <div class="sv-forge"><span class="name">Entire</span><span class="tag">disposable</span></div>
            </div>
            <div class="sv-flow"><span class="arrows">&darr;&darr;&darr;</span> auto-mirror &middot; signed &middot; minutes, not memory</div>
            <div class="sv-slab">
              <span class="tag">Tier 1 &middot; canonical &middot; passive</span>
              <span class="name">The Source Vault</span>
              <p>Cryptographically verified, peer-replicated, operated by no
              one. Only <code>git push</code> goes in. It just holds.</p>
              <div class="sv-seeds"><span>seed &middot; site A</span><span>seed &middot; site B</span><span>seed &middot; site C</span></div>
            </div>
          </div>
        </section>

        <section>
          <h2>Three promises</h2>
          <div class="sv-promise">
            <b>Automation, not discipline.</b>
            <p>Machinery moves every push into the vault within minutes. No
            human remembers anything, ever. New repos enroll themselves.</p>
          </div>
          <div class="sv-promise">
            <b>Metadata travels in git.</b>
            <p>Issues live in the repo itself, so they replicate with the
            code. Forge databases hold working copies — nothing more.</p>
          </div>
          <div class="sv-promise">
            <b>The disposability test.</b>
            <p class="q">&ldquo;Could we delete this forge today and lose
            nothing but convenience?&rdquo;</p>
            <span class="sv-yes">The answer stays yes</span>
          </div>
        </section>

        <section class="sv-cta">
          <p>Agents work here. The vault just holds.</p>
          <a class="ui primary button b4mad-btn" href="{{AppSubUrl}}/user/oauth2/b4mad">Sign in with b4mad.net</a>
        </section>

      </div>
      {{end}}
    </div>
    {{template "base/footer" .}}

  # Overrides templates/user/auth/signin.tmpl (mounted at
  # /data/gitea/templates/user/auth/signin.tmpl). Every path that demands
  # authentication — the navbar Sign In button, hitting a private repo while
  # logged out — lands here. With ENABLE_INTERNAL_SIGNIN off, upstream's page
  # is a single "b4mad" SSO button, so this replaces it with an immediate
  # bounce into /user/oauth2/b4mad.
  #
  # This is a full replacement, NOT a fork of upstream's signin.tmpl —
  # Forgejo ships templates as bindata, so there was nothing to copy, and
  # keeping it minimal means a chart/Forgejo upgrade can't leave us rendering
  # a stale copy of the real login form.
  #
  # ⚠️ The flash-error branch is what stops an infinite redirect loop. A failed
  # OAuth sign-in (deactivated user, auto-registration conflict) sets a flash
  # and redirects back here; auto-bouncing would send the still-authenticated
  # browser through Keycloak and straight back to the same error, forever. So:
  # if there is an error to show, show it and let the human click.
  #
  # redirect_to needs no forwarding — Forgejo has already stashed the original
  # URL in the redirect_to cookie before routing here, and SignInOAuth leaves
  # that cookie alone.
  #
  # Break-glass if this ever misbehaves: drop this key, re-apply, restart.
  # There is no local login form to fall back to either way — the internal
  # signin form is disabled instance-wide (see values-nostromo.yaml).
  signin.tmpl: |
    {{template "base/head" .}}
    <div role="main" aria-label="{{.Title}}" class="page-content ui container tw-max-w-2xl tw-text-center tw-py-16">
      {{if and .Flash .Flash.ErrorMsg}}
        {{/* ⚠️ Plain field access, no pipe function and no sub-template.
             `SafeHTML` does NOT exist in Forgejo 16.0.1 and cost an outage:
             Forgejo treats a custom-template error as FATAL and refuses to
             boot, so a typo here takes the whole forge down, and the only way
             back in is oc/kubectl. Keep this template dependency-free. */}}
        <div class="ui negative message">{{.Flash.ErrorMsg}}</div>
        <a class="ui primary button b4mad-btn" href="{{AppSubUrl}}/user/oauth2/b4mad">Try signing in again</a>
      {{else}}
        {{/* Meta refresh rather than inline JS: no dependency on the CSP
             posture, and it still works with scripting disabled. */}}
        <meta http-equiv="refresh" content="0; url={{AppSubUrl}}/user/oauth2/b4mad">
        <p>Redirecting to b4mad.net sign-in&hellip;</p>
        <a class="ui primary button b4mad-btn" href="{{AppSubUrl}}/user/oauth2/b4mad">Continue</a>
      {{end}}
    </div>
    {{template "base/footer" .}}

  # Injected into <head> on EVERY page. Recolors Forgejo's brand accent
  # (--color-primary, default orange/red #c2410c light / #fb923c dark) to
  # #B4mad phosphor green, instance-wide, for both light and dark themes.
  # Loaded after the theme CSS, so equal-specificity :root[data-theme] rules
  # win by order. The light-/dark-N ramp is derived with color-mix so it
  # recomputes automatically from whatever --color-primary each theme sets.
  # Mounted at /data/gitea/templates/custom/header.tmpl (see values overlay).
  header.tmpl: |
    <style>
      :root[data-theme] {
        --color-primary-dark-1: color-mix(in oklab, var(--color-primary), black 8%);
        --color-primary-dark-2: color-mix(in oklab, var(--color-primary), black 16%);
        --color-primary-dark-3: color-mix(in oklab, var(--color-primary), black 24%);
        --color-primary-dark-4: color-mix(in oklab, var(--color-primary), black 32%);
        --color-primary-dark-5: color-mix(in oklab, var(--color-primary), black 40%);
        --color-primary-dark-6: color-mix(in oklab, var(--color-primary), black 48%);
        --color-primary-dark-7: color-mix(in oklab, var(--color-primary), black 56%);
        --color-primary-light-1: color-mix(in oklab, var(--color-primary), white 12%);
        --color-primary-light-2: color-mix(in oklab, var(--color-primary), white 24%);
        --color-primary-light-3: color-mix(in oklab, var(--color-primary), white 36%);
        --color-primary-light-4: color-mix(in oklab, var(--color-primary), white 48%);
        --color-primary-light-5: color-mix(in oklab, var(--color-primary), white 60%);
        --color-primary-light-6: color-mix(in oklab, var(--color-primary), white 72%);
        --color-primary-light-7: color-mix(in oklab, var(--color-primary), white 84%);
        --color-primary-hover: var(--b4-hover, var(--color-primary-dark-2));
        --color-primary-active: var(--b4-active, var(--color-primary-dark-4));
        --color-accent: var(--color-primary-light-1);
      }
      /* light family: core phosphor green, white text on fills */
      :root[data-theme="forgejo-light"] { --color-primary: #698b69; --color-primary-contrast: #ffffff; }
      @media (prefers-color-scheme: light) {
        :root[data-theme="forgejo-auto"] { --color-primary: #698b69; --color-primary-contrast: #ffffff; }
      }
      /* dark family: lighter phosphor green, black text on fills, hover/active lighten */
      :root[data-theme="forgejo-dark"] {
        --color-primary: #9bcd9b; --color-primary-contrast: #000000;
        --b4-hover: var(--color-primary-light-1); --b4-active: var(--color-primary-light-2);
      }
      @media (prefers-color-scheme: dark) {
        :root[data-theme="forgejo-auto"] {
          --color-primary: #9bcd9b; --color-primary-contrast: #000000;
          --b4-hover: var(--color-primary-light-1); --b4-active: var(--color-primary-light-2);
        }
      }
    </style>
  # Appended to the footer's right-hand link row on EVERY page, next to the
  # language picker / Licenses / API links. `custom/extra_links_footer` is the
  # hook Forgejo's templates/base/footer_content.tmpl renders inside
  # <div class="right-links">, so this ADDS a link rather than replacing the
  # footer — no stock markup is overridden. (Do not use `custom/footer` for
  # this: that hook sits after the scripts, just before </body>, and is meant
  # for injected JS, not visible links.)
  # Mounted at /data/gitea/templates/custom/extra_links_footer.tmpl.
  # German labels on purpose: "Impressum" and "Datenschutz" are the legal terms
  # TMG §5 / DSGVO Art. 13 expect, and the linked pages are German.
  #
  # Datenschutz points at OUR OWN page (privacy.html below), not at
  # b4mad.industries/legal/datenschutzerklaerung/ — that one is a brochure-site
  # policy ("Eine Datenweitergabe findet durch uns nicht statt", cookies for
  # "Produktempfehlungen und Marktforschung") and describes neither user
  # accounts, nor public repository content, nor SSO, nor the mail/backup
  # processors. Impressum stays remote: it identifies the operator, which is
  # the same natural person for both.
  #
  # The link is root-relative so it resolves on both ingress hostnames
  # (git.b4mad.industries and forgejo.b4mad.net).
  extra_links_footer.tmpl: |
    <a href="https://b4mad.industries/">#B4mad Network</a>
    <a href="https://b4mad.industries/legal/impressum/">Impressum</a>
    <a href="/assets/legal/privacy.html">Datenschutz</a>

  # Forge-specific Datenschutzerklärung, served as a STATIC FILE at
  # https://git.b4mad.industries/assets/legal/privacy.html — Forgejo serves
  # $GITEA_CUSTOM/public/assets/ under /assets/ (same mechanism as the logo).
  #
  # ⚠️ Deliberately NOT a custom template. Forgejo treats a broken custom
  # template as FATAL and refuses to boot (see the signin.tmpl note above — it
  # already cost one outage). A legal page must never be able to take the forge
  # down, and it needs no template context, so plain HTML it is. Trade-off:
  # no Forgejo chrome (navbar/footer), so it carries its own minimal styling,
  # theme-aware via prefers-color-scheme.
  #
  # ⚠️ CONTENT IS A DRAFT DESCRIPTION OF ACTUAL PROCESSING, NOT LEGAL ADVICE.
  # It was written from this deployment's configuration; if you change what the
  # forge does, this file is part of the change. Things it deliberately does
  # NOT claim: repository auto-mirroring to the #B4mad Source Vault (marketed
  # on the landing page, not implemented — no mirror machinery exists as of
  # 2026-08-06) and any web analytics (none deployed).
  #
  # German, matching b4mad.industries/legal/* and the controller's jurisdiction.
  privacy.html: |
    <!doctype html>
    <html lang="de">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex">
      <title>Datenschutzerklärung — #B4mad Forge</title>
      <style>
        :root {
          --bg: #ffffff; --fg: #1f2328; --muted: #5c6672;
          --accent: #698b69; --rule: #d8dee4; --box: #f6f8fa;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --bg: #0e1512; --fg: #dfe8e1; --muted: #9aa8a0;
            --accent: #9bcd9b; --rule: #263229; --box: #16201d;
          }
        }
        body {
          background: var(--bg); color: var(--fg); margin: 0;
          font-family: ui-sans-serif, "Helvetica Neue", Arial, sans-serif;
          line-height: 1.6; font-size: 16px;
        }
        main { max-width: 46rem; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
        h1 {
          font-weight: 300; letter-spacing: .06em; text-transform: uppercase;
          font-size: 1.6rem; margin: 0 0 .3rem;
        }
        h2 {
          font-weight: 400; font-size: 1.1rem; margin: 2.5rem 0 .6rem;
          padding-top: 1.2rem; border-top: 1px solid var(--rule);
        }
        h3 { font-weight: 500; font-size: 1rem; margin: 1.4rem 0 .3rem; }
        a { color: var(--accent); }
        code { font-family: ui-monospace, monospace; font-size: .9em; }
        .lede { color: var(--muted); margin: 0 0 2rem; }
        .box {
          background: var(--box); border-left: 3px solid var(--accent);
          padding: .8rem 1rem; margin: 1rem 0;
        }
        table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .93em; }
        th, td { text-align: left; vertical-align: top; padding: .5rem .6rem; border-bottom: 1px solid var(--rule); }
        th { color: var(--muted); font-weight: 500; }
        .wrap { overflow-x: auto; }
        footer { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .9em; }
      </style>
    </head>
    <body>
    <main>

      <h1>Datenschutzerklärung</h1>
      <p class="lede">
        Für die Git-Forge <strong>#B4mad Forge</strong>, erreichbar unter
        <code>git.b4mad.industries</code> und <code>forgejo.b4mad.net</code>.
        Stand: 6. August 2026.
      </p>

      <p>
        Diese Erklärung gilt ausschließlich für diesen Dienst. Für die Website
        <a href="https://b4mad.industries/">b4mad.industries</a> gilt die dort
        veröffentlichte Datenschutzerklärung.
      </p>

      <h2>1. Verantwortlicher</h2>
      <p>
        Christoph Görn, Müldorfer Anger 34, 53229 Bonn, Deutschland.<br>
        Kontakt: siehe <a href="https://b4mad.industries/legal/impressum/">Impressum</a>.
      </p>
      <p>
        Ein Datenschutzbeauftragter ist nicht bestellt; die Voraussetzungen des
        § 38 BDSG liegen nicht vor.
      </p>

      <h2>2. Was dieser Dienst ist</h2>
      <p>
        #B4mad Forge ist eine selbst betriebene Instanz der freien Software
        <a href="https://forgejo.org/">Forgejo</a>. Sie dient dem Hosten von
        Git-Repositories und der Zusammenarbeit daran (Issues, Pull Requests,
        Releases). Der Dienst läuft auf Infrastruktur, die der Verantwortliche
        selbst betreibt; er ist nicht bei einem Cloud-Anbieter gehostet.
      </p>

      <h2>3. Zugriffsdaten (Server-Logs)</h2>
      <p>
        Bei jedem Aufruf werden technisch notwendige Zugriffsdaten verarbeitet:
        IP-Adresse, Zeitpunkt, angeforderte Ressource, HTTP-Statuscode,
        übertragene Datenmenge, User-Agent und Referrer. Gleichartige
        Verbindungsdaten fallen bei Git-Zugriffen über SSH an.
      </p>
      <p>
        Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO; das berechtigte
        Interesse liegt im sicheren und störungsfreien Betrieb sowie in der
        Abwehr von Missbrauch. Eine Zusammenführung dieser Daten mit
        Benutzerkonten zu Auswertungszwecken findet nicht statt.
      </p>

      <h2>4. Benutzerkonto und Anmeldung</h2>
      <p>
        Eine Registrierung mit Benutzername und Passwort ist nicht möglich. Die
        Anmeldung erfolgt ausschließlich über den Single-Sign-on-Dienst
        (Keycloak) unter <code>keycloak.erdgeschoss.b4mad.net</code>, der
        ebenfalls vom Verantwortlichen betrieben wird.
      </p>
      <p>
        Bei der ersten Anmeldung wird automatisch ein Forge-Konto angelegt. Aus
        dem SSO werden dabei übernommen: Benutzername, E-Mail-Adresse,
        Anzeigename sowie die Gruppenzugehörigkeit (zur Vergabe von
        Administratorrechten). Im Konto entstehen weiter: Zeitpunkt der letzten
        Anmeldung, von Ihnen hinterlegte SSH- und GPG-Public-Keys, von Ihnen
        erzeugte Zugriffstoken sowie Ihre Einstellungen.
      </p>
      <p>
        Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO (Bereitstellung des
        Dienstes Ihnen gegenüber) bzw. Art. 6 Abs. 1 lit. f DSGVO.
      </p>

      <h2>5. Von Ihnen eingestellte Inhalte</h2>
      <p>
        Repositories, Commits, Issues, Pull Requests, Kommentare, Anhänge und
        Releases werden gespeichert, um den Dienst zu erbringen.
      </p>
      <div class="box">
        <p>
          <strong>Bitte beachten:</strong> Git-Commits enthalten den von Ihnen
          konfigurierten Autorennamen und die Autoren-E-Mail-Adresse. Diese
          Angaben sind untrennbarer Bestandteil der Git-Historie. Bei
          öffentlichen Repositories sind sie — wie der gesamte Inhalt —
          weltweit ohne Anmeldung abrufbar und können von Dritten kopiert
          werden. Auf Kopien, die Dritte durch <code>git clone</code>
          angefertigt haben, hat der Verantwortliche keinen Einfluss.
        </p>
      </div>
      <p>
        Wenn Sie dies vermeiden möchten, konfigurieren Sie in Git vor dem
        ersten Commit einen Pseudonym-Namen und eine
        Weiterleitungs-/Noreply-Adresse.
      </p>

      <h2>6. Cookies</h2>
      <p>
        Es werden ausschließlich technisch notwendige Cookies gesetzt — kein
        Tracking, keine Reichweitenmessung, keine Werbung, keine Einbindung
        von Analyse-Diensten. Eine Einwilligung ist dafür nach § 25 Abs. 2
        TDDDG nicht erforderlich.
      </p>
      <div class="wrap">
        <table>
          <tr><th>Cookie</th><th>Zweck</th><th>Dauer</th></tr>
          <tr><td><code>i_like_gitea</code></td><td>Sitzungskennung nach der Anmeldung</td><td>Sitzung</td></tr>
          <tr><td><code>_csrf</code></td><td>Schutz vor Cross-Site-Request-Forgery</td><td>Sitzung / kurzlebig</td></tr>
          <tr><td><code>lang</code></td><td>gewählte Oberflächensprache</td><td>dauerhaft</td></tr>
          <tr><td><code>redirect_to</code></td><td>merkt die vor der Anmeldung aufgerufene Seite</td><td>kurzlebig</td></tr>
        </table>
      </div>

      <h2>7. Empfänger und Auftragsverarbeiter</h2>
      <p>
        Eine Weitergabe zu Werbe- oder Analysezwecken findet nicht statt.
        Datenverarbeitung findet gegenüber folgenden Stellen statt:
      </p>
      <div class="wrap">
        <table>
          <tr><th>Empfänger</th><th>Anlass</th></tr>
          <tr>
            <td>Hetzner Online GmbH, Gunzenhausen (DE)</td>
            <td>Versand der Benachrichtigungs- und System-E-Mails der Forge über
                den dort betriebenen Mailserver</td>
          </tr>
          <tr>
            <td>Amazon Web Services (S3)</td>
            <td>verschlüsselte Sicherungen der Datenbank (Konten, Issues,
                Kommentare) als Auftragsverarbeitung</td>
          </tr>
          <tr>
            <td>Öffentlichkeit</td>
            <td>Inhalte öffentlicher Repositories einschließlich der
                Commit-Metadaten (siehe Abschnitt&nbsp;5)</td>
          </tr>
        </table>
      </div>
      <p>
        Die Sicherungen der Repository-Daten (Git-Inhalte, Anhänge) verbleiben
        vollständig auf einem eigenen, verschlüsselten Speichersystem des
        Verantwortlichen. Ein Repository-Spiegel zu Dritten besteht derzeit
        nicht.
      </p>

      <h2>8. Profilbilder (Avatare)</h2>
      <p>
        Externe Avatar-Dienste werden nicht kontaktiert. Gravatar und
        föderierte Avatare sind auf dieser Instanz abgeschaltet: Haben Sie kein
        eigenes Profilbild hochgeladen, erzeugt Forgejo lokal ein Bildmuster.
        Ihre E-Mail-Adresse — auch als Hashwert — verlässt die Instanz dafür
        nicht.
      </p>

      <h2>9. Verschlüsselung</h2>
      <p>
        Die Verbindung ist per TLS verschlüsselt. Die Zertifikate werden über
        Let&#39;s Encrypt (ISRG) ausgestellt; dabei werden lediglich die
        Hostnamen des Dienstes verarbeitet, keine Nutzerdaten.
      </p>

      <h2>10. Speicherdauer</h2>
      <div class="wrap">
        <table>
          <tr><th>Daten</th><th>Dauer</th></tr>
          <tr><td>Server-Logs</td><td>kurzfristig, nur zur Störungs- und Missbrauchsanalyse</td></tr>
          <tr><td>Konto- und Inhaltsdaten</td><td>bis zur Löschung des Kontos bzw. des Inhalts</td></tr>
          <tr><td>Datenbank-Sicherungen</td><td>bis zu 30 Tage</td></tr>
          <tr><td>Off-site-Sicherungen</td><td>7 tägliche und 4 wöchentliche Stände (max. ca. 5 Wochen)</td></tr>
        </table>
      </div>
      <p>
        Gelöschte Daten können daher bis zum Ablauf der jeweiligen
        Sicherungsfrist noch in Backups vorhanden sein; sie werden dort nicht
        weiterverarbeitet und laufen turnusmäßig aus.
      </p>

      <h2>11. Ihre Rechte</h2>
      <p>
        Sie haben das Recht auf Auskunft (Art. 15 DSGVO), Berichtigung
        (Art. 16), Löschung (Art. 17), Einschränkung der Verarbeitung
        (Art. 18), Datenübertragbarkeit (Art. 20) sowie ein
        <strong>Widerspruchsrecht</strong> gegen Verarbeitungen auf Grundlage
        von Art. 6 Abs. 1 lit. f DSGVO (Art. 21).
      </p>
      <div class="box">
        <p>
          <strong>Grenzen der Löschung:</strong> Ihr Konto und Ihre
          Profildaten können vollständig gelöscht werden. Commit-Metadaten in
          bereits veröffentlichten Repositories lassen sich technisch nur durch
          ein Umschreiben der Git-Historie entfernen — das betrifft alle
          weiteren Beteiligten und wirkt nicht auf Kopien, die Dritte bereits
          gezogen haben. Sprechen Sie uns an; wir setzen um, was technisch
          möglich ist, und sagen offen, was es nicht ist.
        </p>
      </div>
      <p>
        Ihnen steht ferner ein Beschwerderecht bei einer Aufsichtsbehörde zu
        (Art. 77 DSGVO), für den Verantwortlichen zuständig ist die
        Landesbeauftragte für Datenschutz und Informationsfreiheit
        Nordrhein-Westfalen.
      </p>
      <p>
        Eine automatisierte Entscheidungsfindung einschließlich Profiling
        findet nicht statt.
      </p>

      <h2>12. Öffentliche Metriken</h2>
      <p>
        Unter <code>/metrics</code> stellt die Instanz Betriebskennzahlen im
        Prometheus-Format bereit (z.&nbsp;B. Anzahl der Repositories, Issues
        und Konten). Es handelt sich um aggregierte Zählwerte ohne Personen-
        oder Inhaltsbezug.
      </p>

      <footer>
        <a href="/">&larr; Zurück zur Forge</a> &middot;
        <a href="https://b4mad.industries/legal/impressum/">Impressum</a>
      </footer>

    </main>
