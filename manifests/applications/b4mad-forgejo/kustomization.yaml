apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: b4mad-forgejo

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: forgejo
      app.kubernetes.io/managed-by: op1st-emea-b4mad

resources:
  - namespace.yaml

  # Helm-chart companions (the chart itself is the second source of the
  # b4mad-forgejo Argo CD Application: forgejo 17.1.3 from
  # code.forgejo.org/forgejo-helm, values-nostromo.yaml via $values).
  - home-template.configmap.yaml

  # Alerting for Forgejo + its CNPG datastore. Scrape config lives with the
  # things being scraped (chart values / postgresql.yaml); this is rules only.
  - monitoring.yaml

  # Backups: daily logical dump to a local PVC + off-site borg push to store-1.
  - backup-cronjob.yaml
  - offsite-cronjob.yaml

  # In-cluster borg image: ImageStream + Tekton build pipeline.
  # borg-pipelinerun.yaml is deliberately NOT listed (generateName —
  # a build is started manually with `oc create -f`).
  - borg-image.yaml
  - borg-pipeline.yaml

  # CloudNativePG "prod" cluster + PgBouncer pooler + daily ScheduledBackup —
  # durable datastore for Forgejo (Systems-07w), backed up to S3.
  - postgresql.yaml

  # SealedSecrets, generated from the sibling *.enc.yaml sops files via
  # scripts/sops2sealedsecret. bot-tokens.enc.yaml is sops-only
  # (local tooling credential, never applied to the cluster).
  - admin-secret.yaml
  - oauth-secret.yaml
  - gpg-signing-secret.yaml
  - offsite-borg-secret.yaml
  # NOTE: there is deliberately no registry-push secret here. The borg build's
  # `push-forgejo` task authenticates as b4mad-release-bot via `forgejo-pusher`,
  # which is canonical in op1st-gitops and reflected into this namespace by the
  # emberstack reflector — see op1st-pipelines-tokens/forgejo-pusher.enc.yaml.
  # Read-only Codeberg deploy key for the Tekton git-clone in the borg image
  # build. Lived ONLY in the cluster until the b4mad-forgejo rename; now
  # tracked here so the namespace can be recreated from scratch.
  - borg-git-ssh-secret.yaml
  # S3 backup credentials for the CNPG cluster (nostromo-cnpg bucket),
  # sourced from the feeldata-prod aws-creds secret.
  - aws-creds.yaml
