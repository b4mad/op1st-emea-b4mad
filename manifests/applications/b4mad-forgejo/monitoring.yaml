---
# Alerting for Forgejo and its CloudNativePG datastore.
#
# Scraping is set up elsewhere:
#   - Forgejo:  gitea.metrics.serviceMonitor in values-nostromo.yaml renders
#               ServiceMonitor/forgejo -> job/service "forgejo-http".
#   - Postgres: PodMonitor/prod in postgresql.yaml -> job "b4mad-forgejo/prod".
#
# Both land in OpenShift user-workload monitoring. UWM injects a
# namespace="b4mad-forgejo" matcher into every expression below, so the
# explicit namespace selectors are documentation, not enforcement.
#
# `openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus` routes a
# rule to the UWM Prometheus instead of Thanos Ruler. The leaf only sees
# user-workload metrics — fine here, since gitea_*/cnpg_*/up all come from the
# two monitors above. The PVC rule further down deliberately OMITS the label;
# see its comment.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forgejo
  labels:
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
spec:
  groups:
    - name: forgejo
      rules:
        - alert: ForgejoDown
          expr: up{namespace="b4mad-forgejo", job="forgejo-http"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "#B4mad Forge (git.b4mad.industries) is unreachable"
            description: >-
              Prometheus has failed to scrape the Forgejo pod {{ $labels.pod }}
              for >= 5 minutes. Git over HTTPS and SSH, the web UI, and any
              Renovate/GitOps automation pointing at either forge hostname are
              almost certainly down with it.

        # The `up` alert above can only fire while a target exists. If the
        # ServiceMonitor is deleted, the chart's metrics toggle is flipped off,
        # or the Service labels drift, the target disappears and ForgejoDown
        # goes silent forever — a monitoring outage that looks like health.
        - alert: ForgejoMetricsTargetMissing
          expr: absent(up{namespace="b4mad-forgejo", job="forgejo-http"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge has no Prometheus target"
            description: >-
              No scrape target matches job="forgejo-http" in b4mad-forgejo.
              Forgejo may be fine, but ForgejoDown can no longer fire. Check
              ServiceMonitor/forgejo and gitea.metrics in values-nostromo.yaml.

    - name: forgejo-postgres
      rules:
        - alert: ForgejoPostgresDown
          expr: cnpg_collector_up{namespace="b4mad-forgejo"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "#B4mad Forge PostgreSQL instance {{ $labels.pod }} is down"
            description: >-
              The CNPG metrics exporter on {{ $labels.pod }} reports the
              PostgreSQL backend as not up for >= 5 minutes. The cluster is
              single-instance (nostromo is SNO), so this means Forgejo has no
              database at all.

        # WAL segments pile up in pg_wal/archive_status as `.ready` when
        # archive_command keeps failing — i.e. the S3 push to nostromo-cnpg is
        # broken. Left alone this fills the 8Gi PVC and then wedges Postgres.
        # Threshold is deliberately low: healthy steady state is 0.
        - alert: ForgejoPostgresWALArchiveBacklog
          expr: cnpg_collector_pg_wal_archive_status{namespace="b4mad-forgejo", value="ready"} > 20
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "#B4mad Forge PostgreSQL WAL archiving is failing"
            description: >-
              {{ $value }} WAL segments are waiting to be archived on
              {{ $labels.pod }}. Continuous archiving to
              s3://nostromo-cnpg/b4mad-forgejo/ is broken; point-in-time
              recovery is degraded and pg_wal will eventually fill the volume.

        - alert: ForgejoPostgresBackupFailed
          expr: >-
            cnpg_collector_last_failed_backup_timestamp{namespace="b4mad-forgejo"}
            > cnpg_collector_last_available_backup_timestamp{namespace="b4mad-forgejo"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge PostgreSQL backup failed"
            description: >-
              The most recent CNPG base backup attempt failed and is newer than
              the last successful one. Check `oc get backup -n b4mad-forgejo`
              and the aws-creds SealedSecret.

        # ScheduledBackup/daily runs at 05:00; 26h gives one missed run plus
        # slack before this fires.
        #
        # ⚠️ cnpg_collector_last_available_backup_timestamp is 0 until the very
        # first backup completes, so this alert FIRES on a freshly bootstrapped
        # cluster. That is intended — "never backed up" is exactly the state
        # worth knowing about — but expect it to be pending right after any
        # reinit until the next 05:00 run.
        - alert: ForgejoPostgresBackupStale
          expr: >-
            time() - cnpg_collector_last_available_backup_timestamp{namespace="b4mad-forgejo"}
            > 26 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge PostgreSQL has no recent base backup"
            description: >-
              No successful CNPG base backup in over 26 hours (daily
              ScheduledBackup runs at 05:00). If the value looks like "never",
              the cluster has not been backed up since it was bootstrapped.

        # Autovacuum falling behind. Postgres refuses writes near 2^31; 300M is
        # far enough out to be a warning, not an emergency.
        - alert: ForgejoPostgresXIDWraparoundRisk
          expr: cnpg_pg_database_xid_age{namespace="b4mad-forgejo"} > 300000000
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge PostgreSQL database {{ $labels.datname }} transaction age is high"
            description: >-
              Database {{ $labels.datname }} is {{ $value }} transactions past
              its last freeze. Autovacuum is not keeping up; PostgreSQL stops
              accepting writes as this approaches 2^31.
---
# Mailer-check alerts, split into their own object ON PURPOSE.
#
# kube_job_status_failed / kube_cronjob_status_last_successful_time are
# kube-state-metrics (platform) metrics, same tenancy reasoning as the PVC
# rule below: a leaf-prometheus-scoped rule only sees user-workload metrics,
# so this one deliberately omits the label and goes to Thanos Ruler instead.
#
# There is no gitea_mail*/notification metric to alert on directly (verified
# against a live pod's /metrics 2026-07-30) — mailer-check-cronjob.yaml is a
# synthetic send test standing in for one.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forgejo-mailer
spec:
  groups:
    - name: forgejo-mailer
      rules:
        - alert: ForgejoMailerCheckFailing
          expr: >-
            kube_job_status_failed{namespace="b4mad-forgejo", job_name=~"forgejo-mailer-check-.*"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge mailer synthetic check is failing"
            description: >-
              The forgejo-mailer-check CronJob's most recent Job failed to
              send a test email through the pinned SMTP host. Forgejo's own
              [mailer] section uses the same host/credentials, so real
              notification mail is almost certainly failing too. Check
              `oc -n b4mad-forgejo logs job/<job-name>` — likely causes are
              the TLS cert on www49.your-server.de no longer matching (see
              Systems-mcz8) or the mailbox credentials having changed.

        # Mirrors ForgejoPostgresBackupStale's reasoning: catches the check
        # silently stopping (CronJob suspended, image pull failing before the
        # container even runs, schedule misconfigured) — cases where
        # ForgejoMailerCheckFailing above never fires because no Job exists to
        # report kube_job_status_failed. Schedule is every 4h; 10h gives one
        # missed run plus slack.
        - alert: ForgejoMailerCheckStale
          expr: >-
            time() - kube_cronjob_status_last_successful_time{namespace="b4mad-forgejo", cronjob="forgejo-mailer-check"}
            > 10 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge mailer check has not succeeded recently"
            description: >-
              No successful run of the forgejo-mailer-check CronJob in over
              10 hours (schedule is every 4h). Check
              `oc -n b4mad-forgejo get cronjob forgejo-mailer-check` — the
              check itself may be broken rather than the mail path it tests.

---
# PVC fill alerts, split into their own object ON PURPOSE.
#
# kubelet_volume_stats_* is a PLATFORM metric (kubelet -> platform Prometheus),
# not a user-workload one. A leaf-prometheus-scoped rule is evaluated by the
# UWM Prometheus, which never sees it, so the rule above cannot carry these.
# Without the label the rule goes to Thanos Ruler, which queries Thanos
# Querier and therefore spans both tenants; namespace enforcement still pins it
# to b4mad-forgejo.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forgejo-storage
spec:
  groups:
    - name: forgejo-storage
      rules:
        # Covers the two CONTINUOUSLY-MOUNTED PVCs: gitea-shared-storage (32Gi —
        # repos, bleve code index, GPG home) and prod-1 (8Gi — PostgreSQL data
        # + WAL). The code indexer is the usual reason the Forgejo volume grows
        # without anyone pushing anything.
        #
        # ⚠️ The namespace's third PVC, forgejo-backup, is NOT covered and
        # cannot be: kubelet exports kubelet_volume_stats_* only for volumes a
        # pod currently mounts, and that one is mounted for seconds a night by
        # a CronJob. It reports no series at all. It filled to 100% unnoticed
        # on 2026-08-01 (Systems-agaa); the ForgejoBackup* job-level alerts
        # below are what watch it now.
        - alert: ForgejoVolumeFillingUp
          expr: >-
            kubelet_volume_stats_available_bytes{namespace="b4mad-forgejo"}
            / kubelet_volume_stats_capacity_bytes{namespace="b4mad-forgejo"} < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} free"
            description: >-
              Less than 15% free on {{ $labels.persistentvolumeclaim }}. Both
              PVCs are on lvms-vg1 with resizeInUseVolumes, so growing them is
              an edit away — but a full volume wedges Forgejo or Postgres hard.

        - alert: ForgejoVolumeAlmostFull
          expr: >-
            kubelet_volume_stats_available_bytes{namespace="b4mad-forgejo"}
            / kubelet_volume_stats_capacity_bytes{namespace="b4mad-forgejo"} < 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "#B4mad Forge PVC {{ $labels.persistentvolumeclaim }} is nearly full ({{ $value | humanizePercentage }} free)"
            description: >-
              Less than 5% free on {{ $labels.persistentvolumeclaim }}. Expand
              it now — PostgreSQL stops accepting writes and Forgejo starts
              failing pushes when the volume fills.

---
# Backup-path alerting. Split out because it must NOT carry the
# leaf-prometheus label: kube_job_*/kube_cronjob_* come from kube-state-metrics
# in openshift-monitoring, which the UWM Prometheus never scrapes. No label ->
# Thanos Ruler -> Thanos Querier -> both tenants.
#
# ⚠️ WHY THESE EXIST (Systems-agaa). forgejo-backup filled its 10Gi PVC on
# 2026-08-01 and failed every night for six days with nothing alerting. The
# forgejo-storage rules above could not have caught it: kubelet only exports
# kubelet_volume_stats_* for volumes a pod currently mounts, and PVC
# forgejo-backup is mounted for a few seconds a night by the CronJob, so it
# has NO series at all — verified empty against prometheus-k8s. A PVC that
# only a CronJob touches is invisible to fill alerts by construction. The
# backup path therefore has to be watched at the Job level, here.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forgejo-backup
spec:
  groups:
    - name: forgejo-backup
      rules:
        - alert: ForgejoBackupJobFailed
          expr: >-
            kube_job_status_failed{namespace="b4mad-forgejo", job_name=~"forgejo-backup-.*"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "#B4mad Forge nightly dump job failed"
            description: >-
              The forgejo-backup CronJob's most recent Job failed. This is the
              ONLY backup covering git repos, LFS, attachments and packages —
              the CNPG barman backups cover Postgres alone, so a failure here
              is not redundant. The job deletes its own pod once backoffLimit
              trips, so `oc logs job/<name>` will say "timed out waiting for
              the condition"; that is the missing pod, not the error. Read the
              preceding job's log, or re-run the container as a bare pod.

        # Mirrors ForgejoPostgresBackupStale: catches the job silently ceasing
        # to run at all (CronJob suspended, schedule wrong, image unpullable),
        # where no Job object exists for the alert above to see. Daily
        # schedule; 30h allows one missed run plus slack.
        - alert: ForgejoBackupStale
          expr: >-
            time() - kube_cronjob_status_last_successful_time{namespace="b4mad-forgejo", cronjob="forgejo-backup"}
            > 30 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "#B4mad Forge has no fresh logical dump"
            description: >-
              No successful forgejo-backup run in over 30 hours (schedule is
              daily at 03:00 UTC). Repos, LFS, attachments and packages are
              accumulating unbacked-up changes. Check
              `oc -n b4mad-forgejo get cronjob forgejo-backup` and the free
              space on PVC forgejo-backup.

        - alert: ForgejoOffsiteJobFailed
          expr: >-
            kube_job_status_failed{namespace="b4mad-forgejo", job_name=~"forgejo-offsite-.*"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge off-site borg push failed"
            description: >-
              forgejo-offsite failed to push the newest dump to store-1. Note
              this job now fails deliberately when the local dump is stale, so
              a ForgejoBackupJobFailed alert alongside this one means one root
              cause, not two. Otherwise suspect the NAS VLAN, the pinned
              hostAlias 10.144.8.24, or the borg repo lock.

        - alert: ForgejoOffsiteStale
          expr: >-
            time() - kube_cronjob_status_last_successful_time{namespace="b4mad-forgejo", cronjob="forgejo-offsite"}
            > 30 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge dumps are not reaching store-1"
            description: >-
              No successful forgejo-offsite run in over 30 hours (schedule is
              daily at 04:40 UTC). Whatever is on the local backup PVC is the
              only copy, and it shares a node and disk with the live data.

---
# Anubis, the proof-of-work interstitial in front of the web UI.
#
# Scraped by ServiceMonitor/anubis (anubis.yaml) off the forgejo-http Service's
# `anubis-metrics` port, so these series carry job="forgejo-http" like the
# Forgejo ones and are told apart by endpoint="anubis-metrics".
#
# ⚠️ Anubis is IN the request path for both hostnames. When it stops serving,
# the forge is down for browsers even though Forgejo itself is healthy — so
# ForgejoDown above will NOT fire for it. That is what the first rule is for.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forgejo-anubis
  labels:
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
spec:
  groups:
    - name: forgejo-anubis
      rules:
        - alert: ForgejoAnubisDown
          expr: >-
            up{namespace="b4mad-forgejo", job="forgejo-http", endpoint="anubis-metrics"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "#B4mad Forge bot-defence proxy is unreachable"
            description: >-
              The Anubis sidecar in pod {{ $labels.pod }} has not been
              scrapeable for >= 5 minutes. The Ingress for both
              git.b4mad.industries and forgejo.b4mad.net targets the `anubis`
              service port, so the web UI is down even if Forgejo is fine.
              Emergency bypass: set the ingress paths' `port:` back to `http`
              in values-nostromo.yaml. Then check
              `oc -n b4mad-forgejo logs -c anubis deploy/forgejo` — with
              SLOG_LEVEL=ERROR anything at all in there is a real fault.

        # Same monitoring-outage-that-looks-like-health argument as
        # ForgejoMetricsTargetMissing: `up` can only alert while a target
        # exists. Losing the ServiceMonitor or the extraPorts entry silences
        # the rule above permanently.
        - alert: ForgejoAnubisMetricsTargetMissing
          expr: >-
            absent(up{namespace="b4mad-forgejo", job="forgejo-http", endpoint="anubis-metrics"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge has no Anubis Prometheus target"
            description: >-
              Nothing matches endpoint="anubis-metrics" in b4mad-forgejo.
              Anubis may be fine, but ForgejoAnubisDown can no longer fire.
              Check ServiceMonitor/anubis in anubis.yaml and
              service.http.extraPorts in values-nostromo.yaml.

        # Humans overwhelmingly pass the challenge; a sustained failure
        # majority means the proof of work is broken for real visitors (clock
        # skew, a bad DIFFICULTY bump, an image regression) rather than that
        # scrapers are bouncing off it — scrapers mostly never attempt it, so
        # they land in anubis_policy_results, not here.
        - alert: ForgejoAnubisChallengesFailing
          expr: >-
            sum(rate(anubis_failed_validations{namespace="b4mad-forgejo"}[15m]))
            /
            clamp_min(sum(rate(anubis_challenges_issued{namespace="b4mad-forgejo"}[15m])), 0.001)
            > 0.5
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "#B4mad Forge: most visitors are failing the bot check"
            description: >-
              Over half of the Anubis challenges issued in the last 15 minutes
              failed validation, sustained for 30 minutes. Real visitors are
              likely being locked out of git.b4mad.industries. Check whether
              DIFFICULTY was raised or the image bumped recently, and consider
              the ingress `port: http` bypass while investigating.
