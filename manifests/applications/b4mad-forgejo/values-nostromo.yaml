# Overlay for Forgejo on nostromo (OpenShift), ns b4mad-forgejo.
# DB is PostgreSQL — the CloudNativePG cluster "prod" defined in
# postgresql.yaml, reached through its PgBouncer pooler (see gitea.config
# .database below). Chart 17.x bundles no postgres/redis subcharts at all, so
# there is nothing to disable: an empty gitea.config.database silently means
# SQLite, which is what this instance ran on until 2026-07-27.
# Docs: forgejo-helm README "Compatibility with OCP".

global:
  compatibility:
    openshift:
      # Strip the chart's hardcoded runAsUser/fsGroup so OpenShift's
      # restricted-v2 SCC assigns them from the namespace's allocated range.
      adaptSecurityContext: force

# Pin the Forgejo app version. The chart (HEAD) defaults appVersion to the
# 15.0.5 LTS; override to the 16.x stable line here. `-rootless` is appended
# automatically by the chart (image.rootless). ⚠️ 16.x is the non-LTS stable
# branch (shorter support window than the 15.x LTS) — fine for this test box.
image:
  tag: '16.0.1'

# Ingress on both hostnames. OpenShift's ingress-to-route controller converts
# each Ingress into a Route; cert-manager (letsencrypt ClusterIssuer) issues the
# TLS cert into the per-host secret. This matches the cluster convention used by
# e.g. lanista.b4mad.industries.
route:
  enabled: false
ingress:
  enabled: true
  className: openshift-default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.allow-http: 'false'
  hosts:
    - host: forgejo.b4mad.net
      paths:
        - path: /
          pathType: Prefix
          port: http
    - host: forgejo.b4mad.industries
      paths:
        - path: /
          pathType: Prefix
          port: http
  tls:
    - secretName: forgejo.b4mad.net
      hosts:
        - forgejo.b4mad.net
    - secretName: forgejo.b4mad.industries
      hosts:
        - forgejo.b4mad.industries

gitea:
  # Pinned break-glass admin credentials (SealedSecret forgejo-admin, source of
  # truth forgejo-admin-secret.enc.yaml). Without existingSecret the chart
  # renders a FRESH random password on every helm render, which keeps the
  # Secret permanently OutOfSync in Argo CD and — via the chart's default
  # GITEA_ADMIN_PASSWORD_MODE=keepUpdated — would rewrite the gitea_admin DB
  # password on every sync. Web login for gitea_admin stays disabled (SSO-only);
  # this only pins what `oc exec … gitea admin` break-glass docs refer to.
  admin:
    existingSecret: forgejo-admin

  # OIDC login source. Client id/secret come from the existing secret
  # 'forgejo-oauth-secret' (keys: key=client-id, secret=client-secret) — kept
  # out of git/values. autoDiscoverUrl is the Keycloak realm's OIDC discovery doc.
  oauth:
    - name: 'b4mad'
      provider: openidConnect
      existingSecret: forgejo-oauth-secret
      autoDiscoverUrl: https://keycloak.erdgeschoss.b4mad.net/realms/b4mad.industries/.well-known/openid-configuration
      # Request email/profile so auto-created accounts get email + username
      # populated. Forgejo always prepends 'openid', so don't list it here.
      scopes: 'email profile'
      # Site-admin membership is delegated to Keycloak: users in the realm
      # group 'forgejo-admins' get is_admin, everyone else loses it. The
      # chart's oauth helper kebab-cases every key, so these render as
      # --group-claim-name / --admin-group on the `gitea admin auth
      # update-oauth` call that configure_gitea.sh re-runs on every pod start.
      #
      # The claim itself is produced by an oidc-group-membership-mapper on the
      # Keycloak client, managed by the ensure-forgejo-groups-mapper PostSync
      # hook in b4mad-keycloak — this setting is inert without it.
      #
      # ⚠️ Forgejo RE-EVALUATES the admin flag on every SSO login. If the
      # claim ever stops being emitted (mapper removed, group renamed), every
      # admin is silently demoted at next sign-in. gitea_admin stays as the
      # local break-glass account for exactly that case; do not delete it.
      groupClaimName: groups
      adminGroup: forgejo-admins

  # Prometheus metrics. `metrics.enabled` is the chart's shorthand for
  # [metrics] ENABLED = true in app.ini (see _helpers.tpl); `serviceMonitor`
  # renders a ServiceMonitor selecting the chart's labels and scraping port
  # `http` at the default /metrics path. OpenShift user-workload monitoring
  # picks it up as job/service "forgejo-http" (same path as
  # b4mad-meshtastic-gateway). Alerts live in monitoring.yaml.
  #
  # ⚠️ /metrics is served by the SAME listener as the UI, and the ingress
  # above routes `/` — so https://forgejo.b4mad.net/metrics is PUBLIC. It
  # exposes instance telemetry (user/repo/issue counts, Go runtime, build
  # info), no credentials. Deliberate call 2026-07-27: the only guard Forgejo
  # offers is [metrics] TOKEN, and the chart's ServiceMonitor template has no
  # bearerTokenSecret support, so a token would mean hand-writing the
  # ServiceMonitor plus a SealedSecret. Not worth it for this instance.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  # The DB password is the ONLY database field kept out of this file. CNPG
  # mints it into the Secret "prod-app" (key: password) when it bootstraps the
  # cluster, so it is never in git and rotates with the cluster. The chart
  # passes these straight into the init-app-ini container, where
  # config_environment.sh turns FORGEJO__<SECTION>__<KEY> into app.ini entries.
  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: prod-app
          key: password

  config:
    # Instance display name: browser tab, notification mails, and the
    # {{AppDisplayName}} template helper. Replaces the stock
    # "Forgejo: Beyond coding. We forge." slogan.
    APP_NAME: '#B4mad Forge'

    # PostgreSQL via the CNPG PgBouncer pooler rather than the prod-rw service
    # directly, so Forgejo's connection churn doesn't land on the primary.
    # ⚠️ The pooler MUST stay poolMode: session (it is, in postgresql.yaml) —
    # Forgejo uses session-scoped state that transaction pooling breaks.
    # NAME/USER match bootstrap.initdb (database: forgejo, owner: forgejo).
    database:
      DB_TYPE: postgres
      HOST: pooler-prod:5432
      NAME: forgejo
      USER: forgejo
      # CNPG poolers serve TLS by default using the cluster's server cert.
      # 'require' encrypts without verifying the CA (the cert is signed by the
      # in-cluster CNPG CA, which Forgejo does not trust). Drop to 'disable' if
      # the first boot fails on TLS.
      SSL_MODE: require
    ui:
      # Commit the instance to the #B4mad phosphor CRT aesthetic: default every
      # visitor (incl. logged-out) to the dark theme, so the forge-hash logo,
      # green accent, and scanline hero always render at their best. Users can
      # still switch themes from their settings.
      DEFAULT_THEME: forgejo-dark
    # Server-side commit signing. `signing.existingSecret` below imports the
    # GPG private key into gpgHome; this section tells Forgejo what to sign.
    # Identity must match the key's UID (Forgejo <forgejo@b4mad.net>).
    # ⚠️ SIGNING_KEY must be the literal key ID, NOT `default`. `default` does
    # not mean "the key in gpgHome" — it means "whatever `git config
    # user.signingkey` says", and Forgejo never writes that key into its
    # gitconfig ($HOME/.gitconfig does not even exist in the pod). With
    # `default` every PR shows "This instance does not have a key to sign this
    # commit" (wont_sign.nokey) even though the key is imported and usable.
    # Naming the key explicitly makes Forgejo resolve it from $GNUPGHOME.
    repository.signing:
      # The fingerprint is PUBLIC, not a secret — Forgejo itself serves the key
      # from /api/v1/signing-key.gpg. Hence the gitleaks allow-annotation.
      SIGNING_KEY: "E8ACD36B3345ED1AC6450604720A29C30D58B935" # gitleaks:allow
      SIGNING_NAME: Forgejo
      SIGNING_EMAIL: forgejo@b4mad.net
      # Sign the commits Forgejo itself creates. Tune per policy later.
      INITIAL_COMMIT: always
      CRUD_ACTIONS: always
      WIKI: always
      MERGES: always
    repository:
      # Kill the Wiki instance-wide: no repo can host a wiki and the Wiki tab
      # disappears from every repo. DISABLED_REPO_UNITS is Forgejo's global
      # unit blocklist; repo.wiki = the built-in wiki, repo.ext_wiki = the
      # "external wiki URL" variant. Wikis aren't part of the #B4mad forge story.
      DISABLED_REPO_UNITS: repo.wiki,repo.ext_wiki
    actions:
      # Disable Forgejo Actions (CI/CD) instance-wide: hides the Actions tab
      # and prevents any workflow execution. No act_runner is deployed anyway.
      ENABLED: false
    indexer:
      # Enable the repository code indexer for full-text code search.
      # Default type is bleve (on-disk, in the 20Gi PVC); does an initial
      # index pass over existing repos.
      REPO_INDEXER_ENABLED: true
    oauth2_client:
      # Auto-create a Forgejo account from OIDC claims on first SSO login,
      # instead of showing the (empty, because internal signin is off)
      # manual-registration page. USERNAME=nickname maps from Keycloak's
      # preferred_username. Link by email if an account already exists.
      ENABLE_AUTO_REGISTRATION: true
      USERNAME: nickname
      ACCOUNT_LINKING: auto
    server:
      # Canonical URL Forgejo advertises (clone URLs, cookies, callbacks).
      # forgejo.b4mad.industries also reaches the UI but redirects here.
      DOMAIN: forgejo.b4mad.net
      ROOT_URL: https://forgejo.b4mad.net/
      PROTOCOL: http
      # git-SSH advertised in clone URLs: ssh://git@forgejo.b4mad.net:2222/…
      # Pod listens on SSH_LISTEN_PORT 2222 (rootless default); the forgejo-ssh
      # NodePort below exposes it, and the erdgeschoss gateway forwards
      # 88.153.142.188:2222 -> node 192.168.0.148:32222.
      SSH_PORT: 2222
      # ⚠️ OpenShift random-UID fix: RUN_USER defaults to the current OS
      # username, which under the restricted SCC is the numeric UID
      # (e.g. 1001210000). That made the built-in SSH server require
      # `<uid>@host` and reject every `git@host` login before key lookup.
      # Pin the SSH login user to `git` (do NOT set RUN_USER — Forgejo asserts
      # it equals the real OS user at startup and would refuse to boot).
      SSH_USER: git
      BUILTIN_SSH_SERVER_USER: git
    service:
      # SSO-only: no local username/password self-signup, but first-time
      # Keycloak (OIDC) logins still auto-provision an account.
      DISABLE_REGISTRATION: true
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      # Hide the local username/password sign-in form; only the Keycloak SSO
      # button remains. NOTE: this also disables web login for the local
      # 'gitea_admin' account — break-glass is `oc exec … gitea admin …`.
      ENABLE_INTERNAL_SIGNIN: false
    webhook:
      # Allow webhook delivery to the in-cluster Pipelines-as-Code controller.
      #
      # Forgejo's default ALLOWED_HOST_LIST is `external`, which denies every
      # private/loopback/link-local target. That is why PaC webhooks for
      # forgejo-hosted repos silently stopped being delivered on 2026-07-28:
      #
      #   webhook can only call allowed HTTP servers (check your
      #   webhook.ALLOWED_HOST_LIST setting), deny
      #   'pipelines-as-code-controller-…(192.168.0.148:443)'
      #
      # 192.168.0.148 is this node's LAN address — the external route
      # *.apps.nostromo… resolves there from inside the cluster, so the
      # round-trip through the ingress is denied as "private".
      #
      # ⚠️ Forgejo and the PaC controller run in the SAME cluster, so repos
      # hosted here should point their webhook at the internal Service
      # (pipelines-as-code-controller.openshift-pipelines.svc.cluster.local:8080)
      # rather than hairpinning through the public route. 172.30.0.0/16 is this
      # cluster's serviceNetwork, which is what that name resolves to.
      #
      # `external` is kept first so outbound webhooks to real internet hosts
      # keep working exactly as before — this widens the list, it does not
      # replace it. Scoped to the service CIDR rather than the broader
      # `private` category so a compromised repo cannot aim a webhook at the
      # LAN.
      #
      # Codeberg-hosted repos are unaffected: they reach PaC from outside via
      # the route, and never consult this setting.
      ALLOWED_HOST_LIST: "external, 172.30.0.0/16"

# Expose Forgejo's built-in git-SSH via a fixed NodePort so the erdgeschoss
# gateway can forward external :2222 to it (no LoadBalancer/MetalLB on this
# single-node cluster). Chain:
#   ssh -p 2222 git@forgejo.b4mad.net
#     -> gateway 88.153.142.188:2222
#     -> node bridge 192.168.0.148:32222 (nodePort)
#     -> svc forgejo-ssh:22 -> pod :2222
service:
  ssh:
    type: NodePort
    port: 22
    nodePort: 32222

# Server-side commit signing. Imports the ed25519 GPG private key into the
# pod's gpgHome so Forgejo can sign the commits it creates (see the
# [repository.signing] config under gitea.config above). The key lives in the
# SOPS-encrypted secret forgejo-gpg-signing-secret.enc.yaml (data key:
# privateKey), which must be decrypted+applied into the namespace before the
# chart runs. gpgHome default matches the rootless image's persistent path.
# Key UID: Forgejo (#B4mad Forgejo commit signing) <forgejo@b4mad.net>,
# fp E8ACD36B3345ED1AC6450604720A29C30D58B935.
# ⚠️ Works around a chart bug (17.1.3) that only bites on a FRESH data PVC.
# scripts/init_directory_structure.sh.tpl guards its `chown 1000:1000` calls
# behind `not .Values.image.rootless` for /data and $GITEA_TEMP — but NOT for
# $GNUPGHOME:
#
#     if [ ! -d "${GNUPGHOME}" ]; then
#       mkdir -p "${GNUPGHOME}"; chmod 700 "${GNUPGHOME}"
#       chown 1000:1000 "${GNUPGHOME}"      # <- unguarded
#     fi
#
# We run the rootless image under OpenShift's restricted-v2 SCC, so the
# container is a random high UID with no CAP_CHOWN: that chown returns EPERM,
# `set -e` kills init-directories, and the pod sits in Init:CrashLoopBackOff.
# It never surfaced before because the block is skipped when the directory
# already exists, and the old PVC had been carrying a .gnupg for months.
#
# initPreScript is copied verbatim to the TOP of that script, so creating the
# directory here makes the chart's `[ ! -d ]` test false and skips the whole
# block, unguarded chown included.
#
# The copy step below installs the custom templates/branding — see the
# extraVolumes comment further down for why they are copied rather than
# subPath-mounted.
initPreScript: |
  mkdir -p "${GNUPGHOME}"
  chmod 700 "${GNUPGHOME}"

  mkdir -p /data/gitea/templates/custom /data/gitea/public/assets/img
  cp /custom-templates/home.tmpl   /data/gitea/templates/home.tmpl
  cp /custom-templates/header.tmpl /data/gitea/templates/custom/header.tmpl
  cp /custom-templates/logo.svg    /data/gitea/public/assets/img/logo.svg
  cp /custom-templates/favicon.svg /data/gitea/public/assets/img/favicon.svg

signing:
  enabled: true
  gpgHome: /data/git/.gnupg
  existingSecret: forgejo-gpg-signing-key

# Custom landing page + branding, from the forgejo-custom-templates ConfigMap
# (see forgejo-home-template.configmap.yaml) into Forgejo's custom dir
# (GITEA_CUSTOM=/data/gitea).
#
# ⚠️ These were subPath mounts landing directly on /data/gitea/... paths, which
# breaks a from-scratch rebuild. To satisfy a subPath mount the kubelet has to
# materialise the parent directories inside the data volume itself, and it
# creates them root-owned after the fsGroup pass. On a fresh PVC that leaves
# /data/gitea root-owned, so init_directory_structure.sh dies on its very first
# statement:
#
#     mkdir: can't create directory '/data/gitea/conf': Permission denied
#
# Verified 2026-07-27: a pod with byte-identical runAsUser/fsGroup but WITHOUT
# these mounts creates the same directory on the same fresh PVC without
# complaint — the mounts are the whole difference. It stayed hidden for months
# because the old PVC already had /data/gitea from the pre-GitOps helm install.
#
# So: mount the ConfigMap somewhere neutral, for the init containers only, and
# copy the files into place in initPreScript — which runs as the assigned UID
# and creates /data/gitea itself, with correct ownership. As a bonus this fixes
# template updates: a subPath-mounted ConfigMap never propagates changes, while
# this re-copies on every pod start.
extraVolumes:
  - name: custom-templates
    configMap:
      name: forgejo-custom-templates
extraInitVolumeMounts:
  - name: custom-templates
    mountPath: /custom-templates
    readOnly: true

# Raised 5Gi -> 10Gi -> 20Gi on 2026-07-28: the bleve code indexer grows this
# volume without anyone pushing anything, so we headroom ahead of demand rather
# than react to the ForgejoVolumeFillingUp alert. lvms-vg1 has
# allowVolumeExpansion and resizeInUseVolumes, so this is an in-place expansion
# — no reschedule, no downtime. Note PVCs cannot be shrunk again.
persistence:
  size: 20Gi

# test-connection Pod uses busybox:latest from Docker Hub — skip to avoid
# pull-rate flakiness on a throwaway install.
test:
  enabled: false
