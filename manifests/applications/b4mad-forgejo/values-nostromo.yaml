# Overlay for Forgejo on nostromo (OpenShift), ns b4mad-forgejo.
# DB is PostgreSQL — the CloudNativePG cluster "prod" defined in
# postgresql.yaml, reached through its PgBouncer pooler (see gitea.config
# .database below). Chart 17.x bundles no postgres/redis subcharts at all, so
# there is nothing to disable: an empty gitea.config.database silently means
# SQLite, which is what this instance ran on until 2026-07-27.
# Docs: forgejo-helm README "Compatibility with OCP".

global:
  compatibility:
    openshift:
      # Strip the chart's hardcoded runAsUser/fsGroup so OpenShift's
      # restricted-v2 SCC assigns them from the namespace's allocated range.
      adaptSecurityContext: force

# Pin the Forgejo app version. The chart (HEAD) defaults appVersion to the
# 15.0.5 LTS; override to the 16.x stable line here. `-rootless` is appended
# automatically by the chart (image.rootless). ⚠️ 16.x is the non-LTS stable
# branch (shorter support window than the 15.x LTS) — fine for this test box.
image:
  tag: '16.0.2'

# Ingress on both hostnames. OpenShift's ingress-to-route controller converts
# each Ingress into a Route; cert-manager (letsencrypt ClusterIssuer) issues the
# TLS cert into the per-host secret. This matches the cluster convention used by
# e.g. lanista.b4mad.industries.
route:
  enabled: false
ingress:
  enabled: true
  className: openshift-default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    kubernetes.io/ingress.allow-http: 'false'
  hosts:
    # ⚠️ `port: anubis`, not `port: http`. This is THE cutover into the Anubis
    # sidecar (see the "Anubis" section at the bottom of this file) and, flipped
    # back to `http`, THE rollback out of it — no other change needed, since the
    # sidecar keeps running harmlessly with nothing routed to it.
    #
    # Both hostnames go through it. forgejo.b4mad.net only 301s to
    # git.b4mad.industries, but a scraper hitting the old name must still pay.
    - host: forgejo.b4mad.net
      paths:
        - path: /
          pathType: Prefix
          port: anubis
    - host: git.b4mad.industries
      paths:
        - path: /
          pathType: Prefix
          port: anubis
  tls:
    - secretName: forgejo.b4mad.net
      hosts:
        - forgejo.b4mad.net
    - secretName: git.b4mad.industries
      hosts:
        - git.b4mad.industries

gitea:
  # Pinned break-glass admin credentials (SealedSecret forgejo-admin, source of
  # truth admin-secret.enc.yaml). Without existingSecret the chart
  # renders a FRESH random password on every helm render, which keeps the
  # Secret permanently OutOfSync in Argo CD and — via the chart's default
  # GITEA_ADMIN_PASSWORD_MODE=keepUpdated — would rewrite the gitea_admin DB
  # password on every sync. Web login for gitea_admin stays disabled (SSO-only);
  # this only pins what `oc exec … gitea admin` break-glass docs refer to.
  admin:
    existingSecret: forgejo-admin

  # OIDC login source. Client id/secret come from the existing secret
  # 'forgejo-oauth-secret' (keys: key=client-id, secret=client-secret) — kept
  # out of git/values. autoDiscoverUrl is the Keycloak realm's OIDC discovery doc.
  oauth:
    - name: 'b4mad'
      provider: openidConnect
      existingSecret: forgejo-oauth-secret
      # ⚠️ Cut over from realm b4mad.industries on 2026-07-29. The client
      # secret is deliberately identical in both realms (b4mad-forgejo reuses
      # the one issued in b4mad.industries), so this needed no reseal of
      # forgejo-oauth-secret — verified equal by digest before the switch.
      #
      # ⚠️ Forgejo keys an OAuth account by login_source + login_name, where
      # login_name holds the `sub` claim. `sub` is realm-scoped, so every
      # pre-existing account's stored sub is now stale. Re-linking relies
      # entirely on ACCOUNT_LINKING=auto below, which matches on email — user
      # `goern` carried sub 81527376-… from the old realm and will be relinked
      # on first login. If ACCOUNT_LINKING is ever set to `disabled`, this
      # cutover strands every existing SSO account instead.
      autoDiscoverUrl: https://keycloak.erdgeschoss.b4mad.net/realms/b4mad-forgejo/.well-known/openid-configuration
      # Request email/profile so auto-created accounts get email + username
      # populated. Forgejo always prepends 'openid', so don't list it here.
      scopes: 'email profile'
      # Site-admin membership is delegated to Keycloak: users in the realm
      # group 'forgejo-admins' get is_admin, everyone else loses it. The
      # chart's oauth helper kebab-cases every key, so these render as
      # --group-claim-name / --admin-group on the `gitea admin auth
      # update-oauth` call that configure_gitea.sh re-runs on every pod start.
      #
      # The claim itself is produced by an oidc-group-membership-mapper on the
      # Keycloak client, managed by the ensure-forgejo-groups-mapper PostSync
      # hook in b4mad-keycloak — this setting is inert without it.
      #
      # ⚠️ Forgejo RE-EVALUATES the admin flag on every SSO login. If the
      # claim ever stops being emitted (mapper removed, group renamed), every
      # admin is silently demoted at next sign-in. gitea_admin stays as the
      # local break-glass account for exactly that case; do not delete it.
      groupClaimName: groups
      adminGroup: forgejo-admins

  # Prometheus metrics. `metrics.enabled` is the chart's shorthand for
  # [metrics] ENABLED = true in app.ini (see _helpers.tpl); `serviceMonitor`
  # renders a ServiceMonitor selecting the chart's labels and scraping port
  # `http` at the default /metrics path. OpenShift user-workload monitoring
  # picks it up as job/service "forgejo-http" (same path as
  # b4mad-meshtastic-gateway). Alerts live in monitoring.yaml.
  #
  # ⚠️ /metrics is served by the SAME listener as the UI, and the ingress
  # above routes `/` — so https://forgejo.b4mad.net/metrics is PUBLIC. It
  # exposes instance telemetry (user/repo/issue counts, Go runtime, build
  # info), no credentials. Deliberate call 2026-07-27: the only guard Forgejo
  # offers is [metrics] TOKEN, and the chart's ServiceMonitor template has no
  # bearerTokenSecret support, so a token would mean hand-writing the
  # ServiceMonitor plus a SealedSecret. Not worth it for this instance.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  # The DB password is the ONLY database field kept out of this file. CNPG
  # mints it into the Secret "prod-app" (key: password) when it bootstraps the
  # cluster, so it is never in git and rotates with the cluster. The chart
  # passes these straight into the init-app-ini container, where
  # config_environment.sh turns FORGEJO__<SECTION>__<KEY> into app.ini entries.
  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: prod-app
          key: password

  # [mailer] section, entirely out of git. The chart has no mailer.existingSecret
  # (verified against values.yaml/values.schema.json 2026-07-30 — that
  # indirection only exists for admin/oauth/signing above); additionalConfigSources
  # is the generic escape hatch instead: the referenced Secret's `mailer` key
  # holds the section's KEY=value lines verbatim, merged via env-to-ini
  # (https://github.com/go-gitea/gitea/tree/main/contrib/environment-to-ini).
  # Host is pinned to www49.your-server.de rather than the mail.b4mad-service.net
  # vanity name — see forgejo-mailer.enc.yaml and Systems-mcz8 for why
  # (Hetzner shared-hosting cert doesn't cover the vanity name). Delivery
  # itself is checked by mailer-check-cronjob.yaml + the ForgejoMailerCheck*
  # alerts in monitoring.yaml, since Forgejo/Gitea expose no mail metric.
  additionalConfigSources:
    - secret:
        secretName: forgejo-mailer

  config:
    # Instance display name: browser tab, notification mails, and the
    # {{AppDisplayName}} template helper. Replaces the stock
    # "Forgejo: Beyond coding. We forge." slogan.
    APP_NAME: '#B4mad Forge'

    # PostgreSQL via the CNPG PgBouncer pooler rather than the prod-rw service
    # directly, so Forgejo's connection churn doesn't land on the primary.
    # ⚠️ The pooler MUST stay poolMode: session (it is, in postgresql.yaml) —
    # Forgejo uses session-scoped state that transaction pooling breaks.
    # NAME/USER match bootstrap.initdb (database: forgejo, owner: forgejo).
    database:
      DB_TYPE: postgres
      HOST: pooler-prod:5432
      NAME: forgejo
      USER: forgejo
      # CNPG poolers serve TLS by default using the cluster's server cert.
      # 'require' encrypts without verifying the CA (the cert is signed by the
      # in-cluster CNPG CA, which Forgejo does not trust). Drop to 'disable' if
      # the first boot fails on TLS.
      SSL_MODE: require
    ui:
      # Commit the instance to the #B4mad phosphor CRT aesthetic: default every
      # visitor (incl. logged-out) to the dark theme, so the forge-hash logo,
      # green accent, and scanline hero always render at their best. Users can
      # still switch themes from their settings.
      DEFAULT_THEME: forgejo-dark
    picture:
      # No external avatar lookups. Users without an uploaded picture get
      # Forgejo's locally generated identicon; nothing leaves the instance.
      #
      # Changed 2026-08-06 (was: Gravatar on, federated avatars on). Both
      # resolve an avatar by sending a hash of the user's EMAIL ADDRESS to a
      # third party — Gravatar means Automattic Inc. in the USA, federated
      # avatars mean whatever host the profile names. That is a disclosure of
      # personal data (and a third-country transfer) bought for nothing but a
      # nicer default picture. Cheaper to not do it than to paper it over in
      # the Datenschutzerklärung.
      #
      # ⚠️ Keep these in sync with privacy.html in home-template.configmap.yaml
      # — the page states that no external avatar service is contacted.
      DISABLE_GRAVATAR: true
      ENABLE_FEDERATED_AVATAR: false
    # Server-side commit signing. `signing.existingSecret` below imports the
    # GPG private key into gpgHome; this section tells Forgejo what to sign.
    # Identity must match the key's UID (Forgejo <forgejo@b4mad.net>).
    # ⚠️ SIGNING_KEY must be the literal key ID, NOT `default`. `default` does
    # not mean "the key in gpgHome" — it means "whatever `git config
    # user.signingkey` says", and Forgejo never writes that key into its
    # gitconfig ($HOME/.gitconfig does not even exist in the pod). With
    # `default` every PR shows "This instance does not have a key to sign this
    # commit" (wont_sign.nokey) even though the key is imported and usable.
    # Naming the key explicitly makes Forgejo resolve it from $GNUPGHOME.
    repository.signing:
      # The fingerprint is PUBLIC, not a secret — Forgejo itself serves the key
      # from /api/v1/signing-key.gpg. Hence the gitleaks allow-annotation.
      SIGNING_KEY: "E8ACD36B3345ED1AC6450604720A29C30D58B935" # gitleaks:allow
      SIGNING_NAME: Forgejo
      SIGNING_EMAIL: forgejo@b4mad.net
      # Sign the commits Forgejo itself creates. Tune per policy later.
      INITIAL_COMMIT: always
      CRUD_ACTIONS: always
      WIKI: always
      MERGES: always
    repository:
      # Kill the Wiki instance-wide: no repo can host a wiki and the Wiki tab
      # disappears from every repo. DISABLED_REPO_UNITS is Forgejo's global
      # unit blocklist; repo.wiki = the built-in wiki, repo.ext_wiki = the
      # "external wiki URL" variant. Wikis aren't part of the #B4mad forge story.
      DISABLED_REPO_UNITS: repo.wiki,repo.ext_wiki
      # Units a NEW repo starts with. Upstream defaults to all eight; we drop
      # repo.projects and repo.packages so a fresh repo is code/issues/PRs only.
      # Unlike DISABLED_REPO_UNITS above this is only a default — an owner can
      # still switch either back on in repo settings. repo.wiki and repo.actions
      # are absent because they are already dead instance-wide (see
      # DISABLED_REPO_UNITS and [actions] ENABLED below); listing them here
      # would be misleading, not additive. repo.code and repo.releases cannot
      # be deactivated at all, so they stay.
      DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.issues,repo.pulls
      # Disable on-the-fly source archive downloads (…/archive/<ref>.tar.gz|zip):
      # the route returns 404 and the UI links/buttons disappear. This closes an
      # unauthenticated asymmetric-amplification DoS vector — a tiny GET makes
      # the single Forgejo pod spawn git-archive + gzip and write a tarball to
      # the shared 32Gi PVC, and archive/clone bursts are already the spiky
      # consumer that risks OOMKill against the hard 768Mi memory limit. Does
      # NOT affect `git clone`, raw single-file download, or release attachments.
      DISABLE_DOWNLOAD_SOURCE_ARCHIVES: true
    actions:
      # Disable Forgejo Actions (CI/CD) instance-wide: hides the Actions tab
      # and prevents any workflow execution. No act_runner is deployed anyway.
      ENABLED: false
    log:
      # ⚠️ THIS IS A PUBLISHED PRIVACY COMMITMENT, NOT A PREFERENCE.
      # privacy.html (home-template.configmap.yaml, §3) states in a highlighted
      # box: "Es werden keine Zugriffsprotokolle mit IP-Adressen geführt."
      # Turning this on makes that statement false the moment the pod restarts.
      #
      # empty is already Forgejo's default (access logger disabled) — pinned
      # here so the commitment is enforced by the manifest and anyone
      # enabling it has to read this first. ENABLE_ACCESS_LOG is deprecated
      # in favor of LOGGER_ACCESS_MODE; a non-empty value (e.g. "console",
      # "access-file") turns the access logger on, so it must stay "".
      # The remaining router log lines (path, status, duration) carry no client
      # IP: requests arrive via the OpenShift router, so the peer address is
      # always the router pod's, and svc/forgejo-ssh runs
      # externalTrafficPolicy: Cluster, which SNATs the git-SSH path too.
      #
      # The other half of the commitment lives OUTSIDE this repo:
      # ingresscontroller/default in openshift-ingress-operator has no
      # .spec.logging stanza, so HAProxy writes no access log. Enabling that
      # (spec.logging.access) reintroduces client-IP logging cluster-wide and
      # also falsifies §3 — check both before changing either.
      LOGGER_ACCESS_MODE: ""
    indexer:
      # Enable the repository code indexer for full-text code search.
      # Default type is bleve (on-disk, in the 20Gi PVC); does an initial
      # index pass over existing repos.
      REPO_INDEXER_ENABLED: true
    oauth2_client:
      # Auto-create a Forgejo account from OIDC claims on first SSO login,
      # instead of showing the (empty, because internal signin is off)
      # manual-registration page. USERNAME=nickname maps from Keycloak's
      # preferred_username. Link by email if an account already exists.
      ENABLE_AUTO_REGISTRATION: true
      USERNAME: nickname
      ACCOUNT_LINKING: auto
    server:
      # Canonical URL Forgejo advertises (clone URLs, cookies, callbacks).
      # forgejo.b4mad.net also reaches the UI but redirects here. It stays in
      # the ingress indefinitely: every existing clone remote, registry image
      # ref and API caller still names it, and none of those follow a redirect.
      DOMAIN: git.b4mad.industries
      ROOT_URL: https://git.b4mad.industries/
      PROTOCOL: http
      # git-SSH advertised in clone URLs: ssh://git@git.b4mad.industries:2222/…
      # No SSH_DOMAIN is set, so this follows DOMAIN above.
      # Pod listens on SSH_LISTEN_PORT 2222 (rootless default); the forgejo-ssh
      # NodePort below exposes it, and the erdgeschoss gateway forwards
      # 88.153.142.188:2222 -> node 192.168.0.148:32222.
      SSH_PORT: 2222
      # ⚠️ OpenShift random-UID fix: RUN_USER defaults to the current OS
      # username, which under the restricted SCC is the numeric UID
      # (e.g. 1001210000). That made the built-in SSH server require
      # `<uid>@host` and reject every `git@host` login before key lookup.
      # Pin the SSH login user to `git` (do NOT set RUN_USER — Forgejo asserts
      # it equals the real OS user at startup and would refuse to boot).
      SSH_USER: git
      BUILTIN_SSH_SERVER_USER: git
    service:
      # SSO-only: no local username/password self-signup, but first-time
      # Keycloak (OIDC) logins still auto-provision an account.
      DISABLE_REGISTRATION: true
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      # Hide the local username/password sign-in form; only the Keycloak SSO
      # button remains. NOTE: this also disables web login for the local
      # 'gitea_admin' account — break-glass is `oc exec … gitea admin …`.
      ENABLE_INTERNAL_SIGNIN: false
      # Send notification mail for repo/issue activity (mentions, watched
      # repos, review requests). Defaults to false, which is why NOTHING
      # user-facing was ever mailed even though [mailer] was healthy: the
      # forgejo-mailer-check CronJob exercises SMTP directly, so it stayed
      # green while every mention mail was silently never queued. Confirmed
      # 2026-08-14 — mentioning a probe user whose address is the instance's
      # own mailbox produced a notification row but no mail, and no bounce.
      ENABLE_NOTIFY_MAIL: true
    webhook:
      # Allow webhook delivery to the in-cluster Pipelines-as-Code controller.
      #
      # Forgejo's default ALLOWED_HOST_LIST is `external`, which denies every
      # private/loopback/link-local target. That is why PaC webhooks for
      # forgejo-hosted repos silently stopped being delivered on 2026-07-28:
      #
      #   webhook can only call allowed HTTP servers (check your
      #   webhook.ALLOWED_HOST_LIST setting), deny
      #   'pipelines-as-code-controller-…(192.168.0.148:443)'
      #
      # 192.168.0.148 is this node's LAN address — the external route
      # *.apps.nostromo… resolves there from inside the cluster, so the
      # round-trip through the ingress is denied as "private".
      #
      # ⚠️ Forgejo and the PaC controller run in the SAME cluster, so repos
      # hosted here should point their webhook at the internal Service
      # (pipelines-as-code-controller.openshift-pipelines.svc.cluster.local:8080)
      # rather than hairpinning through the public route. 172.30.0.0/16 is this
      # cluster's serviceNetwork, which is what that name resolves to.
      #
      # `external` is kept first so outbound webhooks to real internet hosts
      # keep working exactly as before — this widens the list, it does not
      # replace it. Scoped to the service CIDR rather than the broader
      # `private` category so a compromised repo cannot aim a webhook at the
      # LAN.
      #
      # Codeberg-hosted repos are unaffected: they reach PaC from outside via
      # the route, and never consult this setting.
      ALLOWED_HOST_LIST: "external, 172.30.0.0/16"

# Expose Forgejo's built-in git-SSH via a fixed NodePort so the erdgeschoss
# gateway can forward external :2222 to it (no LoadBalancer/MetalLB on this
# single-node cluster). Chain:
#   ssh -p 2222 git@forgejo.b4mad.net
#     -> gateway 88.153.142.188:2222
#     -> node bridge 192.168.0.148:32222 (nodePort)
#     -> svc forgejo-ssh:22 -> pod :2222
service:
  http:
    # Two extra ports on the existing forgejo-http Service, both served by the
    # Anubis sidecar. `port: 3000` (Forgejo direct) is untouched and stays
    # reachable in-cluster — that is what ServiceMonitor/forgejo scrapes, so
    # Prometheus never transits Anubis.
    extraPorts:
      # What the Ingress above targets by name.
      - name: anubis
        port: 8080
        targetPort: 8080
        protocol: TCP
      # Anubis' own metrics + /healthz listener. Scraped by
      # ServiceMonitor/anubis in anubis.yaml. Not routed from the Ingress, so
      # unlike Forgejo's /metrics this one is cluster-internal.
      - name: anubis-metrics
        port: 9090
        targetPort: 9090
        protocol: TCP
  ssh:
    type: NodePort
    port: 22
    nodePort: 32222

# Server-side commit signing. Imports the ed25519 GPG private key into the
# pod's gpgHome so Forgejo can sign the commits it creates (see the
# [repository.signing] config under gitea.config above). The key lives in the
# SOPS-encrypted secret gpg-signing-secret.enc.yaml (data key:
# privateKey), which must be decrypted+applied into the namespace before the
# chart runs. gpgHome default matches the rootless image's persistent path.
# Key UID: Forgejo (#B4mad Forgejo commit signing) <forgejo@b4mad.net>,
# fp E8ACD36B3345ED1AC6450604720A29C30D58B935.
# ⚠️ Works around a chart bug (17.1.3) that only bites on a FRESH data PVC.
# scripts/init_directory_structure.sh.tpl guards its `chown 1000:1000` calls
# behind `not .Values.image.rootless` for /data and $GITEA_TEMP — but NOT for
# $GNUPGHOME:
#
#     if [ ! -d "${GNUPGHOME}" ]; then
#       mkdir -p "${GNUPGHOME}"; chmod 700 "${GNUPGHOME}"
#       chown 1000:1000 "${GNUPGHOME}"      # <- unguarded
#     fi
#
# We run the rootless image under OpenShift's restricted-v2 SCC, so the
# container is a random high UID with no CAP_CHOWN: that chown returns EPERM,
# `set -e` kills init-directories, and the pod sits in Init:CrashLoopBackOff.
# It never surfaced before because the block is skipped when the directory
# already exists, and the old PVC had been carrying a .gnupg for months.
#
# initPreScript is copied verbatim to the TOP of that script, so creating the
# directory here makes the chart's `[ ! -d ]` test false and skips the whole
# block, unguarded chown included.
#
# The copy step below installs the custom templates/branding — see the
# extraVolumes comment further down for why they are copied rather than
# subPath-mounted.
initPreScript: |
  mkdir -p "${GNUPGHOME}"
  chmod 700 "${GNUPGHOME}"

  mkdir -p /data/gitea/templates/custom /data/gitea/templates/user/auth /data/gitea/public/assets/img /data/gitea/public/assets/legal /data/gitea/public/assets/fonts
  cp /custom-templates/home.tmpl   /data/gitea/templates/home.tmpl
  cp /custom-templates/signin.tmpl /data/gitea/templates/user/auth/signin.tmpl
  cp /custom-templates/header.tmpl /data/gitea/templates/custom/header.tmpl
  cp /custom-templates/extra_links_footer.tmpl /data/gitea/templates/custom/extra_links_footer.tmpl
  cp /custom-templates/logo.svg    /data/gitea/public/assets/img/logo.svg
  cp /custom-templates/favicon.svg /data/gitea/public/assets/img/favicon.svg
  # Forge-specific Datenschutzerklärung, linked from the footer. A static file
  # under public/assets/ rather than a custom template: Forgejo aborts startup
  # on a broken template, and a legal page must not be able to do that.
  cp /custom-templates/privacy.html /data/gitea/public/assets/legal/privacy.html
  # Josefin Sans (the b4mad.industries typeface) as cacheable static files.
  # header.tmpl points --fonts-proportional at these, so the whole Forgejo UI
  # renders in it. They arrive via the ConfigMap's binaryData, which the kubelet
  # materialises as real binaries — no base64 handling needed here.
  cp /custom-templates/josefin-sans-latin.woff2     /data/gitea/public/assets/fonts/
  cp /custom-templates/josefin-sans-latin-ext.woff2 /data/gitea/public/assets/fonts/
  # robots.txt goes in the custom PUBLIC root: $GITEA_CUSTOM/public/ is mapped
  # to /, so public/robots.txt is served at /robots.txt (the same mechanism that
  # puts public/assets/img/logo.svg at /assets/img/logo.svg).
  # ⚠️ NOT $GITEA_CUSTOM/robots.txt. Several docs and forum posts say custom
  # root; on Forgejo 16.0.1 that file is simply ignored and the built-in default
  # keeps being served — verified live 2026-08-06, the override only took effect
  # once the file moved into public/.
  cp /custom-templates/robots.txt /data/gitea/public/robots.txt

signing:
  enabled: true
  gpgHome: /data/git/.gnupg
  existingSecret: forgejo-gpg-signing-key

# Custom landing page + branding, from the forgejo-custom-templates ConfigMap
# (see home-template.configmap.yaml) into Forgejo's custom dir
# (GITEA_CUSTOM=/data/gitea).
#
# ⚠️ These were subPath mounts landing directly on /data/gitea/... paths, which
# breaks a from-scratch rebuild. To satisfy a subPath mount the kubelet has to
# materialise the parent directories inside the data volume itself, and it
# creates them root-owned after the fsGroup pass. On a fresh PVC that leaves
# /data/gitea root-owned, so init_directory_structure.sh dies on its very first
# statement:
#
#     mkdir: can't create directory '/data/gitea/conf': Permission denied
#
# Verified 2026-07-27: a pod with byte-identical runAsUser/fsGroup but WITHOUT
# these mounts creates the same directory on the same fresh PVC without
# complaint — the mounts are the whole difference. It stayed hidden for months
# because the old PVC already had /data/gitea from the pre-GitOps helm install.
#
# So: mount the ConfigMap somewhere neutral, for the init containers only, and
# copy the files into place in initPreScript — which runs as the assigned UID
# and creates /data/gitea itself, with correct ownership. As a bonus this fixes
# template updates: a subPath-mounted ConfigMap never propagates changes, while
# this re-copies on every pod start.
extraVolumes:
  - name: custom-templates
    configMap:
      name: forgejo-custom-templates
  # Anubis bot policy. Mounted into the sidecar only (see extraContainers).
  # Unlike custom-templates this is a plain directory mount outside /data, so
  # none of the subPath/fresh-PVC trouble described above applies.
  - name: anubis-policy
    configMap:
      name: anubis-policy
extraInitVolumeMounts:
  - name: custom-templates
    mountPath: /custom-templates
    readOnly: true

# Gitea container resources. Set 2026-08-03: the pod ran unbounded until now,
# sitting at ~276Mi RSS idle, so the request is pinned just above that and the
# limit at 768Mi. ⚠️ A memory limit is a hard OOMKill boundary, not throttling
# — the bleve code indexer and archive/clone bursts are the spiky consumers
# here, hence ~2.8x idle of headroom rather than a snug limit. If the pod
# starts restarting with OOMKilled, raise the limit rather than chasing it in
# Forgejo config.
resources:
  requests:
    memory: 320Mi
  limits:
    memory: 768Mi

# Raised 5Gi -> 10Gi -> 20Gi on 2026-07-28, 20Gi -> 32Gi on 2026-08-04 (at 54%,
# 10.7G of 19.9G): the bleve code indexer grows this volume without anyone
# pushing anything, so we headroom ahead of demand rather than react to the
# ForgejoVolumeFillingUp alert. lvms-vg1 has allowVolumeExpansion and
# resizeInUseVolumes, so this is an in-place expansion — no reschedule, no
# downtime. Note PVCs cannot be shrunk again.
persistence:
  size: 32Gi

# test-connection Pod uses busybox:latest from Docker Hub — skip to avoid
# pull-rate flakiness on a throwaway install.
test:
  enabled: false

# ---------------------------------------------------------------------------
# Anubis — proof-of-work interstitial in front of the web UI.
#
#   ingress -> svc/forgejo-http :8080 (name: anubis)
#                -> anubis (this container) --localhost--> forgejo :3000
#
# Sidecar rather than its own Deployment, which is what upstream's Kubernetes
# guide describes. Two consequences worth knowing:
#
#   * TARGET is localhost, so Forgejo still sees 127.0.0.1 as the peer and
#     REVERSE_PROXY_TRUSTED_PROXIES needs no widening. The caveat in Anubis'
#     gitea/forgejo doc applies only to the separate-Deployment topology.
#   * Anubis shares the pod's lifecycle. It has no persistent state (the
#     default in-memory store), so this costs nothing beyond a few seconds of
#     added rollout time.
#
# The policy file and the ServiceMonitor live in anubis.yaml — the chart can
# only carry the container itself.
#
# ⚠️ OpenShift: global.compatibility.openshift.adaptSecurityContext=force at the
# top of this file only rewrites CHART-RENDERED containers. extraContainers is
# passed through verbatim, so upstream's example runAsUser/runAsGroup/
# runAsNonRoot: 1000 is deliberately absent below — under restricted-v2 those
# values are outside the namespace's allocated UID range and the pod would be
# rejected outright. Omitting them lets the SCC assign a UID; Anubis does not
# care which one it runs as.
extraContainers:
  - name: anubis
    # Pinned, not :latest — an image bump changes the bundled (data)/… policy
    # snippets that anubis.yaml imports, and that deserves a commit.
    image: ghcr.io/techarohq/anubis:v1.26.2
    imagePullPolicy: IfNotPresent
    env:
      - name: BIND
        value: ':8080'
      - name: TARGET
        value: http://localhost:3000
      - name: METRICS_BIND
        value: ':9090'
      - name: POLICY_FNAME
        value: /etc/anubis/botPolicies.yaml
      # ⚠️ See the logging block in anubis.yaml before changing this. Anubis
      # puts x-forwarded-for and x-real-ip on every request log line, and
      # privacy.html §3 promises no access logs with IP addresses. ERROR here
      # and `level: ERROR` in the policy file are the same commitment stated
      # twice, because the policy file's logging block is the newer of the two
      # mechanisms and this one is what applies before the policy is parsed.
      - name: SLOG_LEVEL
        value: ERROR
      # Signs the challenge-pass JWT. Pinned in a SealedSecret so it survives a
      # restart: without it Anubis mints a fresh key per pod start and every
      # visitor holding a valid cookie has to solve a new challenge.
      - name: ED25519_PRIVATE_KEY_HEX
        valueFrom:
          secretKeyRef:
            name: anubis-signing-key
            key: ED25519_PRIVATE_KEY_HEX
      # Leading zero bits required in the proof of work. 4 is upstream's
      # default: roughly a second of browser CPU, unnoticeable once, expensive
      # at scraper volume. Revisit only with real traffic data.
      - name: DIFFICULTY
        value: '4'
      # Let link-preview fetchers (chat clients, fediverse) read the target's
      # Open Graph tags instead of previewing the interstitial.
      #
      # ⚠️ This is the one routine code path that can emit an ERROR log line —
      # RenderIndex logs "failed to get OG tags" WITH x-forwarded-for and
      # x-real-ip when it cannot parse the target's response. Verified against
      # v1.26.2 that Forgejo does not trigger it: any text/html response is
      # fine, 404s included, and Forgejo serves nothing else on the paths a
      # browser gets challenged on. It stays silent, but this is the thing to
      # look at first if IP addresses ever show up in the log (see §3 of
      # privacy.html, which discloses exactly this residual).
      - name: OG_PASSTHROUGH
        value: 'true'
      - name: OG_EXPIRY_TIME
        value: 24h
      # ⚠️ Must stay false. Anubis would otherwise serve its own robots.txt and
      # shadow the curated one added in cbb0e4e, which is strictly broader —
      # it also keeps crawlers off blame/commits/raw/compare.
      - name: SERVE_ROBOTS_TXT
        value: 'false'
      # NOT SET, deliberately:
      #   PUBLIC_URL   — upstream's Kubernetes doc: setting it in a sidecar
      #                  deployment breaks redirect construction (redir=null).
      #   COOKIE_DOMAIN — the two hostnames are different registrable domains
      #                  (b4mad.net / b4mad.industries), so no single value is
      #                  correct. Unset means a host-only cookie, which is what
      #                  we want; a visitor simply solves once per hostname.
      #   USE_REMOTE_ADDRESS — the socket peer is always the OpenShift router
      #                  pod, so this would collapse every visitor onto one
      #                  address and poison every per-IP rule. See the
      #                  client-IP note below for why it is not needed.
      #   CUSTOM_REAL_IP_HEADER — likewise not needed, see below.
      #   WEBMASTER_EMAIL — privacy.html §1 deliberately publishes no address
      #                  and points at the b4mad.industries Impressum instead;
      #                  error pages should not invent one.
      #
      # Client IP, which Anubis genuinely needs and OpenShift does not hand it
      # directly. The router sets X-Forwarded-For but NOT X-Real-Ip; Anubis'
      # XForwardedForToXRealIP middleware derives the latter from the former
      # and strips private hops (XFF_STRIP_PRIVATE defaults true), so no
      # configuration is required. Verified against v1.26.2 before shipping:
      # with XFF set to a published Googlebot address the googlebot ALLOW rule
      # fires; with any other address the same user agent is challenged.
      #
      # ⚠️ This is load-bearing for search indexing. Every rule in
      # (data)/crawlers/_allow-good.yaml is gated on remote_addresses — a UA
      # string alone is spoofable and upstream refuses to trust it. If Anubis
      # ever stops seeing the real address, every search engine gets an
      # interstitial it cannot solve and the forge quietly falls out of the
      # indexes. Anubis is fail-closed about this: with no XFF at all it serves
      # "administrator has misconfigured Anubis" rather than guessing.
      #
      # Consequence for JWT_RESTRICTION_HEADER (default X-Real-IP): since
      # X-Real-Ip IS populated, the challenge-pass cookie is bound to the
      # address that solved it and cannot be replayed from elsewhere.
    ports:
      - name: anubis
        containerPort: 8080
        protocol: TCP
      - name: anubis-metrics
        containerPort: 9090
        protocol: TCP
    volumeMounts:
      - name: anubis-policy
        mountPath: /etc/anubis
        readOnly: true
    # /healthz is served by the metrics listener, not the proxy listener
    # (cmd/anubis/main.go). Probing 9090 also catches a Forgejo-independent
    # Anubis hang, which is the failure that would take the whole site down.
    livenessProbe:
      httpGet:
        path: /healthz
        port: anubis-metrics
      initialDelaySeconds: 5
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /healthz
        port: anubis-metrics
      initialDelaySeconds: 2
      periodSeconds: 10
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      # In-memory store + read-only policy mount: Anubis writes nothing.
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
