# Copies the `forgejo` OIDC client secret from realm b4mad.industries to the
# same-named client in realm b4mad-forgejo, so both realms authenticate
# against the one value already stored in the sealed Secret
# b4mad-forgejo/forgejo-oauth-secret. Flipping Forgejo's autoDiscoverUrl
# between the two realms then needs no reseal.
#
# ⚠️ Why a Job and not the realm CR: realms/b4mad-forgejo.yaml is a plain
# KeycloakRealmImport, and .sops.yaml only encrypts data/stringData/tls — a
# `secret:` field there would be cleartext in git. The value never leaves
# Keycloak here; it is read and written over the admin API in-process.
#
# ⚠️ b4mad.industries is the source of truth and is NOT represented in git
# (see forgejo-groups-mapper-job.yaml). If that realm or its `forgejo` client
# is ever retired, this Job starts failing loudly — which is the intent: at
# that point the secret should be generated fresh and resealed instead.
#
# PostSync so it runs after the realm import has created the target client,
# and re-converges on every Argo CD sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-forgejo-client-secret
  annotations:
    argocd.argoproj.io/hook: PostSync
    # Ordered after ensure-forgejo-groups-mapper (wave 0) purely for readable
    # logs; the two touch different realms and do not actually contend.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kcadm
          # Same image as the Keycloak CR so kcadm.sh matches the server
          # version. NOT rewritten by the kustomize `images:` transformer —
          # that one is scoped to kind=Keycloak spec/image only.
          image: codeberg.org/b4mad/keycloak-op1st:26.4.7-0.11
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            # Operator-managed bootstrap admin in the `master` realm.
            - name: KC_ADMIN
              valueFrom:
                secretKeyRef:
                  name: b4mad-erdgeschoss-initial-admin
                  key: username
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: b4mad-erdgeschoss-initial-admin
                  key: password
          command:
            - /bin/bash
            - -ceu
            - |
              # NOTE: no `set -x` anywhere below — the client secret passes
              # through shell variables and must not reach the pod log.
              KCADM=/opt/keycloak/bin/kcadm.sh
              SRC_REALM=b4mad.industries
              DST_REALM=b4mad-forgejo
              CLIENT=forgejo

              # OpenShift runs this pod under a random UID with no writable
              # HOME, so kcadm's default ~/.keycloak/kcadm.config is
              # unwritable — every call must carry --config explicitly.
              CFG=/tmp/kcadm.config

              # Public route rather than the in-cluster Service: the Service
              # serves the `tls-backend` cert, which the JVM truststore does
              # not trust, while the route carries a real Let's Encrypt cert.
              $KCADM config credentials --config "$CFG" \
                --server https://keycloak.erdgeschoss.b4mad.net \
                --realm master --user "$KC_ADMIN" --password "$KC_ADMIN_PASSWORD"

              cid() {
                $KCADM get clients --config "$CFG" -r "$1" \
                  -q clientId="$CLIENT" --fields id --format csv --noquotes
              }

              SRC_ID=$(cid "$SRC_REALM")
              DST_ID=$(cid "$DST_REALM")
              for pair in "$SRC_REALM:$SRC_ID" "$DST_REALM:$DST_ID"; do
                if [ -z "${pair#*:}" ]; then
                  echo "ERROR: client '$CLIENT' not found in realm '${pair%%:*}'." >&2
                  exit 1
                fi
              done
              echo "source $SRC_REALM/$CLIENT -> $SRC_ID"
              echo "target $DST_REALM/$CLIENT -> $DST_ID"

              # `get clients/<id>/client-secret` returns a single JSON object
              # {"type":"password","value":"…"}; --fields/--format only apply
              # to lists, so pull the value with sed. The Keycloak image is
              # UBI-micro: no jq, no awk, no python — sed/grep/cut exist.
              SECRET=$($KCADM get "clients/$SRC_ID/client-secret" \
                --config "$CFG" -r "$SRC_REALM" \
                | sed -n 's/.*"value"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')

              if [ -z "$SECRET" ]; then
                echo "ERROR: could not read client-secret from $SRC_REALM." >&2
                exit 1
              fi
              echo "read source secret (${#SECRET} chars)"

              # Unconditional update, not create-if-missing: a rotation on the
              # source realm — or a hand-edit on the target — is corrected on
              # the next sync rather than merely detected.
              $KCADM update "clients/$DST_ID" --config "$CFG" -r "$DST_REALM" \
                -s "secret=$SECRET"
              echo "done"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
