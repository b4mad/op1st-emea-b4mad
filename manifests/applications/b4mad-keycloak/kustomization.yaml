apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: b4mad-keycloak

labels:
  - pairs:
      app.kubernetes.io/name: iam
      app.kubernetes.io/component: keycloak
      app.kubernetes.io/instance: erdgeschoss
      app.kubernetes.io/managed-by: op1st-emea-b4mad
    includeTemplates: true

configurations:
  - kustomizeconfig/keycloak_image.yaml

resources:
  - certificate.yaml
  - keycloak.yaml
  - aws-creds.yaml
  - postgresql.yaml
  - pod-disruption-budget.yaml

  - realms/erdgeschoss.b4mad.net.yaml
  - realms/b4mad-forgejo.yaml

  # PostSync hook: ensures the Forgejo OIDC client in realm b4mad.industries
  # emits the `groups` claim that Forgejo's admin-group mapping depends on.
  # A KeycloakRealmImport cannot do this — see the header of the Job.
  - forgejo-groups-mapper-job.yaml

  # PostSync hook: mirrors that client's secret into realm b4mad-forgejo, so
  # the sealed forgejo-oauth-secret works against either realm.
  - copy-forgejo-client-secret-job.yaml

  # PostSync hook: provisions the broker client (plus its groups mapper) in
  # realm erdgeschoss and injects its secret into the b4mad-forgejo IdP.
  - setup-erdgeschoss-broker-job.yaml

images:
  - name: keycloak
    newName: codeberg.org/b4mad/keycloak-op1st
    newTag: 26.4.7-0.11
