# Realm backing the #B4mad Forge (Forgejo) SSO.
#
# ⚠️ CREATE-ONLY. The operator imports with `kc.sh import --override=false`
# and the CRD exposes no strategy field, so everything below is applied
# exactly once — when the realm does not yet exist. After that, edits to this
# file are a silent no-op against the live realm (same failure mode that
# forced ensure-forgejo-groups-mapper-job.yaml into existence for realm
# b4mad.industries). Get it right on the first sync; anything that has to
# converge repeatedly needs a kcadm PostSync hook instead.
#
# ⚠️ NOT yet wired to Forgejo. b4mad-forgejo/values-nostromo.yaml still points
# its `autoDiscoverUrl` at realm b4mad.industries. Cutting over is a separate,
# deliberate step — see the checklist in the client comment below.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: b4mad-forgejo
spec:
  keycloakCRName: b4mad-erdgeschoss
  realm:
    id: b4mad-forgejo
    realm: b4mad-forgejo
    displayName: "#B4mad Forge - a Tier-2 forge"
    enabled: true
    # Reachable only over the Let's Encrypt-terminated route; `external`
    # still permits plain HTTP from inside the cluster for health probes.
    sslRequired: external
    # Accounts come from SSO administration, not self-service. Forgejo's own
    # ENABLE_AUTO_REGISTRATION creates the *Forgejo* account from claims — it
    # does not create Keycloak users, so nothing here needs to be open.
    registrationAllowed: false
    resetPasswordAllowed: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false

    groups:
      # Membership here is what grants Forgejo site-admin, via the `groups`
      # claim + `adminGroup: forgejo-admins` in b4mad-forgejo/values-nostromo.yaml.
      # Nobody is enrolled from git — membership is derived on every login from
      # the erdgeschoss group /admins by the IdP mapper below.
      # ⚠️ Forgejo re-evaluates is_admin on every SSO login — emptying or
      # renaming this group silently demotes every admin at next sign-in.
      - name: forgejo-admins

    # No `users:` block, on purpose. This realm holds no identities of its
    # own; erd/G/eschoss is the source of truth. Keycloak still creates a
    # local shadow account on first broker login — that is unavoidable in
    # brokering — but it carries no password and is fully derived from
    # upstream, so nothing about a person needs to live in git.
    identityProviders:
      - alias: erdgeschoss
        displayName: "erd/G/eschoss"
        providerId: oidc
        enabled: true
        # Same Keycloak instance, different realm, so the upstream email is as
        # trustworthy as our own — skip the verification mail on account
        # creation (this realm has no SMTP sender anyway).
        trustEmail: true
        storeToken: false
        addReadTokenRoleOnCreate: false
        linkOnly: false
        firstBrokerLoginFlowAlias: "first broker login"
        config:
          clientId: b4mad-forgejo-broker
          # ⚠️ Placeholder. Overwritten in place by the
          # setup-erdgeschoss-broker PostSync Job, which creates the matching
          # client in realm erdgeschoss and copies its generated secret over.
          # A real secret cannot live here: this is a plain CR and .sops.yaml
          # only encrypts data/stringData/tls.
          clientSecret: "set-by-setup-erdgeschoss-broker-job"
          clientAuthMethod: client_secret_post
          issuer: https://keycloak.erdgeschoss.b4mad.net/realms/erdgeschoss
          authorizationUrl: https://keycloak.erdgeschoss.b4mad.net/realms/erdgeschoss/protocol/openid-connect/auth
          tokenUrl: https://keycloak.erdgeschoss.b4mad.net/realms/erdgeschoss/protocol/openid-connect/token
          userInfoUrl: https://keycloak.erdgeschoss.b4mad.net/realms/erdgeschoss/protocol/openid-connect/userinfo
          logoutUrl: https://keycloak.erdgeschoss.b4mad.net/realms/erdgeschoss/protocol/openid-connect/logout
          jwksUrl: https://keycloak.erdgeschoss.b4mad.net/realms/erdgeschoss/protocol/openid-connect/certs
          useJwksUrl: "true"
          validateSignature: "true"
          # `groups` is deliberately absent: the claim is emitted by a
          # protocol mapper attached directly to the broker client, not by a
          # client scope, so it needs no scope request. Realm erdgeschoss is
          # itself create-only, so that mapper is installed by the same Job.
          defaultScope: "openid profile email"
          syncMode: FORCE

    identityProviderMappers:
      # Site-admin is delegated all the way up to erd/G/eschoss: whoever is in
      # its /admins group lands in /forgejo-admins here, and Forgejo turns that
      # into is_admin. No name is hardcoded in git.
      #
      # ⚠️ erdgeschoss has BOTH /admin and /admins, each containing only goern
      # — one of them is a typo nobody has cleaned up. This keys on /admins;
      # editing /admin will silently do nothing.
      #
      # syncMode FORCE re-evaluates membership on every login, matching
      # Forgejo's own re-evaluation of is_admin. IMPORT would apply once at
      # account creation and then drift forever.
      - name: forgejo-admins-from-erdgeschoss-admins
        identityProviderAlias: erdgeschoss
        identityProviderMapper: oidc-advanced-group-idp-mapper
        config:
          syncMode: FORCE
          # Bare name, not /admins — the broker client's mapper sets
          # full.path=false, so the claim carries unqualified group names.
          claims: '[{"key":"groups","value":"admins"}]'
          are.claim.values.regex: "false"
          group: /forgejo-admins

    clients:
      # Confidential OIDC client for Forgejo's `b4mad` auth source.
      #
      # ⚠️ No `secret:` field here, on purpose. This is a plain CR, and
      # .sops.yaml only encrypts data/stringData/tls — a literal secret would
      # sit in git in cleartext. Keycloak generates a random one at import,
      # and copy-forgejo-client-secret-job.yaml then overwrites it with the
      # value already in use by realm b4mad.industries, so the existing
      # sealed forgejo-oauth-secret keeps working unchanged.
      #
      # Remaining cutover step, once the realm is up: repoint autoDiscoverUrl
      # in b4mad-forgejo/values-nostromo.yaml at
      # /realms/b4mad-forgejo/.well-known/openid-configuration. Until then
      # this client is provisioned but unused.
      - clientId: forgejo
        name: "#B4mad Forge"
        enabled: true
        protocol: openid-connect
        publicClient: false
        # Authorization-code flow only. No direct grant (no password-grant
        # surface), no service account — Forgejo only ever acts on behalf of
        # a browser user.
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        # Forgejo builds this from ROOT_URL + the auth source name (`b4mad`).
        # It must match exactly — no wildcard, so a ROOT_URL change breaks
        # login loudly rather than widening the redirect surface.
        redirectUris:
          - https://forgejo.b4mad.net/user/oauth2/b4mad/callback
        webOrigins:
          - https://forgejo.b4mad.net
        protocolMappers:
          # The group claim Forgejo's adminGroup mapping keys off. Declared
          # inline here precisely because this realm is created from scratch —
          # unlike b4mad.industries, which needed a kcadm Job to retrofit it.
          #
          # full.path=false emits bare names ("forgejo-admins"); a leading
          # slash ("/forgejo-admins") would never compare equal to adminGroup.
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
