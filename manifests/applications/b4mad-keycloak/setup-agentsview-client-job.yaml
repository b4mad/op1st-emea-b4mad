# Provisions the OIDC client that gates https://agentsview.b4mad.industries.
#
# ⚠️ Why a hand-written Job and not a realm-config file: this client lives in
# realm *erdgeschoss*, which keycloak-config-cli does not manage (that realm
# holds 6 users and 15 clients git does not describe — see the header of
# realm-config/b4mad-forgejo.yaml). This Job touches exactly one object and
# deletes nothing.
#
# Realm erdgeschoss was chosen over b4mad-forgejo on purpose. b4mad-forgejo
# brokers GitHub and Codeberg and auto-provisions accounts from them, so with
# the client over there the only thing standing between any GitHub user and the
# full session archive would be an oauth2-proxy group flag. erdgeschoss has no
# public identity provider, so it fails closed.
#
# PostSync at wave 1, matching setup-erdgeschoss-broker-job.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-agentsview-client
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kcadm
          # Same image as the Keycloak CR so kcadm.sh matches the server
          # version. NOT rewritten by the kustomize `images:` transformer —
          # that one is scoped to kind=Keycloak spec/image only.
          image: codeberg.org/b4mad/keycloak-op1st:26.4.7-0.11
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            # Operator-managed bootstrap admin in the `master` realm.
            - name: KC_ADMIN
              valueFrom:
                secretKeyRef:
                  name: b4mad-erdgeschoss-initial-admin
                  key: username
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: b4mad-erdgeschoss-initial-admin
                  key: password
            # The same value oauth2-proxy reads over in b4mad-agentsview, where
            # reflector mirrors this Secret. One value, one place to rotate.
            - name: AGENTSVIEW_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentsview-oidc
                  key: OAUTH2_PROXY_CLIENT_SECRET
          command:
            - /bin/bash
            - -ceu
            - |
              # NOTE: no `set -x` anywhere below — the client secret passes
              # through shell variables and must not reach the pod log.
              KCADM=/opt/keycloak/bin/kcadm.sh
              REALM=erdgeschoss
              CLIENT=agentsview
              BASE=https://keycloak.erdgeschoss.b4mad.net
              APP=https://agentsview.b4mad.industries

              # OpenShift runs this pod under a random UID with no writable
              # HOME, so kcadm's default ~/.keycloak/kcadm.config is
              # unwritable — every call must carry --config explicitly.
              CFG=/tmp/kcadm.config

              # Public route rather than the in-cluster Service: the Service
              # serves the `tls-backend` cert, which the JVM truststore does
              # not trust, while the route carries a real Let's Encrypt cert.
              $KCADM config credentials --config "$CFG" \
                --server "$BASE" \
                --realm master --user "$KC_ADMIN" --password "$KC_ADMIN_PASSWORD"

              # Confidential, auth-code only: oauth2-proxy is a server-side
              # client with a secret, so no implicit and no direct grant.
              CLIENT_ARGS=(
                -s "clientId=$CLIENT"
                -s 'name=AgentsView'
                -s enabled=true
                -s protocol=openid-connect
                -s publicClient=false
                -s standardFlowEnabled=true
                -s implicitFlowEnabled=false
                -s directAccessGrantsEnabled=false
                -s serviceAccountsEnabled=false
                -s "secret=$AGENTSVIEW_CLIENT_SECRET"
                -s "redirectUris=[\"$APP/oauth2/callback\"]"
                -s "webOrigins=[\"$APP\"]"
                # Sign-out from AgentsView should end the Keycloak session too.
                # ⚠️ The inner quotes are mandatory. kcadm reads an unquoted
                # dot as a nested JSON path, so `attributes.post.logout...`
                # is parsed as attributes -> post -> logout -> ... and the
                # whole call dies with "Cannot parse the JSON
                # [unknown_error]" — which is exactly how this Job failed on
                # its first run. Same escaping as `config."claim.name"` in
                # setup-erdgeschoss-broker-job.yaml.
                -s "attributes.\"post.logout.redirect.uris\"=$APP/*"
              )

              CID=$($KCADM get clients --config "$CFG" -r "$REALM" \
                -q clientId="$CLIENT" --fields id --format csv --noquotes)
              if [ -z "$CID" ]; then
                echo "client '$CLIENT' missing in $REALM — creating"
                $KCADM create clients --config "$CFG" -r "$REALM" "${CLIENT_ARGS[@]}"
              else
                echo "client '$CLIENT' exists ($CID) — reconciling"
                # clientId is immutable on update; drop it from the arg list.
                $KCADM update "clients/$CID" --config "$CFG" -r "$REALM" \
                  "${CLIENT_ARGS[@]:1}"
              fi
