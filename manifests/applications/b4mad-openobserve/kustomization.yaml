apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: b4mad-openobserve

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: openobserve
      app.kubernetes.io/managed-by: op1st-emea-b4mad

resources:
  - namespace.yaml
  - openobserve-credentials.yaml
  - service.yaml
  - statefulset.yaml
  - ingress.yaml

images:
  - name: openobserve
    # Upstream's o2cr.ai registry refuses anonymous pulls of pinned tags; the
    # public ECR mirror pulls anonymously and avoids Docker Hub rate limits.
    newName: public.ecr.aws/zinclabs/openobserve
    # v0.91.0 — same version as castra's instance.
    digest: sha256:e4d9eeb5b0190c80683b5b7d9f75a5bfe5edc76eacba398978a7efcb41c98dd6
