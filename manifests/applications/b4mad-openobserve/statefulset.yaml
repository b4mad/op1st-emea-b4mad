# OpenObserve OSS, single binary, single replica.
#
# Cloned from castra's in-cluster OpenObserve (agentic-forges/castra,
# manifests/telemetry/openobserve.yaml), with these deltas:
#   - pinned to the `bridge` node: river is 92% memory-requested, bridge has 63 GiB;
#   - memory is bounded explicitly, CPU is not (see resources below);
#   - 25Gi PVC instead of 10Gi.
#
# OTLP ingest: OpenObserve takes the organization as a path segment, e.g.
#   OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve.b4mad-openobserve.svc:5080/api/<org>
#   OTEL_EXPORTER_OTLP_HEADERS:  Authorization=Basic <base64 user:password>
# gRPC :5081 carries the org as a metadata header instead.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openobserve
spec:
  serviceName: openobserve
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      # Pinned to bridge: river is memory-saturated (see b4mad-agentsview's
      # ollama move). ⚠️ The PVC is LVMS (node-local), so a volume already
      # bound on river must be deleted once after the sync; the data on it
      # is lost.
      nodeSelector:
        kubernetes.io/hostname: bridge
      # No pinned UID/GID/fsGroup: OpenShift's restricted-v2 SCC rejects
      # out-of-range ids and injects ones from the namespace's allocated range.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: openobserve
          image: openobserve
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: ZO_ROOT_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: openobserve-credentials
                  key: ZO_ROOT_USER_EMAIL
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openobserve-credentials
                  key: ZO_ROOT_USER_PASSWORD
            - name: ZO_DATA_DIR
              value: /data
            - name: ZO_TELEMETRY
              value: "false"
            # ⚠️ OpenObserve sizes its memtable and caches as a percentage of
            # *total* memory, and I don't know whether it reads the cgroup limit
            # or the host's. On river the host has ~15Gi, far above the 1Gi limit
            # below, so pin the in-memory budgets (MB) to fit inside it.
            - name: ZO_MEM_TABLE_MAX_SIZE
              value: "256"
            - name: ZO_MEMORY_CACHE_MAX_SIZE
              value: "256"
            # ZO_MEM_TABLE_MAX_SIZE caps the *sum* of all memtables (one per
            # org and stream type); reaching it rejects ingestion with
            # MemoryTableOverflowError. A memtable is only flushed at 256 MB or
            # after 600 s by default, so with several orgs ingesting (UWM
            # remote-write) the sum hit the cap first. Flush earlier instead:
            # more, smaller files for the compactor, which river's CPU affords.
            - name: ZO_MAX_FILE_SIZE_IN_MEMORY
              value: "64"
            - name: ZO_MAX_FILE_RETENTION_TIME
              value: "60"
          ports:
            - name: http
              containerPort: 5080
            - name: grpc-otlp
              containerPort: 5081
          # Memory request == limit: under node pressure pods using beyond
          # their request go first. A low CPU request with a high limit lets
          # queries and compaction burst.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: lvms-vg1
        resources:
          requests:
            storage: 25Gi
