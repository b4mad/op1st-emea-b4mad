apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-forgejo
data:
  config.js: |-
    // Renovate binds exactly one platform/endpoint per process, so the
    // Forgejo fleet is a *second* CronJob rather than a second entry here.
    // The Codeberg counterpart is `config.yaml` / CronJob `renovate`.
    module.exports = {
        "endpoint": "https://forgejo.b4mad.net/api/v1",
        "gitAuthor": "the #B4mad Renovate bot <renovate@b4mad.net>",
        "platform": "forgejo",
        "platformAutomerge": true,
        "onboardingConfigFileName": "renovate.json5",
        "binarySource": "install",
        "allowedCommands": [
          "install-tool node",
          "make readme"
        ],
        "hostRules": [
          {
            "matchHost": "registry.npmjs.org",
            "timeout": 60000
          },
          {
            "matchHost": "github.com",
            "timeout": 60000
          }
        ],
        // Autodiscovery over a curated list: repos keep migrating off
        // codeberg.org onto this forge, and a hand-edited array would drift.
        // The filter still bounds the blast radius to orgs we own.
        //
        // ⚠️ `b4mad/*` also appears in the Codeberg job's `repositories`
        // (hash-B4mad-op1st, hugo.containerimage, semantic-release). Today
        // those are empty shells here so Renovate skips them; once a repo is
        // actually migrated, DELETE it from `config.yaml` in the same commit
        // or both jobs will open duplicate PRs against the two forges.
        "autodiscover": true,
        "autodiscoverFilter": [
          "toolbxs/*",
          "b4mad/*",
          // Deliberately ONE repo, not `agentic-forges/*`. forgejo-mcp moved
          // off codeberg.org on 2026-07-29 and was dropped from the Codeberg
          // fleet in the same change; forge-agents is not yet onboarded.
          // Widen only on purpose.
          "agentic-forges/forgejo-mcp",
          // Deliberately ONE repo, not `feeldata/*`. The org migrated off
          // codeberg.org on 2026-07-28 with four repos, but only feeldata2.app
          // is to be renovated: feeldata.app is the superseded site,
          // feeldata2.app-oooooold is archived, and manifests was never
          // usefully onboarded (its Codeberg onboarding PR sat unmerged from
          // 2025-01-05 until it was closed). Widen only on purpose.
          "feeldata/feeldata2.app"
        ],
        "packageRules": [
          {
            // Unattended merging for feeldata, gated by CI. `platformAutomerge`
            // above hands the merge to Forgejo at PR-creation time, so the ONLY
            // thing standing between a bad bump and `main` is branch
            // protection: feeldata2.app `main` requires the status check glob
            // `op1st Pipelines as Code / *`. Without that rule Forgejo merges
            // immediately, before Pipelines-as-Code has posted anything.
            //
            // ⚠️ Do not enable this for a repo that has no equivalent required
            // check. Verify with:
            //   GET /api/v1/repos/<owner>/<repo>/branch_protections
            // (the forgejo-mcp `list_branch_protections` tool has been seen
            // returning an empty list for a repo that does have a rule — trust
            // the raw API, not the tool.)
            //
            // Majors are excluded on purpose: a green pipeline is much weaker
            // evidence of safety for a breaking change than for a patch.
            "matchRepositories": [
              "feeldata/**"
            ],
            "matchUpdateTypes": [
              "minor",
              "patch",
              "digest",
              "pin",
              "lockFileMaintenance"
            ],
            "automerge": true
          }
        ],
    };
