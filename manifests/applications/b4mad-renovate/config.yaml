apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate
data:
  config.js: |-
    module.exports = {
        "endpoint": "https://codeberg.org/api/v1",
        "gitAuthor": "the #B4mad Renovate bot <renovate-bot@b4mad.net>",
        "platform": "forgejo",
        "platformAutomerge": true,
        "onboardingConfigFileName": "renovate.json5",
        "binarySource": "install",
        "allowedCommands": [
          "install-tool node",
          "make readme"
        ],
        "hostRules": [
          {
            "matchHost": "registry.npmjs.org",
            "timeout": 60000
          },
          {
            "matchHost": "github.com",
            "timeout": 60000
          }
        ],
        // ⚠️ This fleet is now machdenstaat-ONLY, by operator decision on
        // 2026-08-02. Everything else was removed in one change; the entries
        // below are the whole list, not a subset of a longer one.
        //
        // The five repos dropped that day — b4mad/hash-B4mad-op1st,
        // b4mad/hugo.containerimage, goern/epaper-service, goern/hausmeister,
        // goern/sops2sealedsecret — were all verified live and primary on
        // codeberg.org at the time, and NONE of them are covered by the
        // git.b4mad.industries fleet: hugo.containerimage, epaper-service and
        // sops2sealedsecret do not exist on that forge at all,
        // hash-B4mad-op1st is an empty shell there, and hausmeister's Argo
        // source, container images and PaC webhook are all still on Codeberg
        // (Systems-dhk7). So they now receive NO dependency updates and NO CVE
        // bumps from any fleet, indefinitely, and that is intended rather than
        // an oversight. Re-enrol them here if that changes.
        //
        // This is the third time a set of repos has been dropped from a fleet
        // without a new home — after feeldata/* and toolbxs/* — so treat the
        // gap as a standing state to revisit, not a temporary one.
        "repositories": [
          // Re-enrolled 2026-08-02, reversing the 2026-07-28 removal that
          // disabled Renovate for the whole org on operator request
          // (Systems-njm). All three verified live, non-empty and unarchived
          // on codeberg.org before enrolling; lage had been pushed to that
          // morning. They live on Codeberg and nowhere else — the nine
          // machdenstaat repos on git.b4mad.industries are empty shells
          // bulk-created 2026-07-28 and never pushed to — so Codeberg is the
          // correct fleet for them.
          //
          // Expect a burst on the first run: the org has had no dependency
          // updates since 2026-07-28, twelve Renovate PRs were closed then,
          // and the three Dependency Dashboard issues were closed too, so
          // Renovate will re-open dashboards and re-raise the backlog.
          "machdenstaat/lage",
          "machdenstaat/oparl-lite-2",
          "machdenstaat/stadt-bonn-oparl"
          // ── history of removals, newest first ────────────────────────────
          // b4mad/hash-B4mad-op1st, b4mad/hugo.containerimage,
          // goern/epaper-service, goern/hausmeister and goern/sops2sealedsecret
          // removed 2026-08-02 — see the note above this array.
          // b4mad/semantic-release removed 2026-08-01: the repo no longer
          // exists on codeberg.org — it moved to git.b4mad.industries under
          // agentic-forges/, NOT b4mad/. Leaving it here failed EVERY hourly
          // run from 2026-07-29 22:10 until now (~60 jobs, ~2.5 days, silently):
          // the platform call 404s, Renovate maps that to result=unknown-error,
          // the pod exits non-zero and the whole Job fails — so one dead entry
          // takes down dependency updates for the entire fleet. Re-enrolled on
          // the Forgejo fleet in this same change — see config-git.b4mad-industries.yaml.
          // feeldata/* removed 2026-07-28: the org is being migrated off
          // codeberg.org, so renovating the soon-to-be-stale copy is wasted
          // work. Was feeldata2.app and manifests. These repos receive NO
          // dependency updates until re-enrolled against the new forge.
          // goern/cccr removed 2026-07-28: the repo no longer exists on
          // codeberg.org. Renovate logged 2x "The target couldn't be found."
          // (404) against it; an authenticated repo search with an admin
          // token returns nothing, so this is a deleted/renamed repo rather
          // than a permissions or rate-limit symptom.
          // machdenstaat/* removed 2026-07-28 and RE-ADDED 2026-08-02 — see
          // the enrolled entries at the top of this array.
          // goern/forgejo-mcp removed 2026-07-29: migrated to
          // forgejo.b4mad.net/agentic-forges/forgejo-mcp. Codeberg is now a
          // push-mirror downstream and renovating a mirror fights the
          // mirror-push. Re-enrolled on the Forgejo fleet in the same change,
          // so this repo keeps receiving updates — see config-git.b4mad-industries.yaml.
          // toolbxs/* removed 2026-07-28: git.b4mad.industries is primary for that
          // org and codeberg is a push-mirror downstream. Renovating the mirror
          // would fight the mirror-push. Re-enrol against the Forgejo endpoint.
        ],
    };
