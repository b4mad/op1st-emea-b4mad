apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "@hourly"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # A healthy full-fleet run finishes in 20-45m. Anything past 90m is
      # wedged, not slow — and because concurrencyPolicy is Forbid, a wedged
      # run blocks every subsequent schedule while holding 2Gi of the
      # namespace ResourceQuota. Observed 2026-07-28: one job Failed after
      # 5h28m, its successor was still Running at 156m. Bound the damage.
      activeDeadlineSeconds: 5400
      # Default is 6. Renovate has no fleet-level resume: every retry re-runs
      # the whole repository list from the top, so six retries meant six full
      # ~25m passes stacked back to back. That, not any single slow repo, is
      # where the 156m went (the job had burned 5 pods, 4 Error). Failures
      # here are systemic rather than flaky, so one retry is enough.
      backoffLimit: 1
      template:
        spec:
          containers:
            - image: renovate
              name: renovate
              envFrom:
                - secretRef:
                    name: renovate
              volumeMounts:
                - name: config-volume
                  mountPath: /opt/renovate/
                - name: work-volume
                  mountPath: /tmp/renovate/
                - name: ssh-key-volume
                  readOnly: true
                  mountPath: "/home/ubuntu/.ssh"
                - name: cache
                  mountPath: "/home/ubuntu/.cache"
              resources:
                limits:
                  cpu: 500m
                  memory: 2048Mi
                requests:
                  cpu: 250m
                  memory: 1024Mi
          restartPolicy: Never
          volumes:
            - name: config-volume
              configMap:
                name: renovate
            - name: work-volume
              emptyDir: {}
            # The git-managed SealedSecret, not the hand-made `ssh-key-secret`
            # that used to live here untracked (and held a *personal* key).
            # ⚠️ Inert by design: secret volumes land as root:fsGroup 0644 and
            # the pod runs as an assigned UID, so OpenSSH refuses the key as
            # "too open". Renovate clones over HTTPS with RENOVATE_TOKEN and
            # never invokes ssh — see this app's README.
            - name: ssh-key-volume
              secret:
                secretName: codeberg-org-b4mad-renovate-ssh
            - name: cache
              persistentVolumeClaim:
                claimName: renovate-cache
