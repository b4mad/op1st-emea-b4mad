apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: b4mad-renovate

commonLabels:
  app.kubernetes.io/name: renovate
  app.kubernetes.io/instance: erdgeschoss
  app.kubernetes.io/managed-by: op1st-emea-b4mad

resources:
  - codeberg-org-b4mad-renovate-ssh.yaml
  - config.yaml
  - cronjob.yaml
  - environment.yaml
  - namespace.yaml
  - pvc.yaml
  # Two quotas, enforced as an intersection — keep their numbers in lockstep.
  - resource_quota.yaml
  - compute_quota.yaml
  # git.b4mad.industries fleet — Renovate is one-platform-per-process, so this is
  # a parallel CronJob rather than extra config on the Codeberg one.
  - config-git.b4mad-industries.yaml
  - cronjob-forgejo.yaml
  - environment-forgejo.yaml
  - pvc-forgejo.yaml

images:
  - name: renovate
    newName: docker.io/renovate/renovate:43.168
