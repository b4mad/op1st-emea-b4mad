apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami
        # ⚠️ CNPG copies the Cluster's labels onto its pods, so the Service
        # selects on this component label as well, never on the name alone.
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: umami
          image: umami
          ports:
            - containerPort: 3000
              name: http
          env:
            # Generated and rotated by the CNPG operator for the `umami` role.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: prod-app
                  key: uri
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami-secrets
                  key: APP_SECRET
            - name: TWO_FACTOR_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: umami-secrets
                  key: TWO_FACTOR_ENCRYPTION_KEY
          # Prisma migrations run before Next.js binds :3000, so first start
          # takes a while. The startupProbe holds readiness/liveness off until
          # the port answers (up to 30 x 5s = 150s) instead of logging
          # "connection refused" warnings.
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
