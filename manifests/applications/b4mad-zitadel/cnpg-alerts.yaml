# CloudNativePG alerts for the zitadel database (cluster "prod").
#
# Group cnp-default.rules is the upstream sample, unmodified except for the
# object name/labels:
# https://github.com/cloudnative-pg/cloudnative-pg/blob/main/docs/src/samples/monitoring/prometheusrule.yaml
# ReplicaFailingReplication there is what catches a replica that left the
# primary's timeline (seen on prod-3, 2026-11-26): the cluster STATUS stays
# "healthy" and cnpg_pg_replication_lag stays 0, only the WAL receiver is down.
#
# Group zitadel.postgres is ours.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zitadel-postgres
  labels:
    openshift.io/cluster-monitoring: "true"
spec:
  groups:
  - name: cnp-default.rules
    rules:
    - alert: LongRunningTransaction
      annotations:
        description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
        summary: A query is taking longer than 5 minutes.
      expr: |-
        cnpg_backends_max_tx_duration_seconds > 300
      for: 1m
      labels:
        severity: warning
    - alert: BackendsWaiting
      annotations:
        description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes
        summary: If a backend is waiting for longer than 5 minutes
      expr: |-
        cnpg_backends_waiting_total > 300
      for: 1m
      labels:
        severity: warning
    - alert: PGDatabaseXidAge
      annotations:
        description: Over 300,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
        summary: Number of transactions from the frozen XID to the current one
      expr: |-
        cnpg_pg_database_xid_age > 300000000
      for: 1m
      labels:
        severity: warning
    - alert: PGReplication
      annotations:
        description: Standby is lagging behind by over 300 seconds (5 minutes)
        summary: The standby is lagging behind the primary
      expr: |-
        cnpg_pg_replication_lag > 300
      for: 1m
      labels:
        severity: warning
    - alert: LastFailedArchiveTime
      annotations:
        description: Archiving failed for {{ $labels.pod }}
        summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
      expr: |-
        (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
        and on(namespace, pod) cnpg_pg_replication_in_recovery == 0
      for: 1m
      labels:
        severity: warning
    - alert: DatabaseDeadlockConflicts
      annotations:
        description: There have been over 10 deadlocks in the last hour in {{ $labels.pod }}
        summary: Checks the number of database conflicts
      expr: |-
        increase(cnpg_pg_stat_database_deadlocks[1h]) > 10
      for: 1m
      labels:
        severity: warning
    - alert: ReplicaFailingReplication
      annotations:
        description: Replica {{ $labels.pod }} is failing to replicate
        summary: Checks if the replica is failing to replicate
      expr: |-
        cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
      for: 1m
      labels:
        severity: warning
  - name: zitadel.postgres
    rules:
      - alert: CNPGInstanceDown
        expr: cnpg_collector_up{namespace="b4mad-zitadel"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Postgres instance not answering
          description: Instance {{ $labels.pod }} of the zitadel database has not answered its metrics query for 5 minutes.
      - alert: CNPGPodRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="b4mad-zitadel", pod=~"prod-[0-9]+"}[1h]) > 2
        labels:
          severity: warning
        annotations:
          summary: Postgres pod restarting repeatedly
          description: Pod {{ $labels.pod }} restarted more than twice in the last hour.
      - alert: CNPGBackupStale
        expr: time() - max(cnpg_collector_last_available_backup_timestamp{namespace="b4mad-zitadel"}) > 2 * 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No successful zitadel database backup for 2 days
          description: The newest backup of cluster prod is older than 48 hours (scheduled backup is daily).
