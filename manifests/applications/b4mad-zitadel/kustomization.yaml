apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomize half of the b4mad-zitadel Argo CD Application. The Zitadel Helm
# chart is the second source of that Application and reads
# values-nostromo.yaml from here (see op1st-gitops/applications/b4mad-zitadel.yaml).

namespace: b4mad-zitadel

labels:
  # includeSelectors=false: CNPG and the Helm chart select their own pods by
  # their own labels; injecting ours into selectors would match nothing.
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: zitadel
      app.kubernetes.io/managed-by: op1st-emea-b4mad

resources:
  - namespace.yaml
  - postgresql.yaml
  - service-ca.yaml

  # SealedSecrets; each paired *.enc.yaml is the SOPS-encrypted source of
  # truth (see README.md "Secrets"). All three must exist before the first
  # sync: the chart's setup Job and both Deployments reference them.
  - aws-creds.yaml
  - zitadel-masterkey.yaml
  - zitadel-login.yaml
  # credentials.json of the cloudflared tunnel (generate-secrets.sh
  # --tunnel-credentials).
  - zitadel-cloudflared.yaml
  # Password of the SMTP mailbox (generate-secrets.sh --smtp-password-file).
  - zitadel-smtp.yaml

  # Public access: cloudflared tunnel for id.b4mad.industries — login + OIDC
  # only, no APIs, no Console (see tunnel-config.yaml).
  - tunnel-deployment.yaml
  - tunnel-networkpolicy.yaml

  # Admin access (Console, gRPC/REST APIs) via the OpenShift router.
  - admin-route.yaml

  # Config as code: OpenTofu PostSync Job applying config/main.tf.
  - config-job.yaml

configMapGenerator:
  # The OpenTofu configuration (config-job.yaml).
  - name: zitadel-config-tf
    files:
      - config/main.tf
      - config/.terraform.lock.hcl
      # Branding assets (config/main.tf, "Branding"); binary, so they land
      # in binaryData. Keep them small: Argo's client-side apply stores the
      # whole ConfigMap in a 256 KiB annotation.
      - config/branding-logo.png
      - config/branding-icon.png
      - config/branding-font.ttf
  # Its environment values (TF_VAR_*). Ids and hosts, not secrets.
  - name: zitadel-config-vars
    literals:
      - TF_VAR_zitadel_domain=id.b4mad.industries
      # projections.instances; fixed at first setup (2026-11-19).
      - TF_VAR_instance_id=400322303839175122
      - TF_VAR_admin_domain=id-admin.apps.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud
      - TF_VAR_org_name=b4mad
      - TF_VAR_openshift_oauth_host=oauth-openshift.apps.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud
      - TF_VAR_namespace=b4mad-zitadel
      - TF_VAR_partitur_public_url=https://socializer.b4mad.industries
      - 'TF_VAR_smtp={"host":"www49.your-server.de:465","user":"id@b4mad-service.net","sender_address":"id@b4mad-service.net","sender_name":"#B4mad Identity"}'
      # Set by goern in the Console on 2026-11-19 and adopted here: username
      # `goern` keeps the OpenShift user name at the cluster cut-over.
      - 'TF_VAR_admin_user={"user_name":"goern","email":"goern@b4mad.net","first_name":"Christoph","last_name":"Görn","nick_name":"[GNU:]","gender":"GENDER_MALE"}'
  - name: zitadel-cloudflared-config
    files:
      - config.yaml=tunnel-config.yaml
