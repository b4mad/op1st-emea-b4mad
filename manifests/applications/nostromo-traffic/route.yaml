# Fronted by oauth2-proxy (Zitadel OIDC, bead op1st-emea-b4mad-2pv.7): the
# Service points at the proxy port, the app itself listens on loopback only.
# The host must match var.traffic_url in b4mad-zitadel/config/main.tf.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nostromo-traffic
spec:
  to:
    kind: Service
    name: nostromo-traffic
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
