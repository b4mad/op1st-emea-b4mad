# Snapshot encryption key. Sealed form of
# openshift/etcd-backup/encryption-key.enc.yaml in the b4mad-erdgeschoss-systems
# repo, which is the source of truth. Generated,
# never hand-edited:
#
#   sops -d openshift/etcd-backup/encryption-key.enc.yaml \
#     | kubeseal --context nostromo --format yaml \
#         --controller-namespace sealed-secrets \
#         --controller-name sealed-secrets-controller \
#         --namespace op1st-etcd-backup
#
# ⚠️ --namespace is mandatory: the SOPS source sets no metadata.namespace, and
# a SealedSecret sealed for the wrong namespace fails to decrypt with no useful
# error.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: etcd-backup-encryption-key
  namespace: op1st-etcd-backup
spec:
  encryptedData:
    key: 
  template:
    metadata:
      name: etcd-backup-encryption-key
      namespace: op1st-etcd-backup
