# Hetzner bucket credentials. Sealed form of
# openshift/etcd-backup/secret.enc.yaml in the b4mad-erdgeschoss-systems repo,
# which is the source of truth. Generated,
# never hand-edited:
#
#   sops -d openshift/etcd-backup/secret.enc.yaml \
#     | kubeseal --context nostromo --format yaml \
#         --controller-namespace sealed-secrets \
#         --controller-name sealed-secrets-controller \
#         --namespace op1st-etcd-backup
#
# ⚠️ Kept in a SEPARATE object from the encryption key on purpose. Holding the
# bucket credential must not also mean holding the means to decrypt what is in
# the bucket.
#
# ⚠️ --namespace is mandatory: the SOPS source sets no metadata.namespace, and
# a SealedSecret sealed for the wrong namespace fails to decrypt with no useful
# error.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: etcd-backup
  namespace: op1st-etcd-backup
spec:
  encryptedData:
    access-key: 
    host: 
    name: 
    secret-key: 
  template:
    metadata:
      name: etcd-backup
      namespace: op1st-etcd-backup
