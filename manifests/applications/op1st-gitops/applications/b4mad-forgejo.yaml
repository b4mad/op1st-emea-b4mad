apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: b4mad-forgejo
  namespace: op1st-gitops
spec:
  destination:
    namespace: b4mad-forgejo
    server: "https://api.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud:6443"
  project: b4mad
  sources:
    # Kustomize dir: namespace, secrets, backup cronjobs, borg image/pipeline.
    # Also serves as the $values ref for the chart source below.
    - repoURL: https://github.com/b4mad/op1st-emea-b4mad
      targetRevision: main
      path: manifests/applications/b4mad-forgejo
      ref: values
    # The forgejo-helm chart (OCI registry — see the forgejo-helm entry under
    # op1st-gitops/repositories/). Adopts the pre-existing CLI-installed
    # release: same releaseName + namespace.
    - repoURL: code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: 17.1.3
      helm:
        releaseName: forgejo
        valueFiles:
          - $values/manifests/applications/b4mad-forgejo/values-nostromo.yaml
  # First sync (adoption of the previously helm-CLI-installed release) was
  # reviewed and applied manually on 2026-07-24; automated since.
  #
  # 2026-07-27: auto-sync DISABLED on purpose — the test instance is being
  # torn down and reinitialised from scratch. With `automated` in place,
  # selfHeal would immediately scale the Forgejo StatefulSet back up and
  # prune would fight any manual cleanup. Restore the `automated` block below
  # once the reinitialisation is done.
  syncPolicy:
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 3
  ignoreDifferences:
    # The SSH service publishes a fixed nodePort; kube adds fields like
    # clusterIP server-side. Ignore the volatile bits kube owns.
    - kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
