apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: b4mad-lanista
  namespace: op1st-gitops
spec:
  destination:
    namespace: b4mad-lanista
    server: https://api.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud:6443
  project: b4mad
  source:
    path: manifests/applications/b4mad-lanista
    repoURL: https://github.com/b4mad/op1st-emea-b4mad
    targetRevision: main
  # No syncPolicy.automated on purpose: adopt a live, hand-applied app
  # manually (no prune), review the diff, then enable. See the app README.
