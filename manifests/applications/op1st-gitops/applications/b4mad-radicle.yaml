apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: b4mad-radicle
  namespace: op1st-gitops
spec:
  destination:
    namespace: b4mad-radicle
    server: "https://api.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud:6443"
  source:
    path: "."
    repoURL: https://git.b4mad.industries/goern/radicle-kubernetes.git
    targetRevision: HEAD
  sources: []
  project: b4mad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
