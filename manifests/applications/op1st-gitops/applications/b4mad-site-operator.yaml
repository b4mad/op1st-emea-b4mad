# The site-operator: a CronJob that triages nostromo's Alertmanager, plus the
# SvelteKit dashboard that renders its findings.
#
# Brought under GitOps 2026-08-11. Until then the namespace was reconciled only
# by `just deploy` from a laptop. Release 1.1.0 bumped the image tags in the
# overlay and pushed them, nothing applied them, and the cluster kept running
# site-operator-web:v1.0.0 — a tag that never existed in quay, because the web
# image was first built at 1.1.0. Both replicas sat in ImagePullBackOff for
# 6.5h, the Service had no endpoints, the route returned 503.
#
# NOTE: the overlay renders two resources into openshift-monitoring (a Role and
# RoleBinding granting the CronJob's ServiceAccount read access to the
# Alertmanager v2 API). That is outside this Application's destination
# namespace, so AppProject b4mad carries a matching openshift-monitoring
# destination — see ../projects/b4mad.yaml. Without it Argo refuses the whole
# sync, not just those two resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: b4mad-site-operator
  namespace: op1st-gitops
spec:
  destination:
    namespace: b4mad-site-operator
    server: https://api.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud:6443
  project: b4mad
  source:
    path: manifests/environments/nostromo
    repoURL: https://git.b4mad.industries/operate-first/site-operator
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
