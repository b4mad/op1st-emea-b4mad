    app.kubernetes.io/name: oparl-lite
  name: oparl-lite-stage
  namespace: op1st-gitops
spec:
  destination:
    namespace: machdenstaat-oparl-lite-stage
    server: https://api.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud:6443
  project: machdenstaat
  source:
    path: manifests/environment/stage
    repoURL: https://codeberg.org/machdenstaat/oparl-lite-2.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
