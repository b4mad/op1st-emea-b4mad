apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: op1st-gitops

commonLabels:
  argocd.argoproj.io/managed-by: op1st-gitops

resources:
  - namespace.yaml
  - argocd.yaml
  - argocd-gpg-keys.yaml
  - rbac.yaml
  - redis-fix.yaml
  - resource_quota.yaml
  - network-policies.yaml

  - clusters/
  - projects/
  - repositories/

  - applications/b4mad-epaper-service-tekton-secrets.yaml
  - applications/b4mad-epaper-service.yaml
  - applications/b4mad-forgejo.yaml
  - applications/b4mad-keycloak.yaml
  - applications/b4mad-matrix.yaml
  - applications/b4mad-meshtastic-gateway.yaml
  - applications/b4mad-racing.yaml
  - applications/b4mad-radicle.yaml
  - applications/b4mad-renovate.yaml
  - applications/hausmeister.yaml
  # feeldata migrated off codeberg.org 2026-07-28; the b4mad forge is now
  # primary. Kustomize fetches these at build time, so a bad URL here breaks
  # the whole op1st-gitops build, not just feeldata.
  # stage.yaml was omitted here until 2026-07-28 while applications/stage.yaml
  # existed in the repo, so feeldata-stage ran hand-applied and off GitOps --
  # it was still pointing at codeberg.org after dev and prod had moved.
  - https://git.b4mad.industries/feeldata/manifests/raw/branch/main/applications/dev.yaml
  - https://git.b4mad.industries/feeldata/manifests/raw/branch/main/applications/stage.yaml
  - https://git.b4mad.industries/feeldata/manifests/raw/branch/main/applications/prod.yaml
  - https://codeberg.org/machdenstaat/oparl-lite-2/raw/branch/main/manifests/environment/stage/argocd-application.yaml
  - https://codeberg.org/machdenstaat/lage/raw/branch/main/manifest/environment/nostromo/argocd-app.yaml
