apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: op1st
spec:
  destinations:
    - name: nostromo
      namespace: op1st-*
      server: https://api.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud:6443
  sourceRepos:
    - https://github.com/b4mad/op1st-emea-b4mad.git
    - https://codeberg.org/goern/epaper-service
    # b4mad-transactions-tekton reconciles this repo's Pipelines-as-Code
    # Repository CR into op1st-pipelines. The list is an explicit allowlist, not
    # a wildcard like AppProject b4mad's, so an Application whose source is
    # missing here fails with InvalidSpecError before it ever syncs.
    - https://git.b4mad.industries/goern/transactions
  roles:
    - name: project-admin
      description: Read/Write access to this project only
      policies:
        - p, proj:op1st:project-admin, applications, get,      op1st/*, allow
        - p, proj:op1st:project-admin, applications, create,   op1st/*, allow
        - p, proj:op1st:project-admin, applications, update,   op1st/*, allow
        - p, proj:op1st:project-admin, applications, delete,   op1st/*, allow
        - p, proj:op1st:project-admin, applications, sync,     op1st/*, allow
        - p, proj:op1st:project-admin, applications, override, op1st/*, allow
        - p, proj:op1st:project-admin, applications, action/*, op1st/*, allow
      groups:
        - op1st-plteng
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: security.openshift.io
      kind: SecurityContextConstraints
