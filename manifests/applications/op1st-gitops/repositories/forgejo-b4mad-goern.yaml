#
# Argo CD repository credential for goern/transactions, identity b4mad-gitops.
# Needed because that repo is PRIVATE — Argo cannot clone it anonymously, and
# op1st-gitops had no credential for git.b4mad.industries at all, every source
# from that forge registered here so far being public.
#
# Consumed by applications/b4mad-transactions-tekton.yaml, which reconciles that
# repo's Pipelines-as-Code Repository CR into op1st-pipelines.
#
# ⚠️ b4mad-gitops must also be a collaborator on goern/transactions with WRITE.
# Read is enough for Argo, but the same identity backs the `forgejo-b4mad` PaC
# token, and PaC commit-status updates fail silently with 404 without write.
#
# ⚠️ There is deliberately NO forgejo-b4mad-goern.enc.yaml beside this file, so
# `manage-secrets.sh reseal` will not regenerate it. The token's one durable copy
# stays b4mad-forgejo/bot-tokens.enc.yaml -> gitops-token; a second SOPS copy here
# would rotate in one place and go stale in the other. After a rotation, re-derive
# with the script that produced this file (see the commit that added it).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: forgejo-b4mad-goern
  namespace: op1st-gitops
spec:
  encryptedData:
    password: 
    type: 
    url: 
    username: 
  template:
    metadata:
      creationTimestamp: null
      labels:
        argocd.argoproj.io/secret-type: repository
      name: forgejo-b4mad-goern
      namespace: op1st-gitops
