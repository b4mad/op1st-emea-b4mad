# The Zitadel Helm chart repository (classic HTTP repo, not OCI). Public — no
# credentials — so this is a plain Secret, not a SealedSecret; the Secret only
# exists because Argo CD discovers repositories via labelled Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-helm
  namespace: op1st-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  name: zitadel-helm
  type: helm
  url: https://charts.zitadel.com
