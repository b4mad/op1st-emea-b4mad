apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: op1st-pipelines

resources:
  - namespaces.yaml
  - stubs/tekton-config.yaml

  - secrets/codeberg-op1st-gitops.yaml
  # codeberg-pusher moved to manifests/applications/op1st-pipelines-tokens/
  # and reflector-mirrored into this namespace.
  - secrets/codeberg-runner-openshift-pac.yaml
  - secrets/op1st-pipelines-coderberg-org.yaml
  - serviceaccount.yaml
  - tekton-chains.yaml
  - unprivileged-building-of-container-images-using-buildah/

  # Every Repository below carries `concurrency_limit`. Pipelines-as-Code
  # fires one PipelineRun per push and per pull-request event, and each run
  # fans out into several CI pods. Unbounded, one busy repository can put a
  # dozen build pods on river at once -- a 16 GB node whose root filesystem
  # and LVMS volume group vg1 share a single SATA SSD. Runs above the limit
  # are queued by PaC, not failed.
  - repositories/forgejo-agentic-forges-castra.yaml
  - repositories/codeberg-org-machdenstaat-lage.yaml
  - repositories/forgejo-agentic-forges-forge-agents.yaml
  - repositories/github-com-b4mad-op1st-emea-b4mad.yaml
  - repositories/forgejo-operate-first-op1st-emea-b4mad.yaml
  - repositories/forgejo-toolbxs-borgmatic.yaml
  - repositories/forgejo-toolbxs-code-insiders.yaml
  - repositories/forgejo-toolbxs-fedora-toolbox.yaml

patches:
  - patch: |-
      apiVersion: operator.tekton.dev/v1alpha1
      kind: TektonConfig
      metadata:
        name: config
      spec:
        chain:
          artifacts.oci.format: simplesigning
          artifacts.oci.storage: oci
          artifacts.pipelinerun.format: in-toto
          artifacts.pipelinerun.storage: oci
          artifacts.taskrun.format: in-toto
          artifacts.taskrun.storage: oci
          disabled: false
          options: {}
        pipeline:
          enable-provenance-in-status: true
          enable-bundles-resolver: true
          enable-hub-resolver: true
          hub-resolver-config:
            default-tekton-hub-catalog: Tekton 
            default-artifact-hub-task-catalog: tekton-catalog-tasks 
            default-artifact-hub-pipeline-catalog: tekton-catalog-pipelines 
            default-kind: task 
            default-type: artifact
            artifact-hub-api: https://artifacthub.io
          enable-cluster-resolver: true
        platforms:
          openshift:
            pipelinesAsCode:
              enable: true
              settings:
                auto-configure-new-github-repo: "true"
                hub-catalog-name: tekton-catalog-tasks
                hub-url: https://artifacthub.io
                remote-tasks: "true"
                application-name: op1st Pipelines as Code
                custom-console-name: op1st Pipelines as Code
                custom-console-url: >-
                  https://console-openshift-console.apps.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud
                custom-console-url-pr-details: >-
                  https://console-openshift-console.apps.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud/k8s/ns/{{ namespace }}/tekton.dev~v1~PipelineRun/{{ pr }}
                custom-console-url-pr-tasklog: >-
                  https://console-openshift-console.apps.nostromo.erdgeschoss.b4mad.emea.operate-first.cloud/k8s/ns/{{ namespace }}/tekton.dev~v1~PipelineRun/{{ pr }}/logs/{{ task }}
        pruner:
          resources:
            - taskrun
            - pipelinerun
          # Namespace-wide retention, not per-Pipeline: the total number of
          # runs kept per namespace. Every retained PipelineRun also retains
          # its workspace volumeClaimTemplate PVC, and a TopoLVM PV carries
          # nodeAffinity for the node it was provisioned on -- so retention
          # here is directly a claim on one node's LVM thin pool, not just on
          # etcd. Deleted runs lose nothing: Tekton Results archives every run
          # and its logs (results.tekton.dev/stored=true) before the pruner
          # ever sees it.
          keep: 20
          # Hourly, not daily. Pipelines-as-Code runs arrive in bursts, and the
          # pruner only enforces `keep` at the moment it runs -- a daily
          # schedule lets a namespace sit a full day above the limit (observed
          # 2026-08-04: 62 runs in op1st-pipelines = 49 kept + 13 created since
          # the 01:00 prune). Hourly bounds the overshoot to one hour.
          schedule: "0 * * * *"
          # Do NOT set `prune-per-resource: true`. With `true` the pruner
          # enumerates parent Pipelines and prunes per-Pipeline, so runs
          # created from an inline pipelineSpec (all Pipelines-as-Code runs
          # here) have no parent to enumerate and are never pruned.
          #
          # It is also deliberately not declared as `false`: false is the
          # default, the field is omitempty, so the operator never writes it
          # back to the live TektonConfig. Declaring it kept this Application
          # permanently OutOfSync in ArgoCD against a diff that could never
          # converge. Omitting it is behaviourally identical -- verified in
          # the generated pruner CronJob args, which still end in `;false`.
