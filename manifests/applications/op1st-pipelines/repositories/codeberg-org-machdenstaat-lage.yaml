# Adopted into GitOps on 2026-08-26. This Repository was created by a hand
# `oc apply` and carried no ArgoCD tracking id, so its concurrency was
# unbounded and invisible to review. It is the repository whose four
# simultaneous `lage-on-pr-*` PipelineRuns preceded the 09:47Z river wedge.
#
# The spec below is byte-for-byte what was live, plus concurrency_limit.
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: codeberg-org-machdenstaat-lage
spec:
  url: https://codeberg.org/machdenstaat/lage
  git_provider:
    type: gitea
    url: https://codeberg.org
    secret:
      name: codeberg-runner-openshift-pac
      key: provider.token
    webhook_secret:
      name: codeberg-pac-token
      key: webhook.secret
  # Bounded so one busy repo cannot fill river with build pods; see the
  # rationale in ../kustomization.yaml. PaC queues the excess, it does not fail it.
  #
  # Raised 2 -> 4 on 2026-08-28. At 2 this repo could not clear its own
  # backlog: a queue of ~20 runs took hours to drain while peers without a
  # limit (machdenstaat/oparl-lite-2) ran six build pods at once. Build pods
  # are not pinned to river -- most schedule on bridge (63 GB, ~56% used) --
  # so the 16 GB river ceiling that motivated the original 2 is a worst-case
  # placement, not the normal one. Revert to 2 if river wedges again.
  concurrency_limit: 4
