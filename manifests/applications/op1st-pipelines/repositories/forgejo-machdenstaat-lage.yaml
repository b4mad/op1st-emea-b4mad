# Adopted into GitOps on 2026-08-26. This Repository was created by a hand
# `oc apply` and carried no ArgoCD tracking id, so its concurrency was
# unbounded and invisible to review. It is the repository whose four
# simultaneous `lage-on-pr-*` PipelineRuns preceded the 09:47Z river wedge.
#
# Moved from codeberg.org to git.b4mad.industries on 2026-11-18 (lage-lwkmj);
# the file was codeberg-org-machdenstaat-lage.yaml. Same pattern as the other
# forgejo-* Repositories here: Secret forgejo-b4mad for token and webhook.
# PaC checks the sender's permission with that token, so its account
# (b4mad-gitops) needs Admin on machdenstaat/lage; with Write, every event
# failed "unable to verify event authorization" (measured 2026-11-18).
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: forgejo-machdenstaat-lage
spec:
  url: https://git.b4mad.industries/machdenstaat/lage
  git_provider:
    type: forgejo
    url: https://git.b4mad.industries
    secret:
      name: forgejo-b4mad
      key: provider.token
    webhook_secret:
      name: forgejo-b4mad
      key: webhook.secret
  # Bounded so one busy repo cannot fill river with build pods; see the
  # rationale in ../kustomization.yaml. PaC queues the excess, it does not fail it.
  #
  # Raised 2 -> 4 on 2026-08-28. At 2 this repo could not clear its own
  # backlog: a queue of ~20 runs took hours to drain while peers without a
  # limit (machdenstaat/oparl-lite-2) ran six build pods at once. Build pods
  # are not pinned to river -- most schedule on bridge (63 GB, ~56% used) --
  # so the 16 GB river ceiling that motivated the original 2 is a worst-case
  # placement, not the normal one. Revert to 2 if river wedges again.
  #
  # Raised 4 -> 6 on 2026-10-05 on operator request. ⚠️ bridge was 97%
  # cpu-requested that day (70% used) and four runs already left pods Pending
  # with `Insufficient cpu`; a higher limit queues more pods against the same
  # node, it does not add capacity. Revert to 4 if the backlog does not drain.
  concurrency_limit: 6
