apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: forgejo-toolbxs-fedora-toolbox
spec:
  # Bounded so one busy repo cannot fill river with build pods; see the
  # rationale in ../kustomization.yaml. PaC queues the excess, it does not fail it.
  concurrency_limit: 2
  url: https://git.b4mad.industries/toolbxs/fedora-toolbox
  git_provider:
    # Explicit — PaC defaults to `github` when type is unset. The retired
    # codeberg-org-toolbxs-* CRs omitted it and worked only by accident.
    type: forgejo
    url: https://git.b4mad.industries
    secret:
      name: forgejo-b4mad
      key: provider.token
    webhook_secret:
      name: forgejo-b4mad
      key: webhook.secret
