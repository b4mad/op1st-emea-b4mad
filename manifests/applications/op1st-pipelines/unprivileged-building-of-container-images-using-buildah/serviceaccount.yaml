apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipelines-sa-userid-1000
  namespace: op1st-pipelines
# Registry credentials for the skopeo-copy push tasks. These were attached
# in-cluster out-of-band and absent from git until 2026-07-28; declared here so
# the SA is reproducible. Dropping an entry detaches it on the next sync.
#
# Deliberately NOT listed:
#   - `…-dockercfg-*`      OpenShift regenerates this itself.
#   - `builder`, `pipeline` dangling references — the live SA names them but
#                          no such Secrets exist. Kubernetes ignores missing
#                          entries, so they are cruft, not configuration; they
#                          survive only because apply merges this list rather
#                          than replacing it. Not carried over on purpose.
secrets:
  - name: op1st-pipelines-coderberg-org
  - name: codeberg-pusher
  - name: forgejo-pusher
