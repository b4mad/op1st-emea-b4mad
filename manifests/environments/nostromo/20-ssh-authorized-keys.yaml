# Additional SSH keys for the core user on every node (bridge: master, river: worker).
# The installer keys live in 99-{master,worker}-ssh (not managed here). The sshAuthorizedKeys
# of all MachineConfigs of a pool are merged, so this adds to them and does not replace them.
# Hand-edited files under ~core/.ssh/authorized_keys.d/ are not owned by the MCO and can be
# lost, which is why the keys are kept here.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 20-masters-ssh-authorized-keys
spec:
  config:
    ignition:
      version: 3.2.0
    passwd:
      users:
        - name: core
          sshAuthorizedKeys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFliOtSPgx6imLJGVHP6XAGL7XL4sFjSJhIBF2myA5vB goern@redhat.com
            - ssh-rsa  goern@x1-erdgeschoss-b4mad-net
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 20-workers-ssh-authorized-keys
spec:
  config:
    ignition:
      version: 3.2.0
    passwd:
      users:
        - name: core
          sshAuthorizedKeys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFliOtSPgx6imLJGVHP6XAGL7XL4sFjSJhIBF2myA5vB goern@redhat.com
            - ssh-rsa  goern@x1-erdgeschoss-b4mad-net
