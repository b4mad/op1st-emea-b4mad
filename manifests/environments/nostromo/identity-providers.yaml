apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  creationTimestamp: null
  name: cluster
spec:
  identityProviders:
    - mappingMethod: claim
      name: keycloak-erdgeschoss-b4mad
      openID:
        claims:
          email:
            - email
          name:
            - name
          preferredUsername:
            - preferred_username
        clientID: openshift-nostromo
        clientSecret:
          name: keycloak-erdgeschoss-b4mad-net-secret
        extraScopes: []
        issuer: "https://keycloak.erdgeschoss.b4mad.net/realms/erdgeschoss"
      type: OpenID
  # Replaces the stock provider-selection page so the console login screen
  # offers only the Keycloak provider above; see
  # oauth-provider-selection.yaml for the template and its caveats.
  templates:
    providerSelection:
      name: oauth-provider-selection-template
