# Custom OAuth provider-selection page for the console login screen.
#
# Two jobs:
#  1. hide the `kube:admin` button, leaving the Keycloak OIDC provider from
#     identity-providers.yaml as the only offered login path;
#  2. carry the #B4mad visual identity, so the login screen matches
#     b4mad.industries and git.b4mad.industries instead of the stock page.
#
# Design tokens lifted verbatim from those two sites: black ground, phosphor
# green #9bcd9b with #698b69 glow, orange hover accent, cream blinking cursor
# (#f4f1e8), Josefin Sans at weight 300, uppercase letter-spaced headings, and
# the CRT scanline overlay from `.b4mad-hero::before` on git.b4mad.industries.
#
# The Josefin Sans latin subset (SIL OFL) is embedded as a data: URI rather
# than linked from git.b4mad.industries. A cross-origin webfont would need
# CORS headers we do not control, and a login page should not depend on
# another host being reachable — or report visitors to it.
#
# ⚠️ This HIDES the kube:admin button; it does NOT disable the kubeadmin
# account. `oc login -u kubeadmin` and the provider's direct URL both keep
# working. Treat it as UX tidying, not a security control. The account-removal
# route is `oc delete secret kubeadmin -n kube-system`, which is
# IRREVERSIBLE and deliberately not done here.
#
# Base generated with `oc adm create-provider-selection-template`. The Go
# template context exposes `.Providers`, each with `.Name` and `.URL` — do not
# remove those parameters.
#
# Plain Secret, not a SealedSecret: the payload is public markup with no
# credential in it, so the sops/kubeseal pair used under secrets/ would add
# ceremony without protecting anything.
#
# Docs: OpenShift 4.21 "Customizing the web console" §6.6 "Customizing the
# login page" —
# https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/web_console/customizing-web-console
#
# To revert (restore the stock page with the kube:admin button), drop
# `spec.templates` from identity-providers.yaml and this file from
# kustomization.yaml, then delete the leftover Secret, which Argo CD does not
# prune on its own:
#   oc delete secret oauth-provider-selection-template -n openshift-config
# The authentication operator rolls out new oauth-openshift pods either way;
# expect a brief login outage while co/authentication reports Available=False.
apiVersion: v1
kind: Secret
metadata:
  name: oauth-provider-selection-template
  namespace: openshift-config
type: Opaque
stringData:
  providers.html: |
    <!DOCTYPE html>
    <html>
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>log in &middot; #B4mad</title>
        <style type="text/css">
          /* Josefin Sans (SIL OFL), latin subset, embedded as a data: URI so the
             login page makes no external request. */
          @font-face {
            font-family: "Josefin Sans";
            font-style: normal;
            font-weight: 300 600;
            font-display: swap;
            src: url(data:font/woff2;base64,) format("woff2");
          }
          :root {
            --b4-green: #9bcd9b;
            --b4-green-dim: #698b69;
            --b4-orange: orange;
            --b4-cream: #f4f1e8;
            --b4-glow: 0 0 4px #698b69, 0 0 12px rgba(105,139,105,.6), 0 0 22px rgba(105,139,105,.4);
            --b4-glow-sm: 0 0 4px rgba(105,139,105,.6);
          }
          * { box-sizing: border-box; }
          html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #000;
            color: var(--b4-green);
            font-family: "Josefin Sans", -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
            font-weight: 300;
          }
          body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
          }
          /* CRT scanlines, matching .b4mad-hero::before on git.b4mad.industries */
          body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom,
              transparent 0, transparent 2px, rgba(0,0,0,.22) 3px, rgba(0,0,0,.22) 4px);
          }
          main {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 26rem;
            text-align: center;
          }
          h1 {
            margin: 0 0 .35em;
            font-size: 1.9rem;
            font-weight: 300;
            letter-spacing: .08em;
            text-transform: uppercase;
            line-height: 1.4;
            color: var(--b4-green);
            text-shadow: var(--b4-glow);
          }
          p.sub {
            margin: 0 0 2.5rem;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: .12em;
            color: var(--b4-green);
            text-shadow: var(--b4-glow-sm);
          }
          .cursor {
            display: inline-block;
            margin-left: .08em;
            color: var(--b4-cream);
            text-shadow: 0 0 6px rgba(244,241,232,.8), 0 0 16px rgba(244,241,232,.5);
            animation: b4mad-blink 1s step-end infinite;
          }
          @keyframes b4mad-blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
          ul.idp-list { list-style: none; margin: 0; padding: 0; }
          ul.idp-list li { margin-bottom: .75rem; }
          ul.idp-list li:last-child { margin-bottom: 0; }
          a.idp-button {
            display: block;
            padding: .7rem 1.25rem;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: .06em;
            text-decoration: none;
            border-radius: .25rem;
            background: transparent;
            color: var(--b4-green);
            border: 1px solid rgba(155,205,155,.5);
            box-shadow: 0 0 8px rgba(105,139,105,.3);
            text-shadow: 0 0 4px rgba(105,139,105,.6);
            transition: all .15s;
          }
          a.idp-button:hover, a.idp-button:focus {
            color: var(--b4-orange);
            border-color: rgba(255,165,0,.6);
            box-shadow: 0 0 14px rgba(255,165,0,.4);
            text-shadow: 0 0 4px rgba(255,165,0,.5);
            outline: none;
          }
          footer {
            margin-top: 2.5rem;
            font-size: .8rem;
            letter-spacing: .1em;
            color: rgba(155,205,155,.55);
          }
          @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; }
          }
        </style>
      </head>
      <body>
        <main>
          <h1>nostromo<span class="cursor">_</span></h1>
          <p class="sub">#B4mad Network &middot; erd/G/eschoss</p>
          <ul class="idp-list">
            {{ range $provider := .Providers }}
              {{ if ne $provider.Name "kube:admin" }}
                <li>
                  <a class="idp-button" href="{{ $provider.URL }}">{{ $provider.Name }}</a>
                </li>
              {{ end }}
            {{ end }}
          </ul>
          <footer>operate first</footer>
        </main>
      </body>
    </html>
