apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openshift-gitops

resources:
  - namespace.yaml
  - clusterrole.yaml

  - rbac/integreatly-grafana.yaml
  - rbac/openshift-performanceprofiles.yaml
  - rbac/openshift-gitops-integration.yaml
  - rbac/openshift-monitoring.yaml
  - secrets/op1st-argocd-b4mad-installation.yaml

  - gitops-application.yaml

  - stubs/openshift-gitops.yaml

patches:
  - patch: |-
      apiVersion: argoproj.io/v1beta1
      kind: ArgoCD
      metadata:
        name: openshift-gitops
        namespace: openshift-gitops
      spec:
        # Do NOT add spec.nodePlacement here. The argocd-operator (v1.21.1)
        # deletes it from the ArgoCD CR within ~2 resourceVersions of any
        # writer setting it -- reproduced with a plain `oc patch`, with Argo
        # uninvolved, even though the field is valid in the v1beta1 CRD schema
        # (the CRD converts via webhook and the operator's round-trip loses
        # it). Because Argo can never make the field stick, the Application
        # stays permanently OutOfSync and re-applies forever: on 2026-08-06
        # that pinned a sync in phase=Running for 2h, drove ~8.7 operator
        # reconciles/min, and pushed etcd p99 WAL fsync from 15ms to 450ms.
        #
        # Node placement is set via openshift.io/node-selector on the
        # namespace instead -- see namespace.yaml.
        extraConfig:
          timeout.reconciliation: 600s
        resourceExclusions: |
          - apiGroups:
            - tekton.dev
            clusters:
            - '*'
            kinds:
            - TaskRun
            - PipelineRun
          - apiGroups:
            - ""
            clusters:
            - '*'
            kinds:
            - Event
            - Endpoints
          - apiGroups:
            - discovery.k8s.io
            clusters:
            - '*'
            kinds:
            - EndpointSlice
          - apiGroups:
            - coordination.k8s.io
            clusters:
            - '*'
            kinds:
            - Lease
          - apiGroups:
            - events.k8s.io
            clusters:
            - '*'
            kinds:
            - Event
        notifications:
          enabled: true
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
        usersAnonymousEnabled: true
        statusBadgeEnabled: true
        server:
          insecure: true # so that our ingress can access the service via http (not https)
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 256Mi
        applicationSet:
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
        repo:
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
        redis:
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
        controller:
          # The controller's steady-state working set on this cluster is
          # ~1.6 GiB, so a 1Gi request under-books it by 60 % and the
          # scheduler happily fills the rest of the node. Requesting 2Gi makes
          # the booking honest; the 3Gi limit bounds the burst on river, whose
          # allocatable memory is ~13 GiB.
          resources:
            limits:
              cpu: "1"
              memory: 3Gi
            requests:
              cpu: 250m
              memory: 2Gi
        sso:
          provider: dex
          dex:
            openShiftOAuth: true
            groups:
              - b4mad-members
              - cluster-admins
            resources:
              limits:
                cpu: 100m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
        rbac:
          policy: |
            g, b4mad-members, role:admin
            g, cluster-admins, role:admin
            g, system:cluster-admins, role:admin
          scopes: '[groups]'
          defaultPolicy: 'role:readonly'
