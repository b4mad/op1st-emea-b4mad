# User workload monitoring: remote-write a copy of user-project metrics to the
# in-cluster OpenObserve (manifests/applications/b4mad-openobserve).
#
# One remoteWrite entry per OpenObserve organization; the org is a path
# segment of the URL. Each entry keeps only the series of its namespace group.
# Namespaces matching none of the groups stay local to UWM Prometheus only.
#
# ⚠️ Every entry is a separate queue tailing the same WAL: CPU and memory of
# prometheus-user-workload grow with the number of entries. Keep it per group,
# not per namespace.
#
# Credentials: openobserve-remote-write (username/password of the OpenObserve
# ingest user, a member of every org below). See README.md in this directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
data:
  config.yaml: |
    prometheus:
      externalLabels:
        region: emea
        org: b4mad
        environment: nostromo
      remoteWrite:
        - name: openobserve-b4mad
          url: http://openobserve.b4mad-openobserve.svc:5080/api/b4mad/prometheus/api/v1/write
          basicAuth:
            username:
              name: openobserve-remote-write
              key: username
            password:
              name: openobserve-remote-write
              key: password
          writeRelabelConfigs:
            - sourceLabels: [namespace]
              regex: b4mad-.*
              action: keep
        - name: openobserve-machdenstaat
          url: http://openobserve.b4mad-openobserve.svc:5080/api/machdenstaat/prometheus/api/v1/write
          basicAuth:
            username:
              name: openobserve-remote-write
              key: username
            password:
              name: openobserve-remote-write
              key: password
          writeRelabelConfigs:
            - sourceLabels: [namespace]
              regex: machdenstaat-.*
              action: keep
        - name: openobserve-feeldata
          url: http://openobserve.b4mad-openobserve.svc:5080/api/feeldata/prometheus/api/v1/write
          basicAuth:
            username:
              name: openobserve-remote-write
              key: username
            password:
              name: openobserve-remote-write
              key: password
          writeRelabelConfigs:
            - sourceLabels: [namespace]
              regex: feeldata-.*
              action: keep
